<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OUTFIT DRAFT｜MUZE TOOL BOX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<nav class="nav"><a href="../">MUZE TOOL BOX</a><span>OUTFIT DRAFT</span></nav>
<main class="shell">
<section id="start" class="screen active">
  <div class="eyebrow">OUTFIT DRAFT</div>
  <h1>好きな衣装から、1番を決める。</h1>
  <div class="preview-placeholder">RESULT PREVIEW</div>
  <button class="primary big" data-go="member">作成する</button>
</section>

<section id="member" class="screen">
  <div class="step">01 / MEMBER</div>
  <h2>誰の衣装を選ぶ？</h2>
  <div id="memberGrid" class="member-grid"></div>
  <div class="actions"><button class="ghost" data-go="start">戻る</button><button id="toBattle" class="primary" disabled>次へ</button></div>
</section>

<section id="battle" class="screen">
  <div class="battle-head"><div><div id="roundLabel" class="step">QUARTER FINAL</div><h2 id="battleCount">1 / 4</h2></div><div id="totalProgress" class="progress">1 / 7</div></div>
  <div id="battlePair" class="battle-pair"></div>
  <button id="undoBtn" class="secondary wide" disabled>ひとつ戻る</button>
</section>

<section id="result" class="screen">
  <div class="step">RESULT</div>
  <h2>完成画像</h2>
  <div class="result-sheet"><canvas id="resultCanvas" width="1080" height="1080"></canvas></div>
  <div class="actions stacked">
    <button id="saveImage" class="primary big">画像を保存</button>
    <button id="retryBtn" class="secondary">もう一度</button>
    <button id="changeMemberBtn" class="ghost">メンバーを変える</button>
  </div>
  <p id="saveStatus" class="status"></p>
</section>
</main>
<div id="fallback" class="modal" hidden><div class="modal-inner"><button id="closeFallback">×</button><h3>画像を長押しして保存</h3><img id="fallbackImage" alt="完成画像"></div></div>
<footer>非公式ファンメイドツール / created with MUZE TOOL BOX</footer>
<script src="./app.js"></script>
</body>
</html>
