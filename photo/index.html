<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f1ebe1"><title>MUZE PHOTO | MUZE TOOL BOX</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--desk:#f1ebe1;--paper:#fff;--ink:#40382f;--faded:#8f8577;--pink:#e889a3;--mint:#a4c5af;--hand:"Klee One","Yu Gothic",cursive;--goth:"Zen Kaku Gothic New","Hiragino Sans",sans-serif}
*{box-sizing:border-box}html{touch-action:manipulation;-webkit-text-size-adjust:100%}button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(rgba(64,56,47,.05) 1px,transparent 1px) 0 0/22px 22px,var(--desk);color:var(--ink);font-family:var(--goth)}
.wrap{max-width:720px;margin:auto;padding:12px 16px 48px}.nav{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#ffffffc9;border:1px solid #40382f22;padding:9px 11px;margin-bottom:24px}.nav a{color:inherit;text-decoration:none;font-size:12px}.brand{font-family:var(--hand);font-weight:600}
h1{font-family:var(--hand);font-size:31px;margin:8px 0 0}.lead{font-size:13px;color:var(--faded);margin:4px 0 22px}.paper{background:var(--paper);padding:16px;box-shadow:0 10px 24px #40382f20;position:relative}.paper:before{content:"";position:absolute;width:72px;height:19px;background:#e889a3bb;top:-10px;left:50%;transform:translateX(-50%) rotate(-3deg)}
.upload{border:1.5px dashed #8f857777;padding:28px 16px;text-align:center;cursor:pointer}.upload strong{display:block;font-family:var(--hand);font-size:18px}.upload small{color:var(--faded)}input[type=file]{display:none}
.editor{display:none}.stage{position:relative;margin:0 auto;background:#e9e5df;overflow:hidden;touch-action:none;user-select:none}.stage canvas{display:block;width:100%;height:auto}.sticker{position:absolute;left:50%;top:50%;width:82px;height:82px;transform:translate(-50%,-50%);display:grid;place-items:center;font-size:48px;line-height:1;cursor:grab;touch-action:none;filter:drop-shadow(0 2px 4px #0002)}.sticker.selected{outline:2px dashed #fff;outline-offset:2px}.sticker .bubble{position:absolute;inset:4px;border-radius:50%;background:#fffffff0;filter:blur(1px);z-index:-1}.sticker.no-bg .bubble{display:none}
.controls{margin-top:18px}.label{font-size:12px;font-weight:700;margin:15px 0 7px}.range{display:grid;grid-template-columns:45px 1fr 42px;gap:9px;align-items:center;font-size:11px;color:var(--faded)}input[type=range]{width:100%;accent-color:var(--pink)}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.emoji{border:1px solid #40382f26;background:#fff;padding:9px 0;font-size:23px;border-radius:0}.emoji:active{background:#f7eef1}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:1.5px solid var(--ink);background:#fff;color:var(--ink);padding:10px 13px;font:700 12px var(--goth)}.btn.primary{background:var(--ink);color:#fff;flex:1}.btn.danger{border-color:#b56b6b;color:#9c5555}.hint{font-size:11px;color:var(--faded);line-height:1.7;margin-top:9px}.privacy{font-size:11px;color:var(--faded);text-align:center;margin:18px 0}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#40382f;color:#fff;padding:9px 14px;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.sticker{will-change:transform;width:82px!important;height:82px!important}.sticker .bubble{transform:scale(var(--sticker-scale,1))}.sticker>span:last-child{display:block;transform:scale(var(--sticker-scale,1));transform-origin:center}.toast.on{opacity:1}
@media(max-width:520px){.emojis{grid-template-columns:repeat(4,1fr)}h1{font-size:28px}}
</style></head><body><div class="wrap">
<nav class="nav"><a class="brand" href="../">Muze Tool Box</a><a href="../">← TOOL BOXにもどる</a></nav>
<h1>MUZE PHOTO</h1><p class="lead">写真をふわっと。ファンマで顔かくし。</p>
<section class="paper">
<label class="upload" id="uploadBox"><input id="file" type="file" accept="image/*"><strong>写真をえらぶ</strong><small>タップしてカメラロールから選択</small></label>
<div class="editor" id="editor"><div class="stage" id="stage"><canvas id="canvas"></canvas></div>
<div class="controls"><div class="label">ふわっと加工</div><div class="range"><span>そのまま</span><input id="soft" type="range" min="0" max="100" value="32"><span>ふわっ</span></div>
<div class="label">ファンマを追加</div><div class="emojis" id="emojis"></div>
<div class="row"><button class="btn" id="outline">外枠 ON</button><button class="btn" id="bg">白ふわ ON</button><button class="btn" id="smaller">− 小さく</button><button class="btn" id="larger">＋ 大きく</button><button class="btn danger" id="remove">選択を削除</button></div>
<p class="hint">ファンマは何個でも追加できます。ドラッグで移動、選択して「小さく / 大きく」でサイズ調整できます。</p>
<div class="row"><button class="btn" id="change">写真を変える</button><button class="btn primary" id="save">画像を保存</button></div></div></div>
</section><p class="privacy">写真はアップロードされません。加工はこの端末のブラウザ内だけで行います。</p></div><div class="toast" id="toast"></div>
<script>
const marks=['☕️','💖','🦅','🐰','🐿️','🍓','🦄','⚾️']; const file=document.querySelector('#file'),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),stage=document.querySelector('#stage'),editor=document.querySelector('#editor'),uploadBox=document.querySelector('#uploadBox'),soft=document.querySelector('#soft'),toast=document.querySelector('#toast');let img=null,selected=null,stickers=[],whiteBg=true,showOutline=true;
marks.forEach(m=>{let b=document.createElement('button');b.className='emoji';b.textContent=m;b.type='button';b.onclick=()=>addSticker(m);document.querySelector('#emojis').appendChild(b)});
function say(t){toast.textContent=t;toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),1500)}
file.onchange=()=>{let f=file.files[0];if(!f)return;let url=URL.createObjectURL(f),im=new Image();im.onload=()=>{img=im;let max=1600,s=Math.min(1,max/Math.max(im.width,im.height));canvas.width=Math.round(im.width*s);canvas.height=Math.round(im.height*s);stage.style.aspectRatio=canvas.width+'/'+canvas.height;draw();uploadBox.style.display='none';editor.style.display='block';stickers.forEach(x=>x.el.remove());stickers=[];selected=null;URL.revokeObjectURL(url)};im.src=url};
function draw(){if(!img)return;let v=+soft.value/100;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.filter='brightness('+(1+v*.10)+') saturate('+(1-v*.10)+') contrast('+(1-v*.08)+')';ctx.drawImage(img,0,0,canvas.width,canvas.height);ctx.filter='none';if(v>0){ctx.globalCompositeOperation='screen';ctx.globalAlpha=v*.10;ctx.fillStyle='#fff7fb';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}}soft.oninput=draw;
function addSticker(mark){let el=document.createElement('div');el.className='sticker'+(whiteBg?'':' no-bg');el.innerHTML='<span class="bubble"></span><span>'+mark+'</span>';stage.appendChild(el);let o={el,x:50,y:50,size:82,mark,bg:whiteBg};stickers.push(o);select(o);position(o);drag(o)}
function select(o){stickers.forEach(x=>x.el.classList.remove('selected'));selected=o;if(o&&showOutline)o.el.classList.add('selected')}
function position(o){o.el.style.left=o.x+'%';o.el.style.top=o.y+'%';o.el.style.setProperty('--sticker-scale',o.size/82);o.el.style.fontSize='48px'}
function drag(o){o.el.onpointerdown=e=>{select(o);o.el.setPointerCapture(e.pointerId);let r=stage.getBoundingClientRect();const move=ev=>{o.x=Math.max(0,Math.min(100,(ev.clientX-r.left)/r.width*100));o.y=Math.max(0,Math.min(100,(ev.clientY-r.top)/r.height*100));position(o)};o.el.onpointermove=move;o.el.onpointerup=()=>{o.el.onpointermove=null}}}
document.querySelector('#larger').onclick=()=>{if(selected){selected.size=Math.min(180,selected.size+12);position(selected)}};
document.querySelector('#smaller').onclick=()=>{if(selected){selected.size=Math.max(38,selected.size-12);position(selected)}};
document.querySelector('#remove').onclick=()=>{if(selected){selected.el.remove();stickers=stickers.filter(x=>x!==selected);selected=null}};
document.querySelector('#outline').onclick=e=>{showOutline=!showOutline;e.target.textContent='外枠 '+(showOutline?'ON':'OFF');stickers.forEach(x=>x.el.classList.remove('selected'));if(selected&&showOutline)selected.el.classList.add('selected')};
document.querySelector('#bg').onclick=e=>{whiteBg=!whiteBg;e.target.textContent='白ふわ '+(whiteBg?'ON':'OFF');if(selected){selected.bg=whiteBg;selected.el.classList.toggle('no-bg',!whiteBg)}};
document.querySelector('#change').onclick=()=>file.click();
document.querySelector('#save').onclick=()=>{if(!img)return;let out=document.createElement('canvas');out.width=canvas.width;out.height=canvas.height;let c=out.getContext('2d');c.drawImage(canvas,0,0);let r=stage.getBoundingClientRect(),sx=out.width/r.width;c.textAlign='center';c.textBaseline='middle';stickers.forEach(o=>{let x=o.x/100*out.width,y=o.y/100*out.height,size=o.size*sx;if(o.bg){c.save();c.fillStyle='rgba(255,255,255,.92)';c.shadowColor='rgba(255,255,255,.7)';c.shadowBlur=size*.16;c.beginPath();c.arc(x,y,size*.46,0,Math.PI*2);c.fill();c.restore()}c.font=(size*.58)+'px "Apple Color Emoji","Segoe UI Emoji",sans-serif';c.fillText(o.mark,x,y+size*.02)});out.toBlob(async blob=>{let shareFile=new File([blob],'muze-photo.png',{type:'image/png'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[shareFile]})){try{await navigator.share({files:[shareFile]});say('共有シートを開きました');return}catch(err){if(err&&err.name==='AbortError')return}}let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='muze-photo.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);say('画像を保存しました')},'image/png')};
</script></body></html>
