<nav class="tool-nav" aria-label="共通ナビゲーション">
  <div class="tool-nav-inner">
    <a class="tool-nav-brand" href="https://rikomuze.github.io/muze-tool-box/">Muze Tool Box</a>
    <div class="tool-nav-links">
      <a href="https://rikomuze.github.io/muze-tool-box/">MUZE TOOL BOXのトップ</a>
      <a href="https://rikomuze.github.io/muze-tool-box/exchange-log/">前の交換ログ</a>
    </div>
  </div>
</nav>
<main class="wrap">
  <div class="head">
    <h1>取引ログ<span class="beta">おためし版</span></h1>
    <button class="keychip" id="keyOpen" type="button">KEY ----</button>
  </div>
  <div class="sync" id="sync" role="status">この端末に保存</div>
  <div class="notice" id="importNote" hidden></div>
  <div class="tabs" role="group" aria-label="表示">
    <button class="tab" id="tabOpen" type="button" aria-pressed="true">やること</button>
    <button class="tab" id="tabDone" type="button" aria-pressed="false">履歴</button>
  </div>
  <input class="search" id="search" type="search" placeholder="相手・メンバー・グッズでさがす" aria-label="さがす">
  <div class="list" id="list"></div>
  <button class="link muted" id="importBtn" type="button">前の交換ログから、新しい記録を読み込む</button>
</main>
<button class="fab" id="add" type="button">＋ 取引を追加</button>
<div class="sheet" id="wiz" hidden role="dialog" aria-modal="true" aria-label="取引を登録"></div>
<div class="sheet" id="detail" hidden role="dialog" aria-modal="true" aria-label="取引のくわしい内容"></div>
<div class="keydlg" id="keyDlg" hidden role="dialog" aria-modal="true" aria-label="MUZE KEY">
  <div class="keybox">
    <h2>MUZE KEY</h2>
    <p>MUZE TOOL BOXで使う共通KEYです。取引ログは、このKEYで暗号化してからクラウドに保存します。</p>
    <p><b style="color:var(--ink)">このKEYはスクショやメモで必ず保管してください。</b>KEYをなくすと、運営側でも記録を戻せません。</p>
    <input class="keyval" id="keyValue" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="MUZE KEY">
    <div class="grid2"><button class="btn" id="keyCopy" type="button">コピー</button><button class="btn dark" id="keyUse" type="button">このKEYを使う</button></div>
    <button class="link" id="keyClose" type="button">閉じる</button>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"></div>
<input type="file" id="photoInput" accept="image/*" multiple hidden>
<script src="../assets/muze-key.js"></script>
<script src="../assets/goods-catalog.js?v=2026.11.09-1"></script>
