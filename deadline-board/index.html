<title>締め切り・出演ボード｜MUZE TOOL BOX</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Montserrat:wght@500;600;700&display=swap">
<style>
/* Layout: MUZE TOOL BOX の「作業机の上の紙もの」。机ベージュ＋ドットの上に白い半券を1件1行で並べ、決めたものにはマステを貼る。下のドックで リスト⇄カレンダー。単一ライトテーマで固定 */
:root{
  color-scheme:light;
  --desk:#f1ebe1; --paper:#ffffff; --pencil:#40382f; --faded:#6f6456;
  --line:rgba(64,56,47,.2); --line2:rgba(64,56,47,.35);
  --berry:#e27a94; --berry-ink:#a8445f; --berry-soft:#f7dde3;
  --mint:#a4c5af; --mint-ink:#3d6a4c; --mint-soft:#e2eee5;
  --lav:#bfaee3; --lav-ink:#5b4a8a; --lav-soft:#efe5ff;
  --red:#c0472f; --red-soft:#f6dcd6;
  --shadow:0 4px 12px rgba(64,56,47,.14);
  --f-hand:"Klee One","Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-num:"Montserrat","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:radial-gradient(rgba(64,56,47,.07) 1px,transparent 1px) 0 0/22px 22px,var(--desk);color:var(--pencil);font-family:var(--f-body);font-size:15px;line-height:1.55;font-feature-settings:"palt" 1}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--desk)}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--berry-ink);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 12px;display:flex;flex-direction:column;gap:14px}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.label{position:relative;display:inline-block;background:var(--paper);padding:3px 12px 4px;transform:rotate(-2deg);box-shadow:var(--shadow);font-family:var(--f-num);font-weight:700;font-size:10px;letter-spacing:.18em}
.label::before{content:"";position:absolute;top:-6px;left:-10px;width:34px;height:12px;background:rgba(226,122,148,.85);transform:rotate(-12deg)}
h1{font-family:var(--f-hand);font-weight:600;font-size:26px;line-height:1.2;margin:8px 0 0}
.addbtn{flex:none;width:48px;height:48px;border-radius:50%;border:1.5px solid var(--pencil);background:var(--paper);font-size:24px;line-height:1;cursor:pointer;box-shadow:var(--shadow);transform:rotate(3deg)}

/* next slip */
.next{position:relative;background:var(--paper);box-shadow:0 10px 24px rgba(64,56,47,.16);padding:14px 16px 12px;transform:rotate(-.6deg);display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;cursor:pointer;border:none;text-align:left;width:100%}
.next::before{content:"";position:absolute;top:-8px;right:22px;width:56px;height:16px;background:rgba(164,197,175,.85);transform:rotate(6deg)}
.next .k{font-family:var(--f-hand);font-weight:600;font-size:13px;color:var(--faded);grid-column:1/-1}
.next .t{font-weight:700;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.next .cd{font-family:var(--f-num);font-weight:700;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}
.next .cd.u{color:var(--red)}
.next .w{font-family:var(--f-num);font-size:12px;color:var(--faded);grid-column:1/-1;font-variant-numeric:tabular-nums}
.nudge{display:flex;gap:8px;flex-wrap:wrap}
.nudge button{border:1.5px dashed var(--line2);background:rgba(255,255,255,.6);padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;min-height:40px}
.nudge button b{font-family:var(--f-num)}

/* index tabs */
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;padding:3px;background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 1px var(--line)}
.tab{border:none;background:none;min-height:44px;padding:0 2px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;font-weight:700;font-size:13px;color:var(--faded);white-space:nowrap}
.tab .n{font-family:var(--f-num);font-weight:700;font-size:11.5px;min-width:20px;padding:1px 6px;border-radius:999px;background:var(--desk);color:var(--pencil);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--pencil);color:var(--paper)}
.tab[aria-selected="true"] .n{background:rgba(255,255,255,.22);color:var(--paper)}


/* chips (pen-circled ellipses) */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-block:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line2);background:transparent;border-radius:50%;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;min-height:36px}
.chip:nth-child(odd){transform:rotate(-1.5deg)}.chip:nth-child(even){transform:rotate(1.2deg)}
.chip[aria-pressed="true"]{background:var(--pencil);color:var(--paper);border-color:var(--pencil)}

/* sections */
.sec{display:flex;flex-direction:column;gap:8px}
.sec h2{font-family:var(--f-hand);font-weight:600;font-size:15px;margin:6px 2px 0;display:flex;gap:8px;align-items:baseline}
.sec h2 .n{font-family:var(--f-num);font-size:12px;color:var(--faded);font-weight:600}
.empty{border:1.5px dashed var(--line2);background:rgba(255,255,255,.45);padding:18px 16px;text-align:center;font-family:var(--f-hand);font-weight:600;font-size:14px;color:var(--faded)}

/* card = 1行の半券 */
.card{position:relative;display:grid;grid-template-columns:58px minmax(0,1fr) auto;align-items:center;background:var(--paper);box-shadow:var(--shadow);min-height:68px}
.card:nth-child(odd){transform:rotate(-.25deg)}.card:nth-child(even){transform:rotate(.2deg)}
.card .tape{position:absolute;top:-6px;left:10px;width:38px;height:12px;transform:rotate(-8deg);z-index:2}
.st-go .tape{background:rgba(226,122,148,.85)}
.st-wait .tape{background:rgba(191,174,227,.9)}
.st-won .tape{background:rgba(164,197,175,.9)}
.st-miss .tape{background:rgba(192,71,47,.7)}
.st-undecided{box-shadow:none;background:rgba(255,255,255,.7);outline:1.5px dashed var(--line2);outline-offset:-1.5px}
.st-off{background:rgba(255,255,255,.5);box-shadow:none}
.st-off .stub,.st-off .ttl{opacity:.55}
.st-pass .ttl{text-decoration:line-through;text-decoration-color:var(--line2)}
.card.urgent .stub b{color:var(--red)}
.stub{align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1.5px dashed var(--line);padding:8px 2px;font-family:var(--f-num);font-variant-numeric:tabular-nums;line-height:1.1;text-align:center}
.stub .kd{font-family:var(--f-hand);font-weight:600;font-size:11px;color:var(--faded)}
.stub b{font-size:17px;font-weight:700}
.stub .wd{font-family:var(--f-body);font-size:11px;color:var(--faded);font-weight:700}
.stub .tm{font-size:12px;font-weight:600;margin-top:2px}
.mid{min-width:0;padding:10px 8px 10px 12px;cursor:pointer;background:none;border:none;text-align:left;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:3px}
.more-l{font-size:12px;font-weight:700;color:var(--pencil);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line2);margin-top:1px}
.mid:active{background:rgba(64,56,47,.05)}
.ttl{font-weight:700;font-size:15px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:keep-all;overflow-wrap:anywhere}
.sub{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--faded);white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.sub .cd{font-family:var(--f-num);font-weight:700;color:var(--pencil)}
.sub .cd.u{color:var(--red)}
.sub .rs{font-family:var(--f-num);font-weight:600;color:var(--lav-ink)}
.sub .tg{font-weight:700;color:var(--faded);overflow:hidden;text-overflow:ellipsis}
.act{display:flex;flex-direction:column;gap:6px;padding:8px 10px 8px 0;align-items:stretch}
.pb{border:1.5px solid var(--berry-ink);background:var(--berry-ink);color:#fff;font-weight:700;font-size:13px;padding:0 12px;min-height:40px;min-width:76px;cursor:pointer;white-space:nowrap;border-radius:999px}
.pb.ghost{background:var(--paper);color:var(--pencil);border-color:var(--line2)}
.pb.berry{background:var(--berry-ink);border-color:var(--berry-ink)}
.act .pb{min-height:34px;font-size:12.5px}
.act.two .pb{min-height:32px}

.steps{display:flex;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--faded);white-space:nowrap;overflow:hidden}
.stp{padding:1px 5px;border-radius:999px;border:1px solid transparent}
.stp.ok{color:var(--pencil)}
.stp.cur{border-color:var(--pencil);color:var(--pencil)}
.steps.wait .stp.cur{border-color:var(--lav-ink);color:var(--lav-ink);background:var(--lav-soft)}
.steps .sep{font-style:normal;color:var(--line2);font-size:11px}
.steps.big .sep{font-size:13px}
.steps.big{font-size:13px;gap:4px}.steps.big .stp{padding:3px 10px}
.card>.steps.row{grid-column:2/4;padding:0 10px 9px 12px;margin-top:-2px}
.card .stub{grid-row:1/span 2}
.card.has-steps .mid{padding-bottom:4px}
.dhead{font-family:var(--f-num);font-weight:700;font-size:13px;color:var(--faded);margin:6px 2px -2px}
/* calendar */
.cal{background:var(--paper);box-shadow:var(--shadow)}
.cal-head{display:flex;align-items:center;gap:6px;padding:10px 10px 8px;border-bottom:1.5px dashed var(--line)}
.cal-head h2{flex:1;margin:0;font-family:var(--f-num);font-weight:700;font-size:18px;text-align:center;font-variant-numeric:tabular-nums}
.cal-head h2 small{font-family:var(--f-hand);font-weight:600;font-size:13px;margin-left:2px}
.nav{width:44px;height:44px;border:none;background:none;font-size:22px;cursor:pointer;border-radius:50%}
.today-b{border:1.5px solid var(--line2);background:none;border-radius:50%;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;min-height:34px}
.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 12px;padding:8px 8px 4px;font-size:11px;color:var(--faded);font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:4px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:0 4px 8px}
.dow{text-align:center;font-size:11px;font-weight:700;color:var(--faded);padding:4px 0}
.dow.sun{color:var(--red)}.dow.sat{color:var(--lav-ink)}
.day{border:none;background:none;min-height:46px;padding:4px 0 2px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:0}
.day .dn{font-family:var(--f-num);font-weight:600;font-size:14px;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.day.out .dn{opacity:.3}
.day.sun .dn{color:var(--red)}.day.sat .dn{color:var(--lav-ink)}
.day.today .dn{box-shadow:inset 0 0 0 1.5px var(--pencil)}
.day.sel .dn{background:var(--pencil);color:var(--paper)}
.dots{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;max-width:34px;min-height:7px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.d-go{background:var(--berry)}.d-undecided{box-shadow:inset 0 0 0 1.5px var(--faded)}.d-wait{background:var(--lav)}.d-won{background:var(--mint)}.d-off{background:var(--line2)}
.d-result{border-radius:1px;transform:rotate(45deg) scale(.9)}
.daylist{display:flex;flex-direction:column;gap:8px}
.daylist h3{font-family:var(--f-hand);font-weight:600;font-size:16px;margin:4px 2px 0}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:8;background:rgba(241,235,225,.96);backdrop-filter:blur(6px);border-top:1.5px dashed var(--line2);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock-in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.seg{flex:1;display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 1px var(--line);padding:3px;gap:3px}
.seg button{border:none;background:none;min-height:42px;font-weight:700;font-size:14px;color:var(--faded);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pencil);color:var(--paper)}

/* sheets */
/* dialog 自体はスクロールさせない。UA の overflow:auto のまま高さだけ画面いっぱいにすると、
   動ける量がほぼ 0 のスクロールになり、下スワイプが背面のページへ伝わって一瞬固まる。 */
dialog{border:none;padding:0;background:var(--paper);color:var(--pencil);width:100%;max-width:560px;max-height:88vh;margin:auto auto 0;box-shadow:0 -10px 30px rgba(64,56,47,.2);top:auto;bottom:0;height:auto;overflow:hidden;overscroll-behavior:none}
/* 開いているときだけ flex にする。dialog 全体に display を書くと、閉じたダイアログを隠す UA の display:none より優先されて常に表示されてしまう。 */
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(64,56,47,.45);overflow:hidden;overscroll-behavior:none}
html.modal-open,html.modal-open body{overscroll-behavior:none}
.sheet{padding:8px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;position:relative;flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
@media (min-width:640px){dialog{top:0;bottom:0;height:fit-content;margin:auto;max-height:84vh}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:10px auto 2px;flex:none;touch-action:none;cursor:grab;position:relative}
.grab::before{content:"";position:absolute;left:-80px;right:-80px;top:-12px;height:36px}
.sheet h3{font-family:var(--f-hand);font-weight:600;font-size:19px;line-height:1.4;margin:0}
.meta-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.stamp{font-size:12px;font-weight:700;padding:2px 10px;border:1.5px solid currentColor;border-radius:50%;transform:rotate(-2deg)}
.stamp.go{color:var(--pencil)}.stamp.wait{color:var(--lav-ink)}.stamp.won{color:var(--mint-ink)}.stamp.undecided,.stamp.off{color:var(--faded)}.stamp.miss{color:var(--red)}
.tagt{font-size:12px;font-weight:700;color:var(--faded)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-left:1.5px dashed var(--line2);margin-left:6px}
.tl li{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:6px 0 6px 14px;position:relative;align-items:baseline}
.tl li::before{content:"";position:absolute;left:-5px;top:13px;width:8px;height:8px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--line2)}
.tl li.now::before{background:var(--berry)}
.tl li.done{color:var(--faded)}
.tl .k{font-family:var(--f-hand);font-weight:600;font-size:13px}
.tl .v{font-family:var(--f-num);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.tl .rn{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--faded)}
.tl li.now .v{color:var(--pencil)}
.desc{font-size:13.5px;line-height:1.7;margin:0;overflow-wrap:anywhere}
.src{font-size:11.5px;color:var(--faded)}
.linkb{display:flex;align-items:center;justify-content:center;min-height:44px;border:1.5px solid var(--line2);font-weight:700;font-size:14px;text-decoration:none;color:var(--pencil);background:var(--paper)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .pb{flex:1;min-height:46px;font-size:14px}
.minor{display:flex;justify-content:space-between;gap:8px;border-top:1.5px dashed var(--line);padding-top:10px}
.txtb{border:none;background:none;font-size:13px;font-weight:700;color:var(--faded);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:40px;padding:0 4px}
.txtb.red{color:var(--red)}
.x{position:absolute;top:8px;right:8px;width:44px;height:44px;border:none;background:none;font-size:20px;cursor:pointer;color:var(--faded);z-index:4}
/* カレンダーに追加 */
.calbox{display:flex;flex-direction:column;gap:8px;border-top:1.5px dashed var(--line);padding-top:12px}
.calbox .cap{font-size:12px;font-weight:700;color:var(--faded)}
.calrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.calrow .linkb{font-size:13.5px;cursor:pointer;text-align:center;padding:4px 8px;line-height:1.35}
.calrow .linkb.main{border-color:var(--pencil)}
.alarm-line{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--faded)}
.alarm-opts{display:flex;flex-wrap:wrap;gap:6px}
.alarm-opts button{min-height:40px;padding:4px 12px;border:1.5px solid var(--line2);background:var(--paper);color:var(--pencil);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.alarm-opts button[aria-pressed="true"]{background:var(--pencil);color:var(--paper);border-color:var(--pencil)}

/* form */
label{font-size:12px;font-weight:700;color:var(--faded);display:flex;flex-direction:column;gap:4px}
input,select,textarea{font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:0;padding:9px 10px;background:var(--desk);color:var(--pencil);width:100%}
textarea{min-height:130px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{font-size:13px;color:var(--faded)}
.msg.err{color:var(--red)}
.cand{display:flex;gap:10px;align-items:flex-start;border:1.5px dashed var(--line2);padding:10px;flex-direction:row;color:var(--pencil);font-weight:500}
.cand input{width:auto;margin-top:4px}
.cand b{display:block;font-size:14px}
details summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--faded);min-height:36px;display:flex;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pencil);color:var(--paper);padding:10px 16px;font-size:14px;font-weight:700;z-index:20;display:flex;gap:14px;align-items:center;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
.toast button{background:none;border:none;color:var(--berry);font-weight:700;cursor:pointer;min-height:32px}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
@media (prefers-reduced-motion:reduce){.card,.chip,.tab,.next,.label,.addbtn{transform:none!important}}
.foot{max-width:560px;margin:0 auto;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(100px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));font-size:11.5px;color:var(--faded);line-height:1.8;text-align:center}
.foot p{margin:0 0 6px}
.foot .home{display:inline-block;padding:10px 6px;margin-bottom:6px;font-weight:700;font-size:14px;color:var(--pencil);text-decoration:none}

/* きょう・あしたまで：今日の出演と、明日までの締め切りを近い順に1枚の紙にまとめる */
.soon{position:relative;background:var(--paper);box-shadow:0 10px 24px rgba(64,56,47,.16);display:flex;flex-direction:column;margin-top:4px}
.soon::before{content:"";position:absolute;top:-8px;right:22px;width:56px;height:16px;background:rgba(164,197,175,.85);transform:rotate(6deg)}
.soon-h{display:flex;align-items:center;gap:8px;padding:10px 10px 6px 16px}
.soon-h h2{flex:1;min-width:0;margin:0;font-family:var(--f-hand);font-weight:600;font-size:15px;display:flex;flex-wrap:wrap;gap:0 8px;align-items:baseline}
.soon-h .when{font-family:var(--f-num);font-size:12px;font-weight:600;color:var(--faded);white-space:nowrap}
.shareb{flex:none;display:inline-flex;align-items:center;gap:5px;min-height:40px;padding:0 12px;border:1.5px solid var(--pencil);border-radius:999px;background:var(--paper);font-weight:700;font-size:13px;cursor:pointer}
.soon-empty{padding:4px 16px 14px;font-family:var(--f-hand);font-weight:600;font-size:13px;color:var(--faded)}
.onair{display:flex;flex-direction:column;gap:6px;margin:0 10px 6px;padding:10px 12px 12px;border:2px solid var(--red);background:var(--paper);text-align:left;cursor:pointer;width:calc(100% - 20px)}
.onair .r1{display:flex;align-items:center;gap:8px}
.onair .live{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-num);font-weight:700;font-size:11.5px;letter-spacing:.08em;color:#fff;background:var(--red);border-radius:999px;padding:1px 9px}
.onair .live::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
.onair .st{font-size:12px;font-weight:700;color:var(--faded)}
.onair .cd{margin-left:auto;font-family:var(--f-num);font-weight:700;font-size:12px;color:var(--red);white-space:nowrap}
.onair .t{font-weight:700;font-size:16px;line-height:1.35}
.onair .bar{display:block;position:relative;height:5px;background:rgba(64,56,47,.12);border-radius:3px;overflow:hidden}
.onair .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--red);border-radius:3px}
.onair .ends{display:flex;justify-content:space-between;font-family:var(--f-num);font-size:11.5px;font-weight:600;color:var(--faded);font-variant-numeric:tabular-nums}
.srow{display:grid;grid-template-columns:52px 30px minmax(0,1fr) auto 8px;align-items:center;gap:8px;padding:9px 12px 9px 14px;border:none;border-top:1.5px dashed var(--line);background:none;text-align:left;cursor:pointer;min-height:52px;width:100%}
.srow:active,.arow:active{background:rgba(64,56,47,.05)}
.srow .tm,.arow .tm{display:flex;flex-direction:column;line-height:1.15;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.srow .tm small,.arow .tm small{font-family:var(--f-hand);font-weight:600;font-size:11px;color:var(--faded)}
.srow .tm b{font-size:15px;font-weight:700}
.kl{font-size:11px;font-weight:700;text-align:center;padding:1px 0;border-radius:999px}
.kl.app{background:var(--lav-soft);color:var(--lav-ink)}
.kl.due{background:var(--berry-soft);color:var(--berry-ink)}
.srow .tx,.arow .tx{min-width:0;display:flex;flex-direction:column;gap:1px}
.srow .tx b,.arow .tx b{font-weight:700;font-size:14px;line-height:1.35;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.srow .tx span,.arow .tx span{font-size:12px;color:var(--faded);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.srow .cd,.arow .cd{font-family:var(--f-num);font-weight:700;font-size:12px;white-space:nowrap}
.srow .cd.u{color:var(--red)}
.chev{font-size:16px;font-weight:700;color:var(--faded)}
/* 種類スタンプ：見る系・応募・購入で色を分ける */
.ks{font-weight:700;border:1.5px solid currentColor;border-radius:50%;padding:0 7px;font-size:11px;flex:none}
.ks.watch{color:var(--mint-ink)}.ks.apply{color:var(--berry-ink)}.ks.buy{color:#8a5a12}
/* これからの出演 */
.shows{margin-top:6px}
.shows-box{background:var(--paper);box-shadow:var(--shadow);display:flex;flex-direction:column}
.arow{display:grid;grid-template-columns:64px minmax(0,1fr) auto 8px;align-items:center;gap:6px;padding:8px 12px 8px 0;border:none;border-top:1.5px dashed var(--line);background:none;text-align:left;cursor:pointer;min-height:60px;width:100%}
.arow:first-child{border-top:none}
.arow .tm{align-items:center}
.arow .tm b{font-size:16px;font-weight:700}
/* シェア */
.share-pick{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.share-pick button{min-height:40px;padding:4px 14px;border:1.5px solid var(--line2);background:var(--paper);font-size:13px;font-weight:700;cursor:pointer}
.share-pick button[aria-pressed="true"]{background:var(--pencil);color:var(--paper);border-color:var(--pencil)}
.share-pre{background:var(--desk);padding:14px 14px 12px;font-size:14px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.share-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.share-acts .pb{display:flex;align-items:center;justify-content:center;min-height:48px;font-size:14px;text-decoration:none}
.share-acts .pb.dark{background:var(--pencil);border-color:var(--pencil);color:var(--paper)}
.share-acts .linkb{cursor:pointer;font-family:inherit}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div><span class="label">MUZE TOOL BOX</span><h1>締め切り・出演ボード</h1></div>
    <button class="addbtn" id="addBtn" type="button" aria-label="自分で締め切りを追加">＋</button>
  </header>

  <section class="soon" id="soon" aria-labelledby="soonH" hidden>
    <div class="soon-h">
      <h2 id="soonH">きょう・あしたまで<span class="when" id="soonWhen"></span></h2>
      <button class="shareb" id="shareBtn" type="button" aria-label="きょう・あしたまでの予定をシェア"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v13"/><path d="M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>シェア</button>
    </div>
    <div id="soonBody"></div>
  </section>
  <div class="nudge" id="nudge" hidden></div>

  <div id="listView">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="tabs" role="tablist" aria-label="自分の予定" id="tabs"></div>
      <div id="list" style="display:flex;flex-direction:column;gap:14px"></div>
    </div>
  </div>

  <div id="calView" hidden>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="cal">
        <div class="cal-head">
          <button class="nav" id="prevM" type="button" aria-label="前の月">‹</button>
          <h2 id="calTitle"></h2>
          <button class="today-b" id="todayBtn" type="button">今日</button>
          <button class="nav" id="nextM" type="button" aria-label="次の月">›</button>
        </div>
        <div class="legend">
          <span><i class="dot d-go"></i>やること</span>
          <span><i class="dot d-undecided"></i>未定</span>
          <span><i class="dot d-wait d-result"></i>当落</span>
        </div>
        <div class="grid" id="calGrid"></div>
      </div>
      <div class="daylist" id="dayList"></div>
    </div>
  </div>

  <section class="sec shows" id="shows" aria-labelledby="showsH" hidden>
    <h2 id="showsH">これからの出演<span class="n" id="showsN"></span></h2>
    <div class="shows-box" id="showsBox"></div>
  </section>
</div>

<footer class="foot">
  <a class="home" href="https://rikomuze.github.io/muze-tool-box/">← ホームに戻る</a>
  <p>応募するかどうか・応募済みなどの記録は、この端末のブラウザにだけ保存されます。</p>
  <p>MAZZELの締め切りを整理する非公式ファンメイドツールです。BMSG・MAZZEL公式とは関係ありません。日時は公式の告知をもとにしていますが、変わることがあるので応募前に必ず公式ページを確認してね。</p>
  <p id="dataDate"></p>
</footer>

<nav class="dock" aria-label="表示の切りかえ">
  <div class="dock-in">
    <div class="seg">
      <button type="button" id="vCal" aria-pressed="true">カレンダー</button>
      <button type="button" id="vList" aria-pressed="false">リスト</button>
    </div>
  </div>
</nav>

<dialog id="detail">
  <div class="grab"></div>
  <button type="button" class="x" id="detailX" aria-label="閉じる">✕</button>
  <div class="sheet" id="detailBody"></div>
</dialog>

<dialog id="shareDlg" aria-labelledby="shareH">
  <div class="grab"></div>
  <button type="button" class="x" id="shareX" aria-label="閉じる">✕</button>
  <div class="sheet">
    <h3 id="shareH">きょう・あしたまでをシェア</h3>
    <div class="share-pick">
      <button type="button" id="shareApp" aria-pressed="true"></button>
      <button type="button" id="shareDue" aria-pressed="true"></button>
      <span class="src">「しない」にしたものは入らないよ</span>
    </div>
    <div class="share-pre" id="sharePre"></div>
    <div class="share-acts">
      <a class="pb dark" id="shareX2" target="_blank" rel="noopener">Xでポスト</a>
      <a class="pb ghost" id="shareLine" target="_blank" rel="noopener">LINEで送る</a>
      <button type="button" class="linkb" id="shareCopy">テキストをコピー</button>
      <button type="button" class="linkb" id="shareOther" hidden>ほかのアプリ</button>
    </div>
  </div>
</dialog>

<dialog id="dlg">
  <div class="grab"></div>
  <button type="button" class="x" id="cancelBtn" aria-label="閉じる">✕</button>
  <form class="sheet" id="form" method="dialog">
    <h3 id="dlgTitle">自分で追加</h3>
    <div id="manualPane" style="display:flex;flex-direction:column;gap:12px">
      <label for="fShort">なまえ（短く）<input id="fShort" required placeholder="例：ファンミ追加 FC先行"></label>
      <div class="g2">
        <label for="fEnd">〆 締め切り<input type="datetime-local" id="fEnd" required></label>
        <label for="fResult">当落（任意）<input type="datetime-local" id="fResult"></label>
      </div>
      <div class="g2">
        <label for="fDecision">自分の予定<select id="fDecision"><option value="">未定</option><option value="yes">応募する</option><option value="no">応募しない</option></select></label>
        <label for="fFlow">形式<select id="fFlow"></select></label>
      </div>
      <details>
        <summary>くわしく（任意）</summary>
        <div style="display:flex;flex-direction:column;gap:12px;padding-top:6px">
          <label for="fTitle">正式なタイトル<input id="fTitle"></label>
          <div class="g2">
            <label for="fStart">受付開始<input type="datetime-local" id="fStart"></label>
            <label for="fResultNote">当落メモ<input id="fResultNote" placeholder="頃・メールで通知"></label>
          </div>
          <div class="g2">
            <label for="fTag">関連<input id="fTag" list="tagList" placeholder="ワンダンス"></label>
            <label for="fStatus">進み具合<select id="fStatus"></select></label>
          </div>
          <div class="g2">
            <label for="fCat">種類<select id="fCat"></select></label>
          </div>
          <datalist id="tagList"></datalist>
          <label for="fUrl">リンク<input type="url" id="fUrl" placeholder="https://"></label>
          <label for="fNote">メモ<textarea id="fNote" style="min-height:70px"></textarea></label>
        </div>
      </details>
    </div>
    <div class="acts">
      <button type="button" class="pb" id="saveBtn">登録する</button>
    </div>
    <div class="minor" id="delRow" hidden></div>
  </form>
</dialog>

<script>
const CATS={ticket:"チケット",serial:"シリアル",payment:"入金・発券",stream:"配信・視聴",goods:"グッズ",event:"イベント"};
const STATUS={todo:"まだ",applied:"応募済み（結果待ち）",won:"当選",lost:"当落確認済",paid:"入金・完了",watched:"視聴済み",skip:"見送り"};
const LOTTERY=new Set(["ticket","serial","event"]);
const VERB={
  ticket:{yes:"応募する",no:"しない",did:"応募した"},serial:{yes:"応募する",no:"しない",did:"応募した"},event:{yes:"応募する",no:"しない",did:"応募した"},
  payment:{yes:"払う",no:"払わない",did:"払った",fin:"paid"},stream:{yes:"見る",no:"見ない",did:"見た",fin:"watched"},goods:{yes:"買う",no:"買わない",did:"買った",fin:"paid"}
};
const TABS=[["go","やること","rgba(226,122,148,.85)"],["undecided","未定","rgba(64,56,47,.25)"],["pass","しない","rgba(64,56,47,.25)"],["done","終わった","rgba(164,197,175,.9)"]];
const WD=["日","月","火","水","木","金","土"],DAY=864e5;
const KEY="muze-deadline-board:v1";
let catalog=[],appearances=[],store={state:{},custom:[]},items=[],loaded=false,dataDate="";
function loadStore(){try{const v=JSON.parse(localStorage.getItem(KEY)||"{}");store={state:v.state||{},custom:Array.isArray(v.custom)?v.custom:[]}}catch(e){}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(store));return true}catch(e){return false}}
function rebuild(){items=catalog.map(c=>({...c,...(store.state[c.id]||{})})).concat(store.custom.map(c=>({...c,_custom:true})))}
let view="cal",tab="go",filter="all",calY=0,calM=0,selDay="",userTab=false;
let mode="paste",editing=null,candidates=[];
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};

/* time */
const isD=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||"");
const ts=s=>s?new Date(isD(s)?s+"T00:00:00+09:00":s).getTime():NaN;
function jst(ms){const t=new Date(ms+9*3600e3);return{y:t.getUTCFullYear(),m:t.getUTCMonth()+1,d:t.getUTCDate(),wi:t.getUTCDay(),w:WD[t.getUTCDay()],h:String(t.getUTCHours()).padStart(2,"0"),mi:String(t.getUTCMinutes()).padStart(2,"0")}}
const md=s=>{const j=jst(ts(s));return`${j.m}/${j.d}`};
function fmt(s){const ms=ts(s);if(isNaN(ms))return"";const j=jst(ms);return`${j.m}/${j.d}(${j.w})`+(isD(s)?"":` ${j.h}:${j.mi}`)}
function dayKey(ms){const j=jst(ms);return`${j.y}-${String(j.m).padStart(2,"0")}-${String(j.d).padStart(2,"0")}`}
function left(ms){const d=ms-Date.now();if(isNaN(d)||d<0)return{t:"",u:false,d};const h=Math.floor(d/3600e3),dd=Math.floor(h/24);return{t:dd>=1?`あと${dd}日`:h>=1?`あと${h}時間`:`あと${Math.max(1,Math.floor(d/60e3))}分`,long:dd>=1?`あと${dd}日${h%24}時間`:h>=1?`あと${h}時間${Math.floor(d/60e3)%60}分`:`あと${Math.max(1,Math.floor(d/60e3))}分`,u:d<=DAY,d}}
const toIn=s=>{const ms=ts(s);if(isNaN(ms))return"";const j=jst(ms);return`${dayKey(ms)}T${j.h}:${j.mi}`};
const fromIn=v=>v?v+":00+09:00":"";
const nameOf=it=>it.short||it.title||"(無題)";

/* カレンダーに追加（.ics / Googleカレンダー） */
const ALARMS={eve20:"前日20時",morn9:"当日の朝9時",h3:"3時間前",h1:"1時間前"};
const ALARM_KEY="muze-deadline-board:alarms";
function getAlarms(){try{const v=JSON.parse(localStorage.getItem(ALARM_KEY)||"null");if(Array.isArray(v))return v.filter(k=>ALARMS[k]).slice(0,2)}catch(e){}return["eve20","h3"]}
function setAlarms(v){try{localStorage.setItem(ALARM_KEY,JSON.stringify(v))}catch(e){}}
// 予定名の頭につける印。出演は「出演 」、締め切りは「〆 」
const preOf=it=>it._pre||"〆 ";
// 締め切りの時刻。日付だけのものはその日の23:59とみなす
const dueMs=it=>isD(it.end)?ts(it.end)+DAY-60e3:ts(it.end);
function alarmMs(it,k){
  const due=dueMs(it),j=jst(due),day0=Date.UTC(j.y,j.m-1,j.d)-9*3600e3; // その日の0:00(JST)
  return{eve20:day0-4*3600e3,morn9:day0+9*3600e3,h3:due-3*3600e3,h1:due-3600e3}[k];
}
const utcStamp=ms=>new Date(ms).toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
const ymd=ms=>dayKey(ms).replace(/-/g,"");
const icsEsc=t=>String(t||"").replace(/\\/g,"\\\\").replace(/\r?\n/g,"\\n").replace(/([,;])/g,"\\$1");
function icsFold(line){const out=[];let cur="";for(const ch of line){if(new TextEncoder().encode(cur+ch).length>73){out.push(cur);cur=" "+ch}else cur+=ch}out.push(cur);return out.join("\r\n")}
function buildIcs(it){
  const now=Date.now(),due=dueMs(it),L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//MUZE TOOL BOX//Deadline Board//JA","CALSCALE:GREGORIAN","METHOD:PUBLISH","BEGIN:VEVENT",
    "UID:"+String(it.id).replace(/[^\w.-]/g,"")+"@muze-tool-box","DTSTAMP:"+utcStamp(now),"SUMMARY:"+icsEsc(preOf(it)+nameOf(it))];
  if(isD(it.end)){L.push("DTSTART;VALUE=DATE:"+ymd(ts(it.end)),"DTEND;VALUE=DATE:"+ymd(ts(it.end)+DAY))}
  else{L.push("DTSTART:"+utcStamp(due),"DTEND:"+utcStamp(due))}
  getAlarms().forEach(k=>{const a=alarmMs(it,k);if(a>now&&a<due)L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(preOf(it)+nameOf(it)+"（"+ALARMS[k]+"）"),"TRIGGER;VALUE=DATE-TIME:"+utcStamp(a),"END:VALARM")});
  L.push("END:VEVENT","END:VCALENDAR");
  return L.map(icsFold).join("\r\n")+"\r\n";
}
function addToCalendar(it){
  const ics=buildIcs(it),ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  if(ios){location.href=icsUrl(it);return} // iPhoneは data: を開けないので、.ics を返すURLを開く
  const url=URL.createObjectURL(new Blob([ics],{type:"text/calendar;charset=utf-8"}));
  const a=document.createElement("a");a.href=url;a.download="deadline-"+String(it.id).replace(/[^\w.-]/g,"")+".ics";document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);toast("カレンダー用のファイルを保存したよ。開くと追加できるよ");
}
const ICS_API="https://muze-toolbox-api.logical-bear-ishi.workers.dev/api/ics";
function icsUrl(it){
  const now=Date.now(),due=dueMs(it);
  const al=getAlarms().map(k=>alarmMs(it,k)).filter(a=>a>now&&a<due).map(a=>new Date(a).toISOString());
  const q={t:preOf(it)+nameOf(it),s:isD(it.end)?it.end:new Date(due).toISOString(),id:String(it.id).replace(/[^\w.-]/g,"").slice(0,64)};
  if(al.length)q.a=al.join(",");
  return ICS_API+"?"+new URLSearchParams(q).toString();
}
function googleUrl(it){
  const due=dueMs(it),to=isNaN(ts(it._to))?due:ts(it._to),d=isD(it.end)?ymd(ts(it.end))+"/"+ymd(ts(it.end)+DAY):utcStamp(due)+"/"+utcStamp(to);
  return"https://calendar.google.com/calendar/render?"+new URLSearchParams({action:"TEMPLATE",text:preOf(it)+nameOf(it),dates:d,ctz:"Asia/Tokyo"}).toString();
}
function calBox(it){
  const box=el("div","calbox");box.append(el("span","cap",it._pre?"カレンダーに入れて、放送・配信の前に通知":"カレンダーに入れて、締め切り前に通知"));
  const row=el("div","calrow");
  const a=el("button","linkb main","カレンダーに追加");a.type="button";a.onclick=()=>addToCalendar(it);
  const g=el("a","linkb","Googleカレンダー ↗");g.href=googleUrl(it);g.target="_blank";g.rel="noopener";

/* state */
function info(it){
  const now=Date.now(),end=ts(it.end),st=it.status||"todo",dec=it.decision||"";
  if(st==="lost")return{ph:"done",sub:"lost"};
  if(st==="paid"||st==="watched")return{ph:"done",sub:"fin"};
  if(st==="skip"&&dec==="yes")return{ph:"done",sub:"closed"};
  if(st==="skip"||dec==="no")return{ph:"pass",sub:"pass"};
  if(st==="won")return{ph:"go",sub:"won"};
  if(st==="applied")return isLot(it)?{ph:"go",sub:"applied"}:{ph:"done",sub:"fin"};
  if(dec==="yes")return{ph:"go",sub:end<now?"missed":"before"};
  if(end<now)return{ph:"done",sub:"expired"};
  return{ph:"undecided",sub:"undecided"};
}
const FLOW={lottery:{yes:"応募する",no:"しない",did:"応募した",steps:["応募する","応募した","当落確認"]},entry:{yes:"応募する",no:"しない",did:"応募した",fin:"paid",steps:["応募する","応募した"]},buy:{yes:"買う",no:"買わない",did:"買った",fin:"paid",steps:["買う","買った"]},watch:{yes:"見る",no:"見ない",did:"見た",fin:"watched",steps:["見る","見た"]},pay:{yes:"払う",no:"払わない",did:"払った",fin:"paid",steps:["払う","払った"]}};
const FLOWNAME={lottery:"抽選（当落あり）",entry:"全員もらえる",buy:"先着・購入",watch:"視聴",pay:"支払い"};
const flowOf=it=>FLOW[it.flow]?it.flow:({stream:"watch",payment:"pay",goods:"buy"}[it.category]||"lottery");
const isLot=it=>flowOf(it)==="lottery";
// 種類スタンプ。見る系（見逃し・聴き逃し・アーカイブ）・応募・購入（支払い含む）で色を分ける
function kindOf(it){
  const f=flowOf(it),t=(it.short||"")+" "+(it.title||"");
  if(f==="watch")return{c:"watch",l:/アーカイブ/.test(t)?"アーカイブ":/聴き逃し|ラジコ|radiko|ラジオ/i.test(t)?"聴き逃し":/見逃し|TVer|NHK ONE|配信期限/.test(t)?"見逃し":"視聴"};
  if(f==="buy")return{c:"buy",l:"購入"};
  if(f==="pay")return{c:"buy",l:"支払い"};
  return{c:"apply",l:"応募"};
}
// カレンダーに追加できるか（くわしくシートにカレンダー欄が出るのと同じ条件）
const canCal=(it,i)=>!isNaN(ts(it.end))&&dueMs(it)>Date.now()&&i.ph!=="done"&&i.ph!=="pass";
const vb=it=>FLOW[flowOf(it)];
function stepBar(it,i,big){
  const S=vb(it).steps.slice();let n=0;
  if(i.sub==="before"||i.sub==="missed")n=1;else if(i.sub==="applied")n=2;else if(["won","lost","fin"].includes(i.sub))n=S.length;
  if(S.length===3&&(i.sub==="won"||i.sub==="fin"))S[2]="当選";if(i.sub==="lost")S[2]="当落確認済";
  const w=el("span","steps"+(big?" big":"")+(i.sub==="applied"?" wait":""));
  S.forEach((l,k)=>{if(k)w.append(el("i","sep","›"));w.append(el("span","stp"+(k<n?" ok":k===n?" cur":""),(k<n?"✓ ":"")+l))});
  return w;
}
function look(it,i){ // [card class, stamp class, label]
  const v=vb(it);
  return{before:["st-go","go",v.yes],missed:["st-miss","miss","〆すぎた"],applied:["st-wait","wait","結果待ち"],won:["st-won","won","当選"],undecided:["st-undecided","undecided","未定"],
    pass:["st-off st-pass","off",v.no==="しない"?"応募しない":v.no],lost:["st-off","off","当落確認済"],fin:["st-off","off",it.status==="watched"?"視聴済み":"完了"],closed:["st-off","off","間に合わず"],expired:["st-off","off","期限切れ"]}[i.sub];
}
function actionsFor(it,i){ // [{label,cls,patch,msg}]
  const v=vb(it),fin=v.fin?{status:v.fin}:{status:"applied"};
  switch(i.sub){
    case"undecided":return[{l:v.yes,c:"berry",p:{decision:"yes"},m:`「応募する」に入れたよ`},{l:v.no,c:"ghost",p:{decision:"no",status:"skip"},m:`「しない」に移したよ`}];
    case"before":return[{l:v.did,c:"",p:fin,m:v.fin?"完了にしたよ":"結果待ちにしたよ"}];
    case"missed":return[{l:v.did,c:"",p:fin,m:"記録したよ"},{l:"無理だった",c:"ghost",p:{status:"skip"},m:"終わったに移したよ"}];
    case"applied":return[{l:"当落確認した",c:"",p:{status:"lost"},m:"当落確認済にしたよ"}];
    case"won":return[{l:isLot(it)?"入金した":"完了",c:"",p:{status:"paid"},m:"完了にしたよ"}];
  }
  return[];
}
function undoOf(i,it){
  if(i.sub==="lost")return{status:"applied"};
  if(i.sub==="fin")return isLot(it)?{status:"won"}:{status:"todo",decision:"yes"};
  if(i.sub==="closed")return{status:"todo"};
  if(i.sub==="pass")return{status:"todo",decision:""};
  if(i.sub==="before")return{decision:""};
  if(i.sub==="applied")return{status:"todo"};
  if(i.sub==="won")return{status:"applied"};
  return null;
}
const matches=it=>filter==="all"||(it.tag||"")===filter;
// 「しない」は締め切りを過ぎたら、「終わった」は当落（当落なしは締め切り・視聴/購入期間の終わり）を過ぎたらタブから外す。記録とカレンダーは残す
const endOfS=x=>isD(x)?ts(x)+DAY-60e3:ts(x);
function retired(it){

const shown=it=>matches(it)&&!retired(it);

/* card */
function card(it,kind){
  const i=info(it),[cc]=look(it,i),now=Date.now();
  const endMs=ts(it.end),resMs=ts(it.resultAt),startMs=ts(it.start);
  const c=el("article","card "+cc);
  if(/st-go|st-wait|st-won|st-miss/.test(cc))c.append(el("span","tape"));
  const active=i.sub==="before"||i.sub==="undecided";
  const L=left(endMs);if(active&&L.u)c.classList.add("urgent");
  // stub
  let sMs=endMs,k="〆",sIsD=false;
  if(kind==="result"||(!kind&&i.sub==="applied"&&!isNaN(resMs))){sMs=resMs;k="当落";sIsD=isD(it.resultAt)}
  const st=el("div","stub");
  if(!isNaN(sMs)){const j=jst(sMs);st.append(el("span","kd",k),el("b",null,`${j.m}/${j.d}`),el("span","wd",j.w));if(!sIsD)st.append(el("span","tm",`${j.h}:${j.mi}`))}
  else st.append(el("b",null,"?"));
  // middle

  m.append(el("span","ttl",nameOf(it)));

  if(active){
    if(!isNaN(startMs)&&startMs>now)sub.append(el("span","cd",`${md(it.start)}から`));
    else if(L.t)sub.append(el("span","cd"+(L.u?" u":""),L.t));
  }
  if(isLot(it)&&it.resultAt&&!isNaN(resMs)&&k!=="当落"&&i.ph!=="done"&&i.ph!=="pass")sub.append(el("span","rs",`当落 ${md(it.resultAt)}`));
  if(i.sub==="applied"&&k==="当落"&&resMs<now)sub.append(el("span","cd u","結果出たかも"));

  else c.append(el("span"));

  return c;

    if(!isNaN(ts(it.end)))add(dayKey(ts(it.end)),{it,kind:"end",ms:ts(it.end),cls});

  const last=new Date(Date.UTC(calY,calM,0)).getUTCDate(),cells=Math.ceil((fwd+last)/7)*7;
  for(let n=0;n<cells;n++){

    const b=el("button","day");b.type="button";
    if(j.m!==calM)b.classList.add("out");if(j.wi===0)b.classList.add("sun");if(j.wi===6)b.classList.add("sat");

/* 出演：appearances.json。start=開始、airEnd=放送の終わり（ないものは放送中の表示をしない） */

const hm=ms=>{const j=jst(ms);return`${+j.h}:${j.mi}`};
const dayStart=ms=>{const j=jst(ms);return Date.UTC(j.y,j.m-1,j.d)-9*3600e3};

function soonApps(now){

/* シェア：きょう・あしたまでの中身をそのまま文にする */
let shareApp=true,shareDue=true;
const SHARE_URL="https://rikomuze.github.io/muze-tool-box/deadline-board/";
function shareText(){
  const now=Date.now(),all=items.map(it=>({...it,_i:info(it)})),n=jst(now),L=[];
  if(shareApp)appearances.filter(a=>isLive(a,now)).forEach(a=>L.push({ms:0,t:`いま放送中【出演】${a.short||a.title}（${a.station||MEDIA[a.media]||""}）〜${hm(ts(a.airEnd))}`}));
  if(shareApp)soonApps(now).forEach(a=>{const ms=ts(a.start);L.push({ms,t:`${dayWord(ms,now)==="きょう"?"":"あした "}${hm(ms)}【出演】${a.short||a.title}（${a.station||MEDIA[a.media]||""}）`})});
  if(shareDue)soonDues(all,now).forEach(it=>{const ms=dueMs(it);L.push({ms,t:`${dayWord(ms,now)==="きょう"?"":"あした "}${hm(ms)}【〆】${nameOf(it)} ${kindOf(it).l}`})});
  L.sort((a,b)=>a.ms-b.ms);
  return[`MAZZEL きょう・あしたまで`,`${n.m}/${n.d}(${n.w}) ${hm(now)}時点`,"",...(L.length?L.map(x=>x.t):["きょう・あしたまでの予定はないよ"]),"","#MAZZEL",SHARE_URL].join("\n");
}
function paintShare(){
  const now=Date.now(),all=items.map(it=>({...it,_i:info(it)}));
  const na=appearances.filter(a=>isLive(a,now)).length+soonApps(now).length,nd=soonDues(all,now).length;
  $("shareApp").textContent=`出演 ${na}`;$("shareDue").textContent=`締め切り ${nd}`;
  $("shareApp").setAttribute("aria-pressed",String(shareApp));$("shareDue").setAttribute("aria-pressed",String(shareDue));
  const t=shareText();$("sharePre").textContent=t;
  $("shareX2").href="https://x.com/intent/post?text="+encodeURIComponent(t);
  $("shareLine").href="https://line.me/R/share?text="+encodeURIComponent(t);
}
function openShare(){paintShare();if(!$("shareDlg").open)$("shareDlg").showModal();lockPage()}
async function copyShare(){
  const t=shareText();
  try{await navigator.clipboard.writeText(t);toast("コピーしたよ")}
  catch(e){const r=document.createRange();r.selectNodeContents($("sharePre"));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast("文を選んだよ。コピーしてね")}
}

/* シートを開いているあいだ、背面をスクロールさせない。position:fixed で戻すのは iOS でも効くため。 */
function lockPage(){
  if("lock" in document.body.dataset)return;
  const y=window.scrollY||0;
  document.body.dataset.lock=String(y);
  document.documentElement.classList.add("modal-open");
  document.body.style.position="fixed";
  document.body.style.top=-y+"px";
  document.body.style.left="0";
  document.body.style.right="0";
  document.body.style.width="100%";
}
function unlockPage(){
  if($("detail").open||$("dlg").open)return;
  if(!("lock" in document.body.dataset))return;
  const y=+document.body.dataset.lock||0;
  document.documentElement.classList.remove("modal-open");
  document.body.style.position="";
  document.body.style.top="";
  document.body.style.left="";
  document.body.style.right="";
  document.body.style.width="";
  delete document.body.dataset.lock;
  window.scrollTo(0,y);
}
/* 取っ手だけをドラッグで閉じる。シート本体に touchmove の preventDefault は付けない（中のスクロールが主スレッド待ちになるため）。 */
function bindSheetSwipe(dialog){
  let pid=null,y0=0,lastY=0,lastT=0,vy=0,drag=false,gen=0;
  const reduced=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
  dialog.addEventListener("pointerdown",e=>{
    if(!dialog.open||!e.target.closest(".grab"))return;
    if(e.pointerType==="mouse"&&e.button!==0)return;
    e.preventDefault();
    gen++;
    pid=e.pointerId;y0=lastY=e.clientY;lastT=performance.now();vy=0;drag=false;
    dialog.setPointerCapture(e.pointerId);
  });
  dialog.addEventListener("pointermove",e=>{
    if(e.pointerId!==pid)return;
    const dy=e.clientY-y0,now=performance.now();
    vy=(e.clientY-lastY)/Math.max(1,now-lastT);lastY=e.clientY;lastT=now;
    if(dy<8)return;
    if(!drag){drag=true;dialog.style.transition="none"}
    dialog.style.transform="translate3d(0,"+dy+"px,0)";
  });
  function end(e){
    if(e.pointerId!==pid)return;
    const moved=drag,dy=Math.max(0,e.clientY-y0),v=vy;
    pid=null;drag=false;
    if(!moved){dialog.style.transition="";dialog.style.transform="";return}
    /* ドラッグのあとに出るクリックが、閉じた下の「＋」やリンクに当たらないようにする */
    const swallow=ev=>{ev.preventDefault();ev.stopPropagation();document.removeEventListener("click",swallow,true)};
    document.addEventListener("click",swallow,true);
    setTimeout(()=>document.removeEventListener("click",swallow,true),400);
    const token=++gen;
    const finish=()=>{
      if(token!==gen)return;
      dialog.removeEventListener("transitionend",finish);
      dialog.style.transition="";dialog.style.transform="";
    };
    if(dy>96||v>0.65){
      if(reduced()){if(dialog.open)dialog.close();return}
      dialog.style.transition="transform .2s ease";
      dialog.style.transform="translate3d(0,110%,0)";
      const shut=ev=>{
        if(ev&&ev.propertyName&&ev.propertyName!=="transform")return;
        dialog.removeEventListener("transitionend",shut);
        if(token!==gen)return;
        if(dialog.open)dialog.close();
      };
      dialog.addEventListener("transitionend",shut);
      setTimeout(shut,280);
      return;
    }
    if(reduced()){finish();return}
    dialog.style.transition="transform .2s ease";
    dialog.style.transform="translate3d(0,0,0)";
    dialog.addEventListener("transitionend",finish);
    setTimeout(finish,280);
  }
  dialog.addEventListener("pointerup",end);
  dialog.addEventListener("pointercancel",e=>{
    if(e.pointerId!==pid)return;
    pid=null;drag=false;gen++;
    dialog.style.transition="";dialog.style.transform="";
  });
  dialog.addEventListener("close",()=>{
    pid=null;drag=false;gen++;
    dialog.style.transition="";dialog.style.transform="";
    unlockPage();
  });
}

<script>
/* 新しい版が出ていたら読み込み直す。ホーム画面に追加したアプリは開きっぱなしで再読み込みされないため。
   版番号は持たず、サーバーのページとデータを取り直して前回と比べるので、更新時に手で書き換えるものはない。
   - 起動時：取り直したページに、いま動いている style/script がそのまま入っていなければ古い版なので読み込み直す
   - 画面に戻ったとき：ページか締め切り・出演データが起動時から変わっていれば読み込み直す
   シートを開いて入力している間は読み込み直さず、閉じてから確かめる。 */
(()=>{
  const SELF=["deadline-board/","deadline-board/index.html"].some(p=>location.pathname.endsWith(p))?location.pathname:null;
  if(!SELF)return;
  const GUARD="deadline-board-reloaded-at";
  const own=[...document.querySelectorAll("style,script:not([src])")].map(n=>n.textContent).filter(t=>t.trim().length>40);
  let base=null,checking=false,lastCheck=0;
  const get=async url=>{const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw new Error("bad status");return r.text()};
  const snapshot=async()=>{const[page,data,apps]=await Promise.all([get(SELF),get("deadlines.json"),get("appearances.json").catch(()=>"")]);return{page,data:data+"\n"+apps}};
  const busy=()=>[...document.querySelectorAll("dialog")].some(d=>d.open);
  const reload=()=>{
    try{const t=Number(sessionStorage.getItem(GUARD)||0);if(Date.now()-t<30e3)return;sessionStorage.setItem(GUARD,String(Date.now()))}catch(e){}
    location.reload();
  };
  const check=async()=>{
    if(checking||document.visibilityState!=="visible"||Date.now()-lastCheck<20e3)return;
    checking=true;lastCheck=Date.now();
    try{
      const now=await snapshot();
      if(!base){
        if(!own.every(t=>now.page.includes(t))){if(!busy())reload();return}
        base=now;return;
      }
      if(now.page!==base.page||now.data!==base.data){if(busy())lastCheck=0;else reload()}
    }catch(e){/* 電波がないときなどは次の機会に */}
    finally{checking=false}
  };
  document.addEventListener("visibilitychange",check);
  addEventListener("pageshow",e=>{if(e.persisted)check()});
  addEventListener("focus",check);
  document.querySelectorAll("dialog").forEach(d=>d.addEventListener("close",()=>{if(!base||lastCheck===0)check()}));
  check();
})();
</script>
