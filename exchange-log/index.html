/* ---------- MUZE TOOL BOX 共通ヘッダー ---------- */
.tool-nav{

  display:flex;

  gap:14px;

  font-weight:600;

.tool-nav-links{

<div class="app">
<header><div class="head"><h1>交換・買取・譲渡ログ</h1><button class="keychip" id="keyOpen" type="button">MUZE KEY</button></div></header>
<main><div class="tabs"><button class="on" data-tab="open">未完了</button><button data-tab="done">取引履歴</button></div>

<div class="chips" id="filters"><button class="on" data-filter="all">すべて</button><button data-filter="交換">交換</button><button data-filter="買取">買取</button><button data-filter="譲渡">譲渡</button><button data-filter="郵送">郵送</button><button data-filter="手渡し">手渡し</button><button data-filter="仮約束">仮約束</button><button data-filter="約束済">約束済</button><button data-filter="発送済">発送済</button><button data-filter="買取確定">買取確定</button><button data-filter="支払済">支払済</button></div>
<div class="listHead"><div class="count" id="count"></div><div class="listTools"><select class="sortSel" id="sort" aria-label="並び順"><option value="created">登録順</option><option value="due">予定日順</option><option value="promise">約束日順</option></select><button class="downloadBtn" id="downloadImage" type="button">画像をシェア</button></div></div><div class="list" id="list"></div><p class="note"><span class="syncStatus" id="syncStatus" data-state="local">この端末に保存中</span><button class="syncNow" id="syncNow" type="button">今すぐ同期</button></p></main>

</div>

</form></dialog>
<dialog id="keyDlg"><div class="formhead"><b>MUZE KEY</b><button class="close" id="keyClose" type="button">×</button></div><div class="keyPanel"><p>MUZE TOOL BOXで使う共通KEYです。交換約束ログは、このKEYを使ってブラウザ内で暗号化してからクラウド保存します。</p><p><b>このKEYは必ずスクショやメモで保管してください。</b><br>KEYを失うと、運営側でも交換内容を復元できません。</p><input class="keyValue" id="keyValue" autocomplete="off" autocapitalize="characters" spellcheck="false"><div class="keyActions"><button id="keyCopy" type="button">コピー</button><button class="primary" id="keyUse" type="button">このKEYを使う</button></div><button class="keyNew" id="keyNew" type="button">新しいMUZE KEYを発行</button><a class="keyHelp" href="../muze-key/"><span>MUZE KEYとは？ 仕組みと使い方を見る →</span></a></div></dialog>
</div>
<script src="../assets/muze-key.js"></script>
<script>
(function(){
"use strict";
const MEMBERS=["KAIRYU","NAOYA","RAN","SEITO","RYUKI","TAKUTO","HAYATO","EIKI","その他"];
const TYPES=["フォトカード","アナザージャケット","ネームシール","ICカード","フレークシールセット","MZ Mate ランダムぷりぷりチャーム","マーカーチャーム2P","缶バッジ","アクリルスタンド","その他"];
const SERIES=["So Strawberry","Touch","Play at the MUZEUM vol.2","BMSG FES ’26","その他"];
const EXCHANGE_STATUSES=["仮約束","約束済","発送済","交換完了"];
const BUY_STATUSES=["仮約束","買取確定","支払済","受取完了"];
const GIVE_STATUSES=["仮約束","約束済","発送済","譲渡完了"];
const APPS=["X","Instagram","Threads","その他"];
const SORT_KEY="muze_exchange_sort_v1";
const BASE_KEY="muze_exchange_log_v1";
const API_BASE="https://muze-toolbox-api.logical-bear-ishi.workers.dev";
const API_URL=API_BASE+"/api/exchange-v2";
const CRYPTO_ITERATIONS=180000;
const CRYPTO_SALT_PREFIX="MUZE-TOOL-BOX:EXCHANGE:V2:";
let KEY=MUZEKey.storageKey(BASE_KEY);
const $=s=>document.querySelector(s);
let rows=[];
function normalizeItem(item){
  item=item||{};
  return {member:item.member||"",other:item.other||"",type:item.type||TYPES[0],series:item.series||SERIES[0],detail:item.detail||""};
}
function legacyItem(r,side){
  const member=r[side+"Member"]||"",other=r[side+"Other"]||"",type=r[side+"Type"]||"",series=r[side+"Series"]||"",detail=r[side+"Detail"]||"";
  return (member||type||series||detail)?normalizeItem({member,other,type:type||TYPES[0],series:series||SERIES[0],detail}):null;
}
function normalizeRows(input){
  return (Array.isArray(input)?input:[]).map(r=>{
    const giveItems=Array.isArray(r.giveItems)&&r.giveItems.length?r.giveItems.map(normalizeItem):[legacyItem(r,"give")].filter(Boolean);
    const getItems=Array.isArray(r.getItems)&&r.getItems.length?r.getItems.map(normalizeItem):[legacyItem(r,"get")].filter(Boolean);
    return Object.assign({},r,{
      tradeType:["買取","譲渡"].includes(r.tradeType)?r.tradeType:"交換",
      status:r.status==="発送準備"?"約束済":(r.status||"仮約束"),
      price:r.price==null?"":String(r.price),shipping:r.shipping==null?"":String(r.shipping),
      giveItems,getItems
    });
  });
}
function dirtyKey(){return "muze_exchange_dirty_v2:"+MUZEKey.get()}
function loadRows(){
  if(localStorage.getItem(KEY)===null){
    const legacy=localStorage.getItem(BASE_KEY);
    if(legacy!==null)localStorage.setItem(KEY,legacy);
  }
  try{rows=normalizeRows(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){rows=[]}
  try{localStorage.setItem(KEY,JSON.stringify(rows))}catch(e){}
}
loadRows();
let tab="open",filter="all",formItems={give:[],get:[]},currentStatus="仮約束",currentTradeType="交換",currentApp="";
let sortMode="created";try{const v=localStorage.getItem(SORT_KEY);if(["created","due","promise"].includes(v))sortMode=v}catch(e){}
function appLabel(r){return r&&r.app?(r.app==="その他"?(r.appOther||"その他"):r.app):""}
function renderAppSwitch(){const el=$("#appSwitch");if(!el)return;el.innerHTML=APPS.map(a=>'<button type="button" data-app="'+esc(a)+'" class="'+(currentApp===a?"on":"")+'" aria-pressed="'+(currentApp===a)+'">'+esc(a)+'</button>').join("");$("#appOther").hidden=currentApp!=="その他"}

function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function itemMemberLabel(item){const m=(item&&item.member)||"";return m==="その他"?((item&&item.other)||"その他"):m}
function memberLabel(r,side){const items=(r&&r[side+"Items"])||[];return itemMemberLabel(items[0]||{})}
function defaultItem(seed={}){return normalizeItem({member:"",other:"",type:seed.type||TYPES[0],series:seed.series||SERIES[0],detail:""})}
function optionHtml(values,current){return values.map(x=>'<option '+(x===current?'selected ':'')+'value="'+esc(x)+'">'+esc(x)+'</option>').join("")}
function renderItemEditors(side){
  const box=$("#"+side+"Items"),items=formItems[side];

function bytesToBase64(bytes){
  let s="";const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk){
    s+=String.fromCharCode.apply(null,bytes.subarray(i,Math.min(i+chunk,bytes.length)));
  }
  return btoa(s);
}
function base64ToBytes(s){
  const bin=atob(s),out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);
  return out;
}
async function sha256Hex(value){
  const digest=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(value));
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function getKeyId(){
  return sha256Hex("MUZE-TOOL-BOX:EXCHANGE:ID:V2:"+MUZEKey.get());
}
async function deriveAesKey(saltBytes){
  const material=await crypto.subtle.importKey(
    "raw",
    new TextEncoder().encode(MUZEKey.get()),
    "PBKDF2",
    false,
    ["deriveKey"]
  );
  return crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:saltBytes,iterations:CRYPTO_ITERATIONS,hash:"SHA-256"},
    material,
    {name:"AES-GCM",length:256},
    false,
    ["encrypt","decrypt"]
  );
}
async function encryptRows(value){
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveAesKey(salt);
  const plain=new TextEncoder().encode(JSON.stringify(value));
  const cipher=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,plain);
  return {
    v:2,
    alg:"AES-GCM",
    kdf:"PBKDF2-SHA256",
    iter:CRYPTO_ITERATIONS,
    salt:bytesToBase64(salt),
    iv:bytesToBase64(iv),
    ct:bytesToBase64(new Uint8Array(cipher))
  };
}
async function decryptEnvelope(envelope){
  if(!envelope||envelope.v!==2||!envelope.salt||!envelope.iv||!envelope.ct)throw new Error("invalid envelope");
  const salt=base64ToBytes(envelope.salt);
  const iv=base64ToBytes(envelope.iv);
  const key=await deriveAesKey(salt);
  const plain=await crypto.subtle.decrypt(
    {name:"AES-GCM",iv},
    key,
    base64ToBytes(envelope.ct)
  );
  const parsed=JSON.parse(new TextDecoder().decode(plain));
  if(!Array.isArray(parsed))throw new Error("invalid rows");
  return normalizeRows(parsed);
}
async function fetchEncryptedCloud(){
  const keyId=await getKeyId();
  const res=await fetch(API_URL,{method:"GET",headers:{"X-MUZE-ID":keyId}});
  if(!res.ok)throw new Error("HTTP "+res.status);
  return res.json();
}
async function putEncryptedCloud(value){
  const keyId=await getKeyId();
  const envelope=await encryptRows(value);
  const res=await fetch(API_URL,{
    method:"PUT",
    headers:{"Content-Type":"application/json","X-MUZE-ID":keyId},
    body:JSON.stringify({envelope})
  });
  if(!res.ok)throw new Error("HTTP "+res.status);
  const data=await res.json();
  if(!data||data.ok!==true)throw new Error("invalid response");
  return data;
}
async function cloudSave(){
  setSyncStatus("sync","暗号化してクラウド同期中…");
  try{
    await putEncryptedCloud(rows);
    try{localStorage.removeItem(dirtyKey())}catch(e){}
    setSyncStatus("ok","暗号化してクラウド保存済み");
    return true;
  }catch(e){
    console.error("cloudSave",e);
    setSyncStatus("local","この端末には保存済み・クラウド未接続");
    return false;
  }
}
async function syncFromCloud(){
  setSyncStatus("sync","暗号化クラウドを確認中…");
  try{
    const data=await fetchEncryptedCloud();
    const dirty=localStorage.getItem(dirtyKey())==="1";

    if(dirty){
      await cloudSave();
      return;
    }

    if(data&&data.found){
      rows=await decryptEnvelope(data.envelope);
      saveLocal(false);
      render();
      setSyncStatus("ok","暗号化データをKEYから復元・同期済み");
      return;
    }

    if(rows.length){
      localStorage.setItem(dirtyKey(),"1");
      await cloudSave();
      return;
    }

    setSyncStatus("ok","暗号化クラウドに接続済み");
  }catch(e){
    console.error("syncFromCloud",e);
    setSyncStatus("local","この端末には保存済み・クラウド未接続");
  }
}

function getVisibleRows(){

   .filter(r=>filter==="all"||r.tradeType===filter||r.method===filter||r.status===filter)
   .filter(r=>JSON.stringify(r).toLowerCase().includes(q))
   .sort(compareRows);
}
/* 並び順：日付が入っていない取引は最後に回す。同じ日付なら新しく登録した順 */
function compareRows(a,b){
 const byCreated=(b.created||"").localeCompare(a.created||"");
 if(sortMode==="due"){const da=a.dueDate||a.promiseDate||"",db=b.dueDate||b.promiseDate||"";if(!da!==!db)return da?-1:1;return da.localeCompare(db)||byCreated}
 if(sortMode==="promise"){const da=a.promiseDate||"",db=b.promiseDate||"";if(!da!==!db)return da?-1:1;return db.localeCompare(da)||byCreated}
 return byCreated;
}
function fitText(ctx,text,maxWidth){
 const raw=String(text||"");
 if(ctx.measureText(raw).width<=maxWidth)return raw;
 let out=raw;
 while(out.length>1&&ctx.measureText(out+"…").width>maxWidth)out=out.slice(0,-1);
 return out+"…";
}
function roundRect(ctx,x,y,w,h,r){
 const rr=Math.min(r,w/2,h/2);
 ctx.beginPath();
 ctx.moveTo(x+rr,y);
 ctx.lineTo(x+w-rr,y);
 ctx.quadraticCurveTo(x+w,y,x+w,y+rr);
 ctx.lineTo(x+w,y+h-rr);
 ctx.quadraticCurveTo(x+w,y+h,x+w-rr,y+h);
 ctx.lineTo(x+rr,y+h);
 ctx.quadraticCurveTo(x,y+h,x,y+h-rr);
 ctx.lineTo(x,y+rr);
 ctx.quadraticCurveTo(x,y,x+rr,y);
 ctx.closePath();
}
function wrapText(ctx,text,maxWidth,maxLines){
 const words=Array.from(String(text||""));
 const lines=[];let line="";
 for(const ch of words){
   const test=line+ch;
   if(ctx.measureText(test).width>maxWidth&&line){
     lines.push(line);line=ch;
     if(lines.length===maxLines-1)break;
   }else{line=test}
 }
 if(line&&lines.length<maxLines)lines.push(line);
 const consumed=lines.join("").length;
 if(consumed<String(text||"").length&&lines.length){
   lines[lines.length-1]=fitText(ctx,lines[lines.length-1]+"…",maxWidth);
 }
 return lines;
}
function drawTextLines(ctx,lines,x,y,lineHeight){
 lines.forEach((line,i)=>ctx.fillText(line,x,y+i*lineHeight));
}
function canvasToBlob(canvas){
 return new Promise((resolve,reject)=>{
   canvas.toBlob(blob=>blob?resolve(blob):reject(new Error("blob failed")),"image/png");
 });
}
function fallbackDownload(blob,filename){
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;a.download=filename;
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}

}
function itemSummaryHtml(item){
 return '<div class="thingItem"><b>'+esc(itemMemberLabel(item)||"—")+' / '+esc(item.type||"")+'</b><span class="series">'+esc(item.series||"")+(item.detail?' / '+esc(item.detail):"")+'</span></div>';
}
function render(){
 const out=getVisibleRows();
 $("#count").textContent=(tab==="done"?"完了 ":"未完了 ")+out.length+"件";
 $("#list").innerHTML=out.length?out.map(r=>{
   const buy=r.tradeType==="買取",give=r.tradeType==="譲渡";
   const giveItems=r.giveItems||[],getItems=r.getItems||[];
   const body=buy
     ? '<div class="purchaseLine"><div class="thingItems">'+getItems.map(itemSummaryHtml).join("")+'</div>'+(r.price!==""||r.shipping!==""?'<span class="purchasePrice">'+formatYen(sumPrice(r))+' <small>（商品 '+formatYen(r.price)+' + 送料 '+formatYen(r.shipping)+'）</small></span>':"")+'</div>'
     : give ? '<div class="purchaseLine"><div class="thingItems">'+giveItems.map(itemSummaryHtml).join("")+'</div></div>'
     : '<div class="swap"><div class="thing"><div class="thingItems">'+giveItems.map(itemSummaryHtml).join("")+'</div></div><div class="arrow">⇄</div><div class="thing"><div class="thingItems">'+getItems.map(itemSummaryHtml).join("")+'</div></div></div>';
   return '<article class="card" data-id="'+esc(r.id)+'"><div class="cardtop"><div><span class="typeTag '+(buy?"buy":"")+'">'+esc(r.tradeType)+'</span><span class="person">'+esc(r.name)+'</span> <span class="handle">'+esc(r.handle)+'</span>'+(appLabel(r)?'<span class="appTag">'+esc(appLabel(r))+'</span>':"")+'</div><span class="badge '+((r.status==="交換完了"||r.status==="受取完了"||r.status==="譲渡完了")?"done":(r.status==="発送済"||r.status==="支払済")?"sent":r.status==="仮約束"?"temp":"")+'">'+esc(r.status)+'</span></div>'+body+'<div class="meta"><span>'+esc(r.method)+'</span><span>約束 '+esc(r.promiseDate||"未設定")+'</span>'+(r.dueDate?'<span>予定 '+esc(r.dueDate)+'</span>':"")+(r.event?'<span>'+esc(r.event)+'</span>':"")+'</div><button class="samePerson" type="button" data-copy-person="'+esc(r.id)+'">＋ この相手と別の取引を追加</button></article>';
 }).join(""):'<div class="empty">まだ記録がありません。<br>下の「取引を追加」から登録できます。</div>';
 document.querySelectorAll(".card").forEach(c=>c.addEventListener("click",e=>{if(e.target.closest(".samePerson"))return;openEdit(c.dataset.id)}));
 document.querySelectorAll(".samePerson").forEach(b=>b.addEventListener("click",()=>{const r=rows.find(x=>x.id===b.dataset.copyPerson);if(!r)return;resetForm();$("#name").value=r.name||"";$("#handle").value=r.handle||"";currentApp=r.app||"";$("#appOther").value=r.appOther||"";renderAppSwitch();$("#method").value=r.method||"郵送";syncDateLabels();openDialog()}));
}
function openEdit(id){
 const r=rows.find(x=>x.id===id);if(!r)return;resetForm();
 $("#editId").value=id;currentTradeType=["買取","譲渡"].includes(r.tradeType)?r.tradeType:"交換";
 ["name","handle","method","promiseDate","dueDate","event","memo","price","shipping"].forEach(k=>$("#"+k).value=r[k]||"");
 formItems={give:(r.giveItems&&r.giveItems.length?r.giveItems:[defaultItem()]).map(normalizeItem),get:(r.getItems&&r.getItems.length?r.getItems:[defaultItem()]).map(normalizeItem)};
 renderItemEditors("give");renderItemEditors("get");
 currentStatus=r.status||"仮約束";currentApp=APPS.includes(r.app)?r.app:"";$("#appOther").value=r.appOther||"";renderAppSwitch();
 $("#del").hidden=false;syncTradeTypeUI();syncDateLabels();updateCostTotal();openDialog();
}
function submitForm(e){
 e.preventDefault();const id=$("#editId").value;
 const giveItems=currentTradeType!=="買取"?formItems.give.map(normalizeItem):[];
 const getItems=currentTradeType!=="譲渡"?formItems.get.map(normalizeItem):[];
 const firstGive=giveItems[0]||{},firstGet=getItems[0]||{};
 const obj={
   id:id||("x"+Date.now()+Math.random().toString(36).slice(2)),
   tradeType:currentTradeType,name:$("#name").value.trim(),handle:$("#handle").value.trim(),app:currentApp,appOther:currentApp==="その他"?$("#appOther").value.trim():"",
   giveItems,getItems,
   giveMember:firstGive.member||"",giveOther:firstGive.other||"",giveType:firstGive.type||"",giveSeries:firstGive.series||"",giveDetail:firstGive.detail||"",
   getMember:firstGet.member||"",getOther:firstGet.other||"",getType:firstGet.type||"",getSeries:firstGet.series||"",getDetail:firstGet.detail||"",
   price:currentTradeType==="買取"?$("#price").value.trim():"",shipping:currentTradeType==="買取"?$("#shipping").value.trim():"",
   method:$("#method").value,promiseDate:$("#promiseDate").value,dueDate:$("#dueDate").value,event:$("#event").value.trim(),memo:$("#memo").value.trim(),status:currentStatus,created:new Date().toISOString()
 };
 if(id){const old=rows.find(x=>x.id===id);if(old)obj.created=old.created;rows=rows.map(x=>x.id===id?obj:x)}else{rows.push(obj)}
 persist();closeDialog();
}
function deleteRow(){const id=$("#editId").value;if(id&&confirm("この取引記録を削除しますか？")){rows=rows.filter(x=>x.id!==id);persist();closeDialog()}}
function openSpecificDialog(d){if(typeof d.showModal==="function"){try{d.showModal();return}catch(e){}}d.setAttribute("open","")}
function closeSpecificDialog(d){if(typeof d.close==="function"){try{d.close();return}catch(e){}}d.removeAttribute("open")}
function refreshKeyChip(){$("#keyOpen").textContent="KEY "+MUZEKey.get().slice(-4)}
function openKeyDialog(){$("#keyValue").value=MUZEKey.get();openSpecificDialog($("#keyDlg"))}
async function switchKey(raw){
  const normalized=MUZEKey.normalize(raw);
  if(!MUZEKey.valid(normalized)){alert("MUZE KEYの形式を確認してください");return}
  MUZEKey.set(normalized);
  KEY=MUZEKey.storageKey(BASE_KEY);
  loadRows();render();refreshKeyChip();closeSpecificDialog($("#keyDlg"));
  await syncFromCloud();
}
init();
refreshKeyChip();
$("#keyOpen").addEventListener("click",openKeyDialog);
$("#keyClose").addEventListener("click",()=>closeSpecificDialog($("#keyDlg")));
function copyKeyFallback(text){
  const input=$("#keyValue");
  const ro=input.readOnly;
  input.readOnly=true;               // iOSでキーボードを出さない
  input.focus();
  input.setSelectionRange(0,text.length); // iOSは select() だけでは選択されない
  let ok=false;
  try{ok=document.execCommand("copy")}catch(e){ok=false}
  input.readOnly=ro;
  return ok;
}
let keyCopyTimer=null;
$("#keyCopy").addEventListener("click",async()=>{
  const btn=$("#keyCopy");
  const text=($("#keyValue").value||MUZEKey.get()).trim();
  let ok=false;
  try{
    if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);ok=true}
  }catch(e){ok=false}
  if(!ok)ok=copyKeyFallback(text);
  if(!ok){$("#keyValue").focus();$("#keyValue").setSelectionRange(0,text.length)}
  btn.textContent=ok?"コピーしました":"選択済み・長押しでコピー";
  clearTimeout(keyCopyTimer);
  keyCopyTimer=setTimeout(()=>{btn.textContent="コピー"},ok?1800:3500);
});
$("#keyUse").addEventListener("click",()=>switchKey($("#keyValue").value));
$("#keyNew").addEventListener("click",()=>{if(confirm("新しいMUZE KEYへ切り替えますか？ 現在のKEYの記録は削除されません。"))switchKey(MUZEKey.generate())});
$("#syncNow").addEventListener("click",syncFromCloud);
$("#downloadImage").addEventListener("click",exportVisibleList);
render();
syncFromCloud();
})();
</script></body></html>
