<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf7ff"><meta name="robots" content="noindex"><title>交換約束ログ | MUZE TOOL BOX</title>
<style>
:root{--ink:#25202a;--muted:#81788a;--line:#e8e0ee;--lav:#9565d8;--lav2:#efe5ff;--pink:#fff0f6;--blue:#eaf4ff;--green:#e8f8ef;--amber:#fff1d8}
*{box-sizing:border-box}body{margin:0;background:#faf7fc;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:680px;margin:auto;min-height:100vh;background:#fff;padding-bottom:92px}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 18px 12px}.brand{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:700}.head{display:flex;justify-content:space-between;align-items:center}.head h1{font-size:21px;margin:3px 0 0}.home{font-size:12px;color:var(--lav);text-decoration:none}
main{padding:14px}.tabs,.chips{display:flex;gap:7px;overflow:auto;scrollbar-width:none}.tabs button,.chips button{border:0;background:#f4f1f6;padding:9px 14px;border-radius:999px;white-space:nowrap;color:#62596b}.tabs button.on,.chips button.on{background:var(--lav);color:#fff}
.search{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0;font-size:15px}.list{display:grid;gap:10px;margin-top:12px}.card{border:1px solid var(--line);border-radius:18px;padding:14px;background:#fff}.cardtop{display:flex;justify-content:space-between;gap:8px}.person{font-weight:800}.handle{font-size:12px;color:var(--muted)}.swap{display:grid;grid-template-columns:1fr 32px 1fr;align-items:center;margin:13px 0 10px}.thing{background:#faf8fb;border-radius:13px;padding:10px;text-align:center;font-size:13px}.thing b{display:block;font-size:15px}.arrow{text-align:center;font-size:20px}.meta{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}.badge{font-size:11px;font-weight:700;border-radius:999px;padding:5px 9px;background:var(--amber)}.badge.done{background:var(--green)}.badge.sent{background:var(--blue)}
.empty{text-align:center;color:var(--muted);padding:60px 20px}.fab{position:fixed;right:max(20px,calc((100vw - 680px)/2 + 20px));bottom:24px;width:58px;height:58px;border:0;border-radius:50%;background:var(--lav);color:#fff;font-size:30px;box-shadow:0 8px 22px #9565d84d}
dialog{border:0;border-radius:22px;width:min(94vw,620px);max-height:88vh;padding:0;box-shadow:0 20px 70px #0003}dialog::backdrop{background:#22192b77}.formhead{position:sticky;top:0;background:#fff;padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.form{padding:16px 18px 22px}.form h3{font-size:13px;margin:18px 0 8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:15px;background:#fff}.form textarea{min-height:76px}.members{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.members button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 3px;font-size:11px}.members button.on{border-color:var(--lav);background:var(--lav2);color:#653aa3;font-weight:800}.save{width:100%;border:0;border-radius:14px;background:var(--lav);color:#fff;padding:13px;font-weight:800;font-size:15px;margin-top:18px}.close{border:0;background:none;font-size:20px}.statusBtns{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px}.statusBtns button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px;font-size:12px}.del{border:0;background:none;color:#b34b65;font-size:12px;margin-top:16px;width:100%}
.note{font-size:11px;color:var(--muted);margin:10px 2px}.count{font-size:12px;color:var(--muted);margin:12px 2px 0}
</style></head><body><div class="app">
<header><div class="brand">MUZE TOOL BOX</div><div class="head"><h1>交換約束ログ</h1><a class="home" href="../">TOOL BOXへ</a></div></header>
<main><div class="tabs"><button class="on" data-tab="open">未完了</button><button data-tab="done">交換履歴</button></div>
<input class="search" id="search" placeholder="交換相手・メンバー・グッズで検索">
<div class="chips" id="filters"><button class="on" data-filter="all">すべて</button><button data-filter="郵送">郵送</button><button data-filter="手渡し">手渡し</button><button data-filter="約束済">約束済</button><button data-filter="発送準備">発送準備</button><button data-filter="発送済">発送済</button></div>
<div class="count" id="count"></div><div class="list" id="list"></div><p class="note">※ このバージョンの記録はこの端末のブラウザ内に保存されます。</p></main>
<button class="fab" id="add" aria-label="交換を追加">＋</button>
<dialog id="dlg"><div class="formhead"><b id="formTitle">交換の新規登録</b><button class="close" id="close">×</button></div><form class="form" id="form">
<input type="hidden" id="editId"><h3>お相手</h3><div class="grid2"><input id="name" placeholder="ニックネーム" required><input id="handle" placeholder="@ID"></div>
<h3>自分が渡す</h3><div class="members" id="giveMembers"></div><div class="grid2" style="margin-top:8px"><select id="giveType"></select><input id="giveDetail" placeholder="絵柄・詳細"></div>
<h3>相手からもらう</h3><div class="members" id="getMembers"></div><div class="grid2" style="margin-top:8px"><select id="getType"></select><input id="getDetail" placeholder="絵柄・詳細"></div>
<h3>交換方法・日程</h3><div class="grid2"><select id="method"><option>郵送</option><option>手渡し</option></select><input type="date" id="promiseDate"></div><div class="grid2" style="margin-top:8px"><input type="date" id="dueDate"><input id="event" placeholder="会場・イベント"></div>
<h3>メモ</h3><textarea id="memo" placeholder="梱包、発送、待ち合わせなど"></textarea>
<div id="statusArea" hidden><h3>ステータス</h3><div class="statusBtns" id="statusBtns"></div></div>
<button class="save" type="submit">保存する</button><button class="del" type="button" id="del" hidden>この記録を削除</button>
</form></dialog></div>
<script>
const MEMBERS=["KAIRYU","NAOYA","RAN","SEITO","RYUKI","TAKUTO","HAYATO","EIKI"], TYPES=["トレカ","ICカード","缶バッジ","アクスタ","その他"], STATUSES=["約束済","発送準備","発送済","交換完了"];
const KEY="muze_exchange_log_v1"; let rows=JSON.parse(localStorage.getItem(KEY)||"[]"), tab="open", filter="all", selected={give:"",get:""};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function esc(s=""){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function save(){localStorage.setItem(KEY,JSON.stringify(rows));render()}
function init(){
 ["giveType","getType"].forEach(id=>$("#"+id).innerHTML=TYPES.map(x=>'<option>'+x+'</option>').join(""));
 ["give","get"].forEach(side=>{const box=$("#"+side+"Members"); MEMBERS.forEach(m=>{let b=document.createElement("button");b.type="button";b.textContent=m;b.onclick=()=>{selected[side]=m;[...box.children].forEach(x=>x.classList.toggle("on",x===b))};box.appendChild(b)})});
 $("#statusBtns").innerHTML=STATUSES.map(s=>'<button type="button" data-status="'+s+'">'+s+'</button>').join("");
 $$("#statusBtns button").forEach(b=>b.onclick=()=>{let id=$("#editId").value;if(!id)return;let r=rows.find(x=>x.id===id);r.status=b.dataset.status;save();dlg.close()});
}
function render(){
 let q=$("#search").value.trim().toLowerCase(); let out=rows.filter(r=>(tab==="done"?r.status==="交換完了":r.status!=="交換完了")).filter(r=>filter==="all"||r.method===filter||r.status===filter).filter(r=>JSON.stringify(r).toLowerCase().includes(q));
 $("#count").textContent=(tab==="done"?"完了 ":"未完了 ")+out.length+"件";
 $("#list").innerHTML=out.length?out.sort((a,b)=>(b.created||"").localeCompare(a.created||"")).map(r=>`<article class="card" data-id="${r.id}"><div class="cardtop"><div><span class="person">${esc(r.name)}</span> <span class="handle">${esc(r.handle)}</span></div><span class="badge ${r.status==="交換完了"?"done":r.status==="発送済"?"sent":""}">${r.status}</span></div><div class="swap"><div class="thing"><b>${r.giveMember||"—"}</b>${esc(r.giveType)} ${esc(r.giveDetail)}</div><div class="arrow">⇄</div><div class="thing"><b>${r.getMember||"—"}</b>${esc(r.getType)} ${esc(r.getDetail)}</div></div><div class="meta"><span>${r.method}</span><span>約束 ${r.promiseDate||"未設定"}</span>${r.dueDate?'<span>予定 '+r.dueDate+'</span>':""}${r.event?'<span>'+esc(r.event)+'</span>':""}</div></article>`).join(""):'<div class="empty">まだ記録がありません。<br>＋から交換約束を追加できます。</div>';
 $$(".card").forEach(c=>c.onclick=()=>openEdit(c.dataset.id));
}
function reset(){form.reset();$("#editId").value="";selected={give:"",get:""};$$(".members button").forEach(b=>b.classList.remove("on"));$("#statusArea").hidden=true;$("#del").hidden=true;$("#formTitle").textContent="交換の新規登録"}
function openEdit(id){let r=rows.find(x=>x.id===id);reset();$("#editId").value=id;$("#formTitle").textContent="交換詳細";["name","handle","giveType","giveDetail","getType","getDetail","method","promiseDate","dueDate","event","memo"].forEach(k=>$("#"+k).value=r[k]||"");selected={give:r.giveMember,get:r.getMember};["give","get"].forEach(side=>$$('#'+side+'Members button').forEach(b=>b.classList.toggle("on",b.textContent===selected[side])));$("#statusArea").hidden=false;$("#del").hidden=false;dlg.showModal()}
$("#add").onclick=()=>{reset();dlg.showModal()};$("#close").onclick=()=>dlg.close();
$("#form").onsubmit=e=>{e.preventDefault();let id=$("#editId").value;let obj={id:id||crypto.randomUUID(),name:$("#name").value.trim(),handle:$("#handle").value.trim(),giveMember:selected.give,giveType:$("#giveType").value,giveDetail:$("#giveDetail").value.trim(),getMember:selected.get,getType:$("#getType").value,getDetail:$("#getDetail").value.trim(),method:$("#method").value,promiseDate:$("#promiseDate").value,dueDate:$("#dueDate").value,event:$("#event").value.trim(),memo:$("#memo").value.trim(),status:"約束済",created:new Date().toISOString()};if(id){let old=rows.find(x=>x.id===id);obj.status=old.status;obj.created=old.created;rows=rows.map(x=>x.id===id?obj:x)}else rows.push(obj);save();dlg.close()};
$("#del").onclick=()=>{let id=$("#editId").value;if(confirm("この交換記録を削除しますか？")){rows=rows.filter(x=>x.id!==id);save();dlg.close()}};
$$(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;$$(".tabs button").forEach(x=>x.classList.toggle("on",x===b));render()});
$$(".chips button").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;$$(".chips button").forEach(x=>x.classList.toggle("on",x===b));render()});$("#search").oninput=render;
init();render();
</script></body></html>
