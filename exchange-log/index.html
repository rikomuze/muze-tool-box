<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1ebe1"><meta name="robots" content="noindex"><title>交換約束ログ | MUZE TOOL BOX</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--desk:#f1ebe1;--paper:#fff;--ink:#40382f;--muted:#8f8577;--line:rgba(64,56,47,.2);--berry:#e27a94;--mint:#a4c5af;--lav:#b9a6d8;--blue:#a9c8df;--hand:"Klee One","Yu Gothic",cursive;--gothic:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;--shadow:0 10px 24px rgba(64,56,47,.13)}
*{box-sizing:border-box}html,body{width:100%;max-width:100%;overflow-x:hidden}body{margin:0;color:var(--ink);font-family:var(--gothic);background:radial-gradient(rgba(64,56,47,.045) 1px,transparent 1px) 0 0/22px 22px,var(--desk)}button,input,select,textarea{font:inherit;color:inherit}.app{width:100%;max-width:720px;margin:auto;min-height:100vh;padding-bottom:98px}
header{padding:14px 16px 6px}.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}.brand{font-family:var(--hand);font-size:13px;font-weight:600}.keychip{border:1px solid var(--line);background:#ffffff88;padding:5px 8px;font-size:9px;letter-spacing:.06em}.head{display:flex;align-items:center;justify-content:space-between;background:#ffffffbd;border:1px solid var(--line);padding:8px 10px;transform:rotate(-.25deg)}.head h1{font-family:var(--hand);font-size:17px;margin:0}.home{font-size:11px;color:var(--muted);text-decoration:none;border-bottom:1px dashed var(--line)}
main{padding:18px 14px}.tabs,.chips{display:flex;gap:7px;overflow:auto;scrollbar-width:none}.tabs button,.chips button{border:1px solid var(--line);background:#fff;padding:8px 12px;white-space:nowrap;font-size:12px}.tabs button.on{background:var(--ink);color:var(--desk)}.chips{margin-top:9px}.chips button.on{background:#efe6f7;border-color:#b9a6d8;font-weight:700}
.search{width:100%;border:0;border-bottom:1px solid var(--line);background:#fffdf9;padding:11px 10px;margin:12px 0 0;font-size:14px}.count{font-family:var(--hand);font-size:12px;color:var(--muted);margin:14px 4px 6px}
.list{display:grid;gap:13px}.card{position:relative;background:var(--paper);padding:15px 14px 14px;border:1px solid rgba(64,56,47,.1);box-shadow:var(--shadow);transform:rotate(-.2deg)}.card:nth-child(even){transform:rotate(.2deg)}.card:before{content:"";position:absolute;width:54px;height:16px;background:#a4c5afaa;top:-8px;left:22px;transform:rotate(-3deg)}.cardtop{display:flex;justify-content:space-between;gap:8px}.person{font-family:var(--hand);font-weight:600;font-size:17px}.handle{font-size:11px;color:var(--muted)}.swap{display:grid;grid-template-columns:1fr 30px 1fr;align-items:stretch;margin:13px 0 10px}.thing{border:1px dashed var(--line);padding:10px 8px;text-align:center;font-size:11px;line-height:1.55;background:#fffdf9}.thing b{display:block;font-size:14px}.series{display:block;color:var(--muted);font-size:10px}.arrow{display:grid;place-items:center;font-family:var(--hand);font-size:19px}.meta{font-size:11px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:8px}.badge{font-size:10px;font-weight:700;padding:4px 8px;border:1px solid var(--line);background:#fff4d8}.badge.temp{background:#f0e7fb}.badge.sent{background:#e8f2f8}.badge.done{background:#e7f3ea}
.empty{text-align:center;color:var(--muted);font-family:var(--hand);padding:58px 20px}.note{font-size:10px;color:var(--muted);margin:14px 3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.syncNow{border:0;background:none;padding:0;color:var(--ink);font-size:10px;border-bottom:1px dashed var(--line)}.syncStatus[data-state="ok"]{color:#52705d}.syncStatus[data-state="sync"]{color:#756392}.syncStatus[data-state="local"]{color:var(--muted)}.fab{position:fixed;z-index:20;left:50%;right:auto;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));width:min(310px,calc(100vw - 40px));height:58px;padding:0 20px;border:1.5px solid #b85d76;border-radius:0;background:#e27a94;color:#fff;font-family:var(--hand);box-shadow:0 10px 24px rgba(142,73,92,.28);display:flex;align-items:center;justify-content:center;gap:9px}.fabPlus{font-size:26px;line-height:1}.fabText{font-size:15px;font-weight:600;white-space:nowrap;letter-spacing:.03em}
dialog{border:0;border-radius:0;width:min(94vw,620px);max-width:calc(100vw - 24px);max-height:90vh;padding:0;background:#fffdf9;box-shadow:0 20px 70px #0003;overflow-x:hidden;overflow-y:auto;overscroll-behavior-x:none;touch-action:pan-y}dialog::backdrop{background:#40382f66}.formhead{position:sticky;top:0;z-index:2;width:100%;max-width:100%;background:#fffdf9;padding:15px 18px;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;overflow:hidden}.formhead b{font-family:var(--hand);font-size:17px}.form{width:100%;max-width:100%;padding:8px 18px 24px;overflow-x:hidden;overscroll-behavior-x:none;touch-action:pan-y}.form h3{font-family:var(--hand);font-size:14px;margin:18px 0 8px}.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;max-width:100%}.form input,.form select,.form textarea{display:block;width:100%;min-width:0;max-width:100%;border:1px solid var(--line);background:#fff;padding:10px;border-radius:0}.form textarea{min-height:72px}.members{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%;max-width:100%;overflow:hidden}.members button{border:1px solid var(--line);background:#fff;padding:8px 2px;font-size:10px}.members button.on{background:#efe6f7;border-color:#aa91cf;font-weight:700}.fieldlabel{display:block;font-size:10px;color:var(--muted);margin:8px 0 4px}.save{width:100%;border:1.5px solid var(--ink);background:var(--ink);color:#fff;padding:12px;font-weight:700;margin-top:18px}.close{border:0;background:none;font-size:20px}.statusBox{margin:14px 0 4px;padding:12px;background:#f7f0fb;border:1px dashed #b9a6d8}.statusBox h3{margin:0 0 8px}.statusBtns{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.statusBtns button{border:1px solid var(--line);background:#fff;padding:10px;font-weight:700}.statusBtns button.on{background:var(--ink);color:#fff;border-color:var(--ink)}.del{border:0;background:none;color:#b34b65;font-size:11px;margin-top:15px;width:100%}.keyPanel{padding:16px 18px 20px}.keyPanel p{margin:0 0 12px;font-size:10px;line-height:1.7;color:var(--muted)}.keyValue{width:100%;border:1px solid var(--line);background:#fff;padding:10px;font-size:12px;letter-spacing:.05em}.keyActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.keyActions button{padding:10px;border:1px solid var(--ink);background:#fff;font-size:10px}.keyActions .primary{background:var(--ink);color:#fff}.keyNew{width:100%;margin-top:8px;border:0;background:none;color:var(--muted);font-size:9px;text-decoration:underline;text-underline-offset:3px}
@media(max-width:460px){.grid2{grid-template-columns:1fr}}
</style></head><body><div class="app">
<header><div class="brandrow"><div class="brand">MUZE TOOL BOX</div><button class="keychip" id="keyOpen" type="button">MUZE KEY</button></div><div class="head"><h1>交換約束ログ</h1><a class="home" href="../">TOOL BOXへ</a></div></header>
<main><div class="tabs"><button class="on" data-tab="open">未完了</button><button data-tab="done">交換履歴</button></div>
<input class="search" id="search" placeholder="交換相手・メンバー・グッズで検索">
<div class="chips" id="filters"><button class="on" data-filter="all">すべて</button><button data-filter="郵送">郵送</button><button data-filter="手渡し">手渡し</button><button data-filter="仮約束">仮約束</button><button data-filter="約束済">約束済</button><button data-filter="発送済">発送済</button></div>
<div class="count" id="count"></div><div class="list" id="list"></div><p class="note"><span class="syncStatus" id="syncStatus" data-state="local">この端末に保存中</span><button class="syncNow" id="syncNow" type="button">今すぐ同期</button></p></main>
<button class="fab" id="add" type="button" aria-label="交換を追加"><span class="fabPlus">＋</span><span class="fabText">交換約束を追加</span></button>
<dialog id="dlg"><div class="formhead"><b id="formTitle">交換の新規登録</b><button class="close" id="close">×</button></div><form class="form" id="form">
<input type="hidden" id="editId"><h3>お相手</h3><div class="grid2"><input id="name" placeholder="ニックネーム" required><input id="handle" placeholder="@ID"></div>
<h3>自分が渡す</h3><div class="members" id="giveMembers"></div><label class="fieldlabel">グッズ</label><select id="giveType"></select><label class="fieldlabel">絵柄 / シリーズ</label><select id="giveSeries"></select><label class="fieldlabel">詳細</label><input id="giveDetail" placeholder="例：EIKI 引き">
<h3>相手からもらう</h3><div class="members" id="getMembers"></div><label class="fieldlabel">グッズ</label><select id="getType"></select><label class="fieldlabel">絵柄 / シリーズ</label><select id="getSeries"></select><label class="fieldlabel">詳細</label><input id="getDetail" placeholder="例：NAOYA 寄り">
<h3>交換方法・日程</h3>
<label class="fieldlabel">交換方法</label><select id="method"><option>郵送</option><option>手渡し</option></select>
<div class="grid2" style="margin-top:8px">
  <div><label class="fieldlabel">約束した日</label><input type="date" id="promiseDate"></div>
  <div><label class="fieldlabel" id="dueLabel">発送予定日</label><input type="date" id="dueDate"></div>
</div>
<label class="fieldlabel" id="eventLabel">会場・イベント（手渡しの場合）</label><input id="event" placeholder="例：有明アリーナ">
<h3>メモ</h3><textarea id="memo" placeholder="梱包、発送、待ち合わせなど"></textarea>
<div id="statusArea" class="statusBox"><h3>ステータス</h3><div class="statusBtns" id="statusBtns"></div></div>
<button class="save" type="submit">保存する</button><button class="del" type="button" id="del" hidden>この記録を削除</button>
</form></dialog>
<dialog id="keyDlg"><div class="formhead"><b>MUZE KEY</b><button class="close" id="keyClose" type="button">×</button></div><div class="keyPanel"><p>MUZE TOOL BOXで使う共通KEYです。交換約束ログは、このKEYでクラウド保存・復元できます。</p><input class="keyValue" id="keyValue" autocomplete="off" autocapitalize="characters" spellcheck="false"><div class="keyActions"><button id="keyCopy" type="button">コピー</button><button class="primary" id="keyUse" type="button">このKEYを使う</button></div><button class="keyNew" id="keyNew" type="button">新しいMUZE KEYを発行</button></div></dialog>
</div>
<script src="../assets/muze-key.js"></script>
<script>
(function(){
"use strict";
const MEMBERS=["KAIRYU","NAOYA","RAN","SEITO","RYUKI","TAKUTO","HAYATO","EIKI"];
const TYPES=["フォトカード","ICカード","フレークシールセット","MZ Mate ランダムぷりぷりチャーム","缶バッジ","アクリルスタンド","その他"];
const SERIES=["So Strawberry","Touch","Play at the MUZEUM vol.2","その他"];
const STATUSES=["仮約束","約束済","発送済","交換完了"];
const BASE_KEY="muze_exchange_log_v1";
const API_URL="https://muze-toolbox-api.logical-bear-ishi.workers.dev/api/exchange";
let KEY=MUZEKey.storageKey(BASE_KEY);
const $=s=>document.querySelector(s);
let rows=[];
function normalizeRows(input){
  return (Array.isArray(input)?input:[]).map(r=>Object.assign({},r,{status:r.status==="発送準備"?"約束済":(r.status||"仮約束"),giveSeries:r.giveSeries||"",getSeries:r.getSeries||""}));
}
function dirtyKey(){return "muze_exchange_dirty_v1:"+MUZEKey.get()}
function loadRows(){
  if(localStorage.getItem(KEY)===null){
    const legacy=localStorage.getItem(BASE_KEY);
    if(legacy!==null)localStorage.setItem(KEY,legacy);
  }
  try{rows=normalizeRows(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){rows=[]}
  try{localStorage.setItem(KEY,JSON.stringify(rows))}catch(e){}
}
loadRows();
let tab="open",filter="all",selected={give:"",get:""},currentStatus="仮約束";

function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function setSyncStatus(state,text){
  const el=$("#syncStatus");if(!el)return;
  el.dataset.state=state;el.textContent=text;
}
function saveLocal(markDirty=true){
  try{
    localStorage.setItem(KEY,JSON.stringify(rows));
    if(markDirty)localStorage.setItem(dirtyKey(),"1");
  }catch(e){}
}
async function cloudSave(){
  setSyncStatus("sync","クラウド同期中…");
  try{
    const res=await fetch(API_URL,{
      method:"PUT",
      headers:{"Content-Type":"application/json","X-MUZE-Key":MUZEKey.get()},
      body:JSON.stringify({rows})
    });
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    if(!data||data.ok!==true)throw new Error("invalid response");
    try{localStorage.removeItem(dirtyKey())}catch(e){}
    setSyncStatus("ok","KEYにクラウド保存済み");
    return true;
  }catch(e){
    setSyncStatus("local","この端末には保存済み・クラウド未接続");
    return false;
  }
}
async function syncFromCloud(){
  setSyncStatus("sync","クラウド確認中…");
  try{
    const res=await fetch(API_URL,{method:"GET",headers:{"X-MUZE-Key":MUZEKey.get()}});
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    const dirty=localStorage.getItem(dirtyKey())==="1";
    if(dirty){
      await cloudSave();
      return;
    }
    if(data&&data.found){
      rows=normalizeRows(data.rows);
      saveLocal(false);
      render();
      setSyncStatus("ok","KEYから復元・同期済み");
      return;
    }
    if(rows.length){
      localStorage.setItem(dirtyKey(),"1");
      await cloudSave();
      return;
    }
    setSyncStatus("ok","クラウドに接続済み");
  }catch(e){
    setSyncStatus("local","この端末には保存済み・クラウド未接続");
  }
}
function persist(){
  saveLocal(true);
  render();
  cloudSave();
}
function openDialog(){const d=$("#dlg");if(!d)return;if(typeof d.showModal==="function"){try{d.showModal();return}catch(e){}}d.setAttribute("open","")}
function closeDialog(){const d=$("#dlg");if(!d)return;if(typeof d.close==="function"){try{d.close();return}catch(e){}}d.removeAttribute("open")}
function syncStatusButtons(){document.querySelectorAll("#statusBtns button").forEach(b=>b.classList.toggle("on",b.dataset.status===currentStatus))}
function syncDateLabels(){const hand=$("#method").value==="手渡し";$("#dueLabel").textContent=hand?"受け渡し予定日":"発送予定日";$("#eventLabel").textContent=hand?"会場・イベント":"会場・イベント（手渡しの場合）"}
function resetForm(){
 $("#form").reset();$("#editId").value="";selected={give:"",get:""};currentStatus="仮約束";
 document.querySelectorAll(".members button").forEach(b=>b.classList.remove("on"));
 $("#del").hidden=true;$("#formTitle").textContent="交換の新規登録";syncStatusButtons();syncDateLabels();
}
function init(){
 ["giveType","getType"].forEach(id=>$("#"+id).innerHTML=TYPES.map(x=>"<option>"+x+"</option>").join(""));
 ["giveSeries","getSeries"].forEach(id=>$("#"+id).innerHTML=SERIES.map(x=>"<option>"+x+"</option>").join(""));
 ["give","get"].forEach(side=>{
   const box=$("#"+side+"Members");
   MEMBERS.forEach(m=>{const b=document.createElement("button");b.type="button";b.textContent=m;b.addEventListener("click",()=>{selected[side]=m;Array.from(box.children).forEach(x=>x.classList.toggle("on",x===b))});box.appendChild(b)});
 });
 $("#statusBtns").innerHTML=STATUSES.map(s=>'<button type="button" data-status="'+s+'">'+s+"</button>").join("");
 document.querySelectorAll("#statusBtns button").forEach(b=>b.addEventListener("click",()=>{currentStatus=b.dataset.status;syncStatusButtons()}));
 $("#method").addEventListener("change",syncDateLabels);
 $("#add").addEventListener("click",()=>{resetForm();openDialog()});
 $("#close").addEventListener("click",closeDialog);
 $("#form").addEventListener("submit",submitForm);
 $("#del").addEventListener("click",deleteRow);
 document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{tab=b.dataset.tab;document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));render()}));
 document.querySelectorAll(".chips button").forEach(b=>b.addEventListener("click",()=>{filter=b.dataset.filter;document.querySelectorAll(".chips button").forEach(x=>x.classList.toggle("on",x===b));render()}));
 $("#search").addEventListener("input",render);
}
function render(){
 const q=$("#search").value.trim().toLowerCase();
 const out=rows.filter(r=>(tab==="done"?r.status==="交換完了":r.status!=="交換完了"))
   .filter(r=>filter==="all"||r.method===filter||r.status===filter)
   .filter(r=>JSON.stringify(r).toLowerCase().includes(q))
   .sort((a,b)=>(b.created||"").localeCompare(a.created||""));
 $("#count").textContent=(tab==="done"?"完了 ":"未完了 ")+out.length+"件";
 $("#list").innerHTML=out.length?out.map(r=>'<article class="card" data-id="'+esc(r.id)+'"><div class="cardtop"><div><span class="person">'+esc(r.name)+'</span> <span class="handle">'+esc(r.handle)+'</span></div><span class="badge '+(r.status==="交換完了"?"done":r.status==="発送済"?"sent":r.status==="仮約束"?"temp":"")+'">'+esc(r.status)+'</span></div><div class="swap"><div class="thing"><b>'+esc(r.giveMember||"—")+'</b>'+esc(r.giveType)+'<span class="series">'+esc(r.giveSeries)+'</span><span class="series">'+esc(r.giveDetail)+'</span></div><div class="arrow">⇄</div><div class="thing"><b>'+esc(r.getMember||"—")+'</b>'+esc(r.getType)+'<span class="series">'+esc(r.getSeries)+'</span><span class="series">'+esc(r.getDetail)+'</span></div></div><div class="meta"><span>'+esc(r.method)+'</span><span>約束 '+esc(r.promiseDate||"未設定")+'</span>'+(r.dueDate?'<span>予定 '+esc(r.dueDate)+'</span>':"")+(r.event?'<span>'+esc(r.event)+'</span>':"")+'</div></article>').join(""):'<div class="empty">まだ記録がありません。<br>下の「交換約束を追加」から登録できます。</div>';
 document.querySelectorAll(".card").forEach(c=>c.addEventListener("click",()=>openEdit(c.dataset.id)));
}
function openEdit(id){
 const r=rows.find(x=>x.id===id);if(!r)return;resetForm();
 $("#editId").value=id;$("#formTitle").textContent="交換詳細";
 ["name","handle","giveType","giveSeries","giveDetail","getType","getSeries","getDetail","method","promiseDate","dueDate","event","memo"].forEach(k=>$("#"+k).value=r[k]||"");
 selected={give:r.giveMember||"",get:r.getMember||""};currentStatus=r.status||"仮約束";
 ["give","get"].forEach(side=>document.querySelectorAll('#'+side+'Members button').forEach(b=>b.classList.toggle("on",b.textContent===selected[side])));
 $("#del").hidden=false;syncStatusButtons();syncDateLabels();openDialog();
}
function submitForm(e){
 e.preventDefault();const id=$("#editId").value;
 const obj={id:id||("x"+Date.now()+Math.random().toString(36).slice(2)),name:$("#name").value.trim(),handle:$("#handle").value.trim(),giveMember:selected.give,giveType:$("#giveType").value,giveSeries:$("#giveSeries").value,giveDetail:$("#giveDetail").value.trim(),getMember:selected.get,getType:$("#getType").value,getSeries:$("#getSeries").value,getDetail:$("#getDetail").value.trim(),method:$("#method").value,promiseDate:$("#promiseDate").value,dueDate:$("#dueDate").value,event:$("#event").value.trim(),memo:$("#memo").value.trim(),status:currentStatus,created:new Date().toISOString()};
 if(id){const old=rows.find(x=>x.id===id);if(old)obj.created=old.created;rows=rows.map(x=>x.id===id?obj:x)}else{rows.push(obj)}
 persist();closeDialog();
}
function deleteRow(){const id=$("#editId").value;if(id&&confirm("この交換記録を削除しますか？")){rows=rows.filter(x=>x.id!==id);persist();closeDialog()}}
function openSpecificDialog(d){if(typeof d.showModal==="function"){try{d.showModal();return}catch(e){}}d.setAttribute("open","")}
function closeSpecificDialog(d){if(typeof d.close==="function"){try{d.close();return}catch(e){}}d.removeAttribute("open")}
function refreshKeyChip(){$("#keyOpen").textContent="KEY "+MUZEKey.get().slice(-4)}
function openKeyDialog(){$("#keyValue").value=MUZEKey.get();openSpecificDialog($("#keyDlg"))}
async function switchKey(raw){
  const normalized=MUZEKey.normalize(raw);
  if(!MUZEKey.valid(normalized)){alert("MUZE KEYの形式を確認してください");return}
  MUZEKey.set(normalized);
  KEY=MUZEKey.storageKey(BASE_KEY);
  loadRows();render();refreshKeyChip();closeSpecificDialog($("#keyDlg"));
  await syncFromCloud();
}
init();
refreshKeyChip();
$("#keyOpen").addEventListener("click",openKeyDialog);
$("#keyClose").addEventListener("click",()=>closeSpecificDialog($("#keyDlg")));
$("#keyCopy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(MUZEKey.get())}catch(e){$("#keyValue").select();document.execCommand("copy")}});
$("#keyUse").addEventListener("click",()=>switchKey($("#keyValue").value));
$("#keyNew").addEventListener("click",()=>{if(confirm("新しいMUZE KEYへ切り替えますか？ 現在のKEYの記録は削除されません。"))switchKey(MUZEKey.generate())});
$("#syncNow").addEventListener("click",syncFromCloud);
render();
syncFromCloud();
})();
</script></body></html>
