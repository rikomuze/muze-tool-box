<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1ebe1">
<meta name="robots" content="noindex">
<title>MUZE DAY | MUZE TOOL BOX</title>
<meta name="description" content="ライブ・フェスの日の、交換とミーグリを見失わないための当日しおり。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Klee+One:wght@400;600&family=Montserrat:wght@500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#f1ebe1;--paper:#fff;--ink:#40382f;--faded:#6f6456;--muted:#8f8577;--red:#c0472f;
  --berry:#e27a94;--berry-t:rgba(226,122,148,.85);--berry-ink:#a8445f;
  --mint:#a4c5af;--mint-t:rgba(164,197,175,.85);--mint-ink:#4a7556;
  --lav:#bfaee3;--lav-t:rgba(190,172,226,.85);--lav-pale:#efe5ff;--lav-ink:#65559a;
  --butter-t:rgba(240,212,150,.85);--butter-ink:#7a5f22;
  --hand:"Klee One","Zen Kaku Gothic New",sans-serif;
  --gothic:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --en:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --serif:"DM Serif Display",Georgia,serif;
  --shadow:0 10px 24px rgba(64,56,47,.18);--shadow-s:0 4px 12px rgba(64,56,47,.14);
  --dash:1.5px dashed rgba(64,56,47,.35);
}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;color:var(--ink);font-family:var(--gothic);line-height:1.6;-webkit-text-size-adjust:100%;
  background:radial-gradient(rgba(64,56,47,.06) 1px,transparent 1px) 0 0/22px 22px,var(--desk);padding-bottom:120px}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:16px}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--berry);outline-offset:3px}
.hidden{display:none!important}
.wrap{max-width:560px;margin:0 auto}

/* 共通ナビ（muze-key と同じ形） */
.tool-nav{max-width:560px;margin:0 auto;padding:12px 16px 0}
.tool-nav-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(255,255,255,.74);border:1px solid rgba(64,56,47,.14);padding:8px 10px;transform:rotate(-.3deg)}
.tool-nav-brand{font-family:var(--hand);font-size:14px;font-weight:600;white-space:nowrap;text-decoration:none}
.tool-nav-links{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.tool-nav-links::-webkit-scrollbar{display:none}
.tool-nav-links a{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);white-space:nowrap;border-bottom:1px dashed rgba(64,56,47,.28);text-decoration:none}

/* 部品 */
.tape{position:absolute;height:14px;width:44px;transform:rotate(-7deg);z-index:2;pointer-events:none}
.t-berry{background:var(--berry-t)}.t-mint{background:var(--mint-t)}.t-lav{background:var(--lav-t)}.t-butter{background:var(--butter-t)}
.sticker{position:relative;display:inline-block;background:var(--paper);padding:6px 14px 7px;transform:rotate(-2deg);box-shadow:var(--shadow);font-family:var(--hand);font-weight:600;font-size:15px;white-space:nowrap}
.sticker .tape{top:-6px;left:-10px;width:40px;height:13px;transform:rotate(-12deg)}
.sticker span{color:var(--berry-ink)}
.hand{font-family:var(--hand);font-weight:600}
.en{font-family:var(--en);font-weight:700}
.faded{color:var(--faded)}
.small{font-size:12px}
.stamp{display:inline-flex;align-items:center;height:22px;padding:0 9px;border:1.5px solid currentColor;border-radius:999px;font-family:var(--hand);font-weight:600;font-size:11.5px;transform:rotate(-3deg);white-space:nowrap;background:var(--paper)}
.c-berry{color:var(--berry-ink)}.c-mint{color:var(--mint-ink)}.c-lav{color:var(--lav-ink)}.c-butter{color:var(--butter-ink)}
.prio{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:50%;font-family:var(--hand);font-weight:600;font-size:11.5px;white-space:nowrap}
.prio.must{border:1.5px solid var(--red);color:var(--red);transform:rotate(-4deg)}
.prio.maybe{border:1.5px dashed rgba(64,56,47,.45);color:var(--faded);transform:rotate(3deg)}
.chip{min-height:44px;min-width:44px;padding:8px 15px;font-family:var(--hand);font-weight:600;font-size:13.5px;border:1.5px solid var(--ink);border-radius:50%;background:transparent;transform:rotate(2deg)}
.chip:nth-child(2n){transform:rotate(-2deg)}
.chip:nth-child(3n){transform:rotate(1.2deg)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--desk)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.btn{min-height:48px;padding:10px 16px;border:1.5px solid var(--ink);background:var(--paper);font-weight:700;font-size:14px}
.btn.dark{background:var(--ink);color:var(--desk)}
.btn.oval{border-radius:50%;background:transparent;font-family:var(--hand);font-weight:600;transform:rotate(-1.5deg)}
.btn.full{width:100%}
.link{background:none;border:0;padding:8px 4px;font-size:12.5px;color:var(--faded);text-decoration:underline dashed rgba(64,56,47,.4);text-underline-offset:4px;min-height:40px}
.field{display:flex;flex-direction:column}
.field label,.lbl{font-family:var(--hand);font-weight:600;font-size:13px}
.field input,.field select,.field textarea{font-family:var(--hand);font-weight:600;background:transparent;border:0;border-bottom:var(--dash);padding:7px 2px;outline:none;border-radius:0}
.field input::placeholder{color:rgba(64,56,47,.35)}
.hint{font-size:11.5px;color:var(--faded);line-height:1.6}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.paper{position:relative;background:var(--paper);box-shadow:var(--shadow-s)}

/* 日のヘッダー */
.dayhead{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 4px;gap:10px}
.dayhead .right{display:flex;align-items:center;gap:10px}
.kindtag{padding:3px 9px;border:1.5px solid;font-family:var(--en);font-weight:700;font-size:11px;letter-spacing:.18em;transform:rotate(2deg);background:var(--paper)}
.bigdate{font-family:var(--en);font-weight:700;font-size:26px;line-height:1.2}
.bigdate small{font-size:11px;letter-spacing:.16em;margin-left:5px;color:var(--faded)}
.daytitle{padding:6px 16px 12px}
.daytitle button{background:none;border:0;padding:0;text-align:left}
.daytitle .t{font-family:var(--hand);font-weight:600;font-size:15px;line-height:1.45}

/* ビュー切替タブ */
.vtabs{display:flex;gap:10px;padding:0 16px}
.vtab{position:relative;flex:1;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px;background:rgba(255,255,255,.5);border:1.5px dashed rgba(64,56,47,.32);color:var(--faded)}
.vtab:first-child{transform:rotate(-.8deg)}.vtab:last-child{transform:rotate(.8deg)}
.vtab .l{font-size:15px}
.vtab .s{font-size:11px;color:var(--faded)}
.vtab[aria-selected="true"]{background:var(--paper);border:1.5px solid var(--ink);box-shadow:var(--shadow-s);color:var(--ink)}
.vtab[aria-selected="true"]::before{content:"";position:absolute;top:-6px;left:50%;width:40px;height:12px;margin-left:-20px;transform:rotate(-4deg)}
.vtab.ev[aria-selected="true"]::before{background:var(--lav-t)}
.vtab.fes[aria-selected="true"]::before{background:var(--mint-t)}
.vtab.mt[aria-selected="true"]::before{background:var(--berry-t)}
.swipehint{text-align:center;font-size:10.5px;color:var(--faded);margin-top:6px}

/* NOW */
.now{margin:14px 16px 0;display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(255,255,255,.6);border:var(--dash);font-size:12px}
.now .tag{font-family:var(--en);font-weight:700;font-size:10px;letter-spacing:.16em;padding:1px 7px;background:var(--ink);color:var(--desk)}
.now .b{font-family:var(--hand);font-weight:600;font-size:14px}
.now .r{margin-left:auto;text-align:right}

.sec{padding:24px 16px 10px}
.sec h2{margin:0;font-family:var(--hand);font-weight:600;font-size:18px;display:flex;align-items:baseline;gap:8px}
.sec h2 .n{font-family:var(--en);font-size:14px;color:var(--faded)}
.sec p{margin:0;font-size:11.5px;color:var(--faded)}

/* 交換カード */
.trade{margin:0 16px 16px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.trade:nth-child(2n){transform:rotate(.4deg)}.trade:nth-child(2n+1){transform:rotate(-.4deg)}
.trade .tape{top:-7px;right:22px;transform:rotate(5deg)}
.trade .top{display:flex;align-items:center;gap:8px}
.trade .who{font-family:var(--hand);font-weight:600;font-size:19px;line-height:1.3;background:none;border:0;padding:0;text-align:left}
.trade .due{margin-left:auto;text-align:right;line-height:1.25}
.trade .due b{font-family:var(--hand);font-weight:600;font-size:13.5px;display:block}
.trade .due span{font-size:11px;color:var(--faded)}
.swap{display:grid;grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr);align-items:center;gap:6px;padding:8px 10px;background:var(--desk)}
.swap .k{font-family:var(--hand);font-weight:600;font-size:10.5px;color:var(--faded)}
.swap .v{font-size:13.5px;font-weight:700;line-height:1.35;word-break:break-word}
.status{display:flex;align-items:center;gap:8px}
.status .undecided{flex:1;padding:7px 10px;border:var(--dash);font-size:12.5px;line-height:1.45}
.status .fixed{flex:1;display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(164,197,175,.22);font-size:12.5px}
.status .fixed .en{font-size:16px}
.nudge{padding:9px 11px;background:var(--desk);font-family:var(--hand);font-weight:600;font-size:13.5px;line-height:1.5}
.nudge .chips{margin-top:8px}
.logfoot{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--faded)}
.logfoot a{margin-left:auto;text-decoration:underline dashed rgba(64,56,47,.4);text-underline-offset:3px}
.trade.done{opacity:.6}
.donebar{margin:0 16px;font-size:12px;color:var(--faded)}

/* 会えたら */
.bands{padding:0 16px}
.bandh{display:flex;align-items:baseline;gap:8px;margin:8px 0}
.bandh b{font-family:var(--hand);font-weight:600;font-size:14px;padding:0 6px;background:linear-gradient(transparent 60%,rgba(190,172,226,.45) 60%)}
.bandh span{font-size:11px;color:var(--faded)}
.loose{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 12px;margin-bottom:8px;background:rgba(255,255,255,.72);border:1.5px dashed rgba(64,56,47,.35)}
.loose:nth-child(2n){transform:rotate(.5deg)}.loose:nth-child(2n+1){transform:rotate(-.5deg)}
.loose .body{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.loose .nm{font-family:var(--hand);font-weight:600;font-size:16px;margin-right:6px}
.loose .memo{display:block;font-size:11.5px;color:var(--faded);line-height:1.45}
.loose .go{flex-shrink:0;min-height:40px;padding:0 11px;border:1.5px solid var(--ink);border-radius:50%;background:transparent;font-family:var(--hand);font-weight:600;font-size:12px;transform:rotate(2deg)}
.loose.done{opacity:.55}

/* 流れ */
.flowhead{display:flex;align-items:baseline;justify-content:space-between;padding:24px 16px 6px}
.flowhead b{font-family:var(--hand);font-weight:600;font-size:18px}
.flowhead span{font-size:11.5px;color:var(--faded)}
.off{margin:4px 16px;display:flex;align-items:center;gap:10px;padding:7px 12px;background:var(--lav-pale);width:calc(100% - 32px);border:0;text-align:left}
.off.faint{opacity:.75}
.off .en{font-size:14px;width:48px}
.off .hand{font-size:14px}
.off .sub{margin-left:auto;font-size:11.5px;color:var(--faded)}
.off.act{background:rgba(164,197,175,.25)}
.ticket{position:relative;margin:6px 16px;display:flex;background:var(--paper);box-shadow:var(--shadow-s);width:calc(100% - 32px);border:0;padding:0;text-align:left}
.ticket:nth-of-type(2n){transform:rotate(.5deg)}.ticket:nth-of-type(2n+1){transform:rotate(-.5deg)}
.ticket .tape{top:-7px;right:26px;transform:rotate(6deg)}
.ticket .stub{width:74px;flex-shrink:0;padding:14px 0 12px;text-align:center;border-right:2px dashed rgba(64,56,47,.28);position:relative}
.ticket .stub::before,.ticket .stub::after{content:"";position:absolute;right:-8px;width:14px;height:14px;border-radius:50%;background:var(--desk)}
.ticket .stub::before{top:-7px}.ticket .stub::after{bottom:-7px}
.ticket .stub .en{font-size:20px;line-height:1.1}
.ticket .stub .e{font-family:var(--en);font-weight:600;font-size:11px;color:var(--faded)}
.ticket .main{flex:1;min-width:0;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.ticket .nm{font-family:var(--hand);font-weight:600;font-size:18px;line-height:1.3;margin-right:6px}
.ticket .pl{font-size:13px;font-weight:700;line-height:1.45}
.ticket .mk{font-size:12.5px;line-height:1.45}
.ticket.done{opacity:.6}
.ticket .donestamp{position:absolute;right:12px;bottom:10px;font-family:var(--hand);font-weight:600;font-size:12px;color:var(--mint-ink);border:1.5px solid var(--mint-ink);border-radius:50%;padding:0 8px;transform:rotate(-8deg)}
.mini{margin:4px 16px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--paper);box-shadow:var(--shadow-s);width:calc(100% - 32px);border:0;text-align:left}
.mini .en{font-size:14px;width:48px}
.gap{display:flex;padding:4px 16px 4px 52px;align-items:flex-start;gap:0}
.gap .line{border-left:2px dashed rgba(64,56,47,.3);min-height:30px;margin-right:16px;align-self:stretch}
.gap .pill{display:inline-flex;align-items:center;padding:3px 11px;border-radius:999px;font-family:var(--hand);font-weight:600;font-size:12.5px;background:rgba(255,255,255,.7)}
.gap .pill.calm{background:rgba(164,197,175,.3);color:var(--mint-ink)}
.gap .pill.tight{background:rgba(240,212,150,.45);color:#6b521a}
.gap .pill.short{background:var(--paper);color:var(--red);border:1.5px solid var(--red)}
.gap .sub{font-size:11.5px;color:var(--faded);line-height:1.5;margin-top:3px}
.flag{position:relative;margin:6px 16px 6px 64px;padding:7px 10px;border:1.5px dashed var(--mint-ink);background:rgba(255,255,255,.6)}
.flag::before{content:"";position:absolute;left:-14px;top:50%;width:12px;border-top:1.5px dashed var(--mint-ink)}
.flag b{font-family:var(--hand);font-weight:600;font-size:12.5px;color:var(--mint-ink);display:block}
.flag span{font-size:11px;color:var(--faded)}
.zone{display:flex;align-items:center;gap:8px;padding:14px 16px 4px}
.zone::before{content:"";flex:0 0 14px;border-top:var(--dash)}
.zone::after{content:"";flex:1;border-top:var(--dash)}
.zone b{font-family:var(--hand);font-weight:600;font-size:14px;white-space:nowrap}
.zone .nowtag{font-family:var(--en);font-weight:700;font-size:10px;letter-spacing:.16em;padding:1px 7px;background:var(--ink);color:var(--desk)}
.zonesub{padding:0 16px 4px 38px;font-size:11.5px;color:var(--faded)}
.empty{margin:0 16px;padding:14px;border:var(--dash);background:rgba(255,255,255,.45);font-size:12.5px;color:var(--faded);line-height:1.7}

/* LIVE */
.liveticket{margin:18px 16px 0;padding:16px 16px 14px;transform:rotate(-.6deg);box-shadow:var(--shadow)}
.liveticket .tape{top:-8px;left:20px;width:60px;height:17px;transform:rotate(-6deg)}
.liveticket .cap{font-family:var(--en);font-weight:700;font-size:11px;letter-spacing:.2em;color:var(--lav-ink)}
.lt-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:8px;text-align:center}
.lt-grid>div+div{border-left:var(--dash)}
.lt-grid .hand{font-size:12px;color:var(--faded)}
.lt-grid .en{font-size:22px}
.summary{margin:16px 16px 0;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--paper);box-shadow:var(--shadow-s);border:0;width:calc(100% - 32px);text-align:left;transform:rotate(.4deg);font-size:12px}
.summary .hand{font-size:14px;white-space:nowrap}
.summary .go{margin-left:auto;font-size:11.5px;color:var(--faded);white-space:nowrap}
.check{margin:22px 16px 0;padding:14px 16px 10px;transform:rotate(.5deg)}
.check .tape{top:-7px;right:24px;transform:rotate(5deg)}
.check h3{margin:0;font-family:var(--hand);font-weight:600;font-size:16px;display:flex;justify-content:space-between}
.ck{display:flex;align-items:center;gap:8px;min-height:40px;font-size:14px}
.ck input{width:20px;height:20px;accent-color:var(--berry-ink);flex-shrink:0}
.ck.done span{text-decoration:line-through;color:var(--faded)}
.ck .x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:14px;min-width:36px;min-height:36px}
.ckgroup{font-family:var(--hand);font-weight:600;font-size:12px;color:var(--lav-ink);margin-top:6px}
.addck{display:flex;gap:8px;margin-top:6px}
.addck input{flex:1;border:0;border-bottom:var(--dash);background:transparent;padding:6px 2px;font-family:var(--hand);font-weight:600;outline:none}
.addck button{min-height:40px;padding:0 12px;border:1.5px solid var(--ink);background:transparent;font-family:var(--hand);font-weight:600;border-radius:50%}

/* FES */
.act{position:relative;margin:6px 16px;display:flex;background:var(--paper);box-shadow:var(--shadow-s);width:calc(100% - 32px);border:0;padding:0;text-align:left}
.act.not{opacity:.55}
.act .stub{width:74px;flex-shrink:0;padding:10px 0;text-align:center;border-right:2px dashed rgba(64,56,47,.28)}
.act .stub .en{font-size:17px;line-height:1.2}
.act .stub .e{font-family:var(--en);font-weight:600;font-size:11px;color:var(--faded)}
.act .main{flex:1;padding:9px 14px;display:flex;flex-direction:column;gap:3px}
.act .ar{font-family:var(--en);font-weight:700;font-size:16px;letter-spacing:.06em}
.act .st{align-self:flex-start;padding:1px 8px;background:rgba(164,197,175,.3);font-family:var(--en);font-weight:700;font-size:10.5px;letter-spacing:.14em;color:var(--mint-ink)}
.act .want{position:absolute;top:9px;right:12px;font-family:var(--hand);font-weight:600;font-size:11px;color:var(--berry-ink)}
.warn{margin:6px 16px;padding:12px;border:1.5px solid var(--red);background:rgba(255,255,255,.55)}
.warn b{font-family:var(--hand);font-weight:600;font-size:14px;color:var(--red);display:block}
.warn span{font-size:11.5px;color:var(--faded)}
.lineup{margin:0 16px;padding:14px;transform:rotate(.4deg)}

/* ドック */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);border-top:var(--dash);padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
.dock-inner{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.dock .add{display:flex;align-items:center;gap:4px;min-height:48px;padding:0 16px;background:transparent;border:1.5px solid var(--ink);border-radius:50%;font-family:var(--hand);font-weight:600;font-size:14px;transform:rotate(-2deg);white-space:nowrap}
.dock .main{flex:1;min-height:52px;background:var(--ink);color:var(--desk);border:0;font-weight:700;font-size:14.5px;letter-spacing:.04em}

/* シート */
.sheet{position:fixed;inset:0;z-index:100;background:rgba(64,56,47,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet-inner{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--paper);box-shadow:0 -12px 30px rgba(64,56,47,.25);padding:16px 18px calc(20px + env(safe-area-inset-bottom))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;margin-bottom:14px;border-bottom:var(--dash)}
.sheet-head h2{margin:0;font-family:var(--hand);font-weight:600;font-size:19px}
.close{width:44px;height:44px;border:1.5px solid var(--ink);border-radius:50%;background:transparent;font-size:17px;font-weight:700;transform:rotate(3deg)}
.form{display:flex;flex-direction:column;gap:16px}
.sheet-foot{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));margin:18px -18px calc(-20px - env(safe-area-inset-bottom));padding:12px 18px calc(16px + env(safe-area-inset-bottom));background:var(--paper);border-top:var(--dash);display:flex;flex-direction:column;gap:8px}
.preview{padding:12px;border:var(--dash);background:rgba(255,255,255,.5);font-size:12.5px;line-height:1.7}

<body>

    </div>

</nav>
<main class="wrap" id="app" aria-live="polite"></main>
<div class="foot">MUZE DAY はテスト版です。予定はこの端末（ブラウザ）に保存されます。時間や会場は必ず公式サイトでも確認してね。<br>MAZZEL・BMSG公式とは関係のない非公式ファンメイドツールです。</div>
<div id="dock"></div>
<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></div>
<div id="toast" class="toast hidden" role="status"></div>

<script src="../assets/muze-key.js"></script>
<script src="./events.js"></script>
<script>
(function () {
"use strict";

/* ========== 基本 ========== */
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (m) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]; }); }
function uid() { return "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function toMin(t) { if (!t || !/^\d{1,2}:\d{2}$/.test(t)) return null; var p = t.split(":"); return (+p[0]) * 60 + (+p[1]); }
function fmt(m) { if (m == null) return ""; m = ((m % 1440) + 1440) % 1440; return Math.floor(m / 60) + ":" + ("0" + (m % 60)).slice(-2); }
function dur(m) { m = Math.abs(Math.round(m)); if (m < 60) return m + "分"; var h = Math.floor(m / 60), r = m % 60; return h + "時間" + (r ? r + "分" : ""); }
function todayISO() { var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
function nowMin() { var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
var DOW = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
var DOWJ = ["日", "月", "火", "水", "木", "金", "土"];
function md(iso) { if (!iso) return ""; var p = iso.split("-"); return (+p[1]) + "/" + (+p[2]); }
function dow(iso) { return iso ? DOW[new Date(iso + "T00:00:00").getDay()] : ""; }
function dowj(iso) { return iso ? DOWJ[new Date(iso + "T00:00:00").getDay()] : ""; }
function daysUntil(iso) { var a = new Date(iso + "T00:00:00"), b = new Date(todayISO() + "T00:00:00"); return Math.round((a - b) / 86400000); }
function toast(msg) { var t = $("#toast"); t.textContent = msg; t.classList.remove("hidden"); clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.add("hidden"); }, 2400); }
function copyText(s) {
  if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(s).then(function () { toast("コピーしたよ"); }, function () { prompt("コピーしてね", s); }); }
  else prompt("コピーしてね", s);
}

/* ========== MUZE KEY と保存 ========== */
var HAS_KEY = !!(window.MUZEKey && window.MUZEKey.get);
function key() { try { return HAS_KEY ? window.MUZEKey.get() : "LOCAL"; } catch (e) { return "LOCAL"; } }
function masked() { try { return HAS_KEY ? window.MUZEKey.masked() : "（この端末だけ）"; } catch (e) { return ""; } }
var STORE = "muze_day_v1";
function storeKey() { return STORE + ":" + key(); }
var db = load();
function load() {
  try { var d = JSON.parse(localStorage.getItem(storeKey()) || "null"); if (d && d.days) return d; } catch (e) {}
  return { days: [], current: null };
}
function save() { try { localStorage.setItem(storeKey(), JSON.stringify(db)); } catch (e) { toast("保存できなかったよ（容量やプライベートモードを確認してね）"); } }
function day() { return db.days.filter(function (d) { return d.id === db.current; })[0] || null; }
window.addEventListener("muze-key-changed", function () { db = load(); render(); });

/* ========== 交換約束ログ（読み取り） ========== */
function readLog() {
  try {
    var raw = localStorage.getItem("muze_exchange_log_v1:" + key());
    var rows = JSON.parse(raw || "[]");
    return Array.isArray(rows) ? rows : [];
  } catch (e) { return []; }
}
function itemsText(items) {
  return (items || []).map(function (i) { var who = i.member || i.other || ""; return (who + (i.type ? " " + i.type : "")).trim() || i.detail || ""; }).filter(Boolean).join("・");
}
function logCandidates(date) {
  return readLog().filter(function (r) {
    return (r.method === "手渡し") && r.tradeType !== "買取" && r.status !== "交換完了" && (r.dueDate === date || r.promiseDate === date);
  });
}
function refreshFromLog(d) {
  var rows = readLog(), map = {};
  rows.forEach(function (r) { map[r.id] = r; });
  (d.trades || []).forEach(function (t) {
    var r = t.logId && map[t.logId];
    if (!r) return;
    t.who = r.name || t.who; t.give = itemsText(r.giveItems) || t.give; t.get = itemsText(r.getItems) || t.get; t.logStatus = r.status;
    if (r.status === "交換完了") t.done = true;
  });
}

/* ========== 日の構造 ========== */
function offTime(d, label) { var o = (d.official || []).filter(function (x) { return x.label === label; })[0]; return o ? toMin(o.time) : null; }
function wantedActs(d) { return (d.acts || []).filter(function (a) { return a.want && toMin(a.start) != null; }).sort(function (a, b) { return toMin(a.start) - toMin(b.start); }); }
function bands(d) {
  if (d.kind === "FES") {
    var b = [{ id: "open", label: "開演前", until: offTime(d, "開演") }];
    wantedActs(d).forEach(function (a) { b.push({ id: "after:" + a.id, label: a.artist + "のあと", from: toMin(a.end) }); });
    b.push({ id: "any", label: "どこかで" });
    return b;
  }
  var r = [];
  if (offTime(d, "物販") != null) r.push({ id: "goods", label: "物販前", until: offTime(d, "物販") });
  r.push({ id: "open", label: "開場前", until: offTime(d, "開場") });
  r.push({ id: "after", label: "終演後", from: offTime(d, "終演") });
  r.push({ id: "any", label: "どこかで" });
  return r;
}
function bandLabel(d, id) { var b = bands(d).filter(function (x) { return x.id === id; })[0]; return b ? b.label : "どこかで"; }
function dues(d) {
  if (d.kind === "FES") {
    var r = wantedActs(d).map(function (a) { return { id: "before:" + a.id, label: a.artist + "の前まで", t: toMin(a.start) }; });
    r.push({ id: "day", label: "きょう中", t: 23 * 60 + 59 });
    return r;
  }
  var o = [];
  if (offTime(d, "物販") != null) o.push({ id: "goods", label: "物販前まで", t: offTime(d, "物販") });
  o.push({ id: "open", label: "開場前まで", t: offTime(d, "開場") });
  o.push({ id: "start", label: "開演前まで", t: offTime(d, "開演") });
  o.push({ id: "after", label: "終演後", t: null, after: offTime(d, "終演") });
  o.push({ id: "day", label: "きょう中", t: 23 * 60 + 59 });
  return o;
}
function dueOf(d, id) { return dues(d).filter(function (x) { return x.id === id; })[0] || { id: "day", label: "きょう中", t: 23 * 60 + 59 }; }
function isToday(d) { return d.date === todayISO(); }
function nowInfo(d) {
  if (!isToday(d)) {
    var n = daysUntil(d.date);
    if (n > 0) return { band: "当日まで", right: "あと <b class='en'>" + n + "</b> 日" };
    return { band: "おわった日", right: "おつかれさま！" };
  }
  var t = nowMin(), label, next = null;
  var offs = (d.official || []).map(function (o) { return { label: o.label, t: toMin(o.time) }; }).filter(function (o) { return o.t != null; });
  if (d.kind === "FES") (d.acts || []).forEach(function (a) { if (a.want && toMin(a.start) != null) offs.push({ label: a.artist, t: toMin(a.start) }); });
  offs.sort(function (a, b) { return a.t - b.t; });
  offs.forEach(function (o) { if (next == null && o.t > t) next = o; });
  if (d.kind === "FES") {
    var last = null; wantedActs(d).forEach(function (a) { if (toMin(a.end) <= t) last = a; });
    label = last ? last.artist + " のあと" : "開演前";
  } else {
    var g = offTime(d, "物販"), op = offTime(d, "開場"), st = offTime(d, "開演"), en = offTime(d, "終演");
    if (g != null && t < g) label = "物販前"; else if (op != null && t < op) label = "開場前"; else if (st != null && t < st) label = "開演前";
    else if (en != null ? t < en : (st != null && t < st + 180)) label = "公演中"; else label = "終演後";
  }
  return { band: label, right: next ? "つぎは <b>" + esc(next.label) + " " + fmt(next.t) + "</b> ・ あと <b class='en'>" + dur(next.t - t) + "</b>" : "きょうの公式予定はおわり" };
}

/* ========== 状態 ========== */
var ui = { dd: false, ddFilter: "all", sheet: null, home: false };
var draft = null;
function newDraft() {
  return { presetId: null, kind: "LIVE", date: "", title: "", venue: "", official: [{ label: "物販", time: "" }, { label: "開場", time: "" }, { label: "開演", time: "" }, { label: "終演", time: "" }], lineup: [], wants: {}, imports: {}, custom: false };
}

/* ========== 描画 ========== */
function render() {
  var d = day();
  if (!d || ui.home) { if (!draft) draft = newDraft(); renderStart(); return; }
  refreshFromLog(d);
  renderDay(d);
}

/* ----- 日づくり ----- */
function presets() {
  var t = todayISO();
  return (window.MUZE_DAY_EVENTS || []).filter(function (e) { return e.date >= t; }).sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
}
function presetById(id) { return (window.MUZE_DAY_EVENTS || []).filter(function (e) { return e.id === id; })[0]; }
function presetSub(e) {
  var o = (e.official || []).map(function (x) { return x.label + x.time; }).slice(0, 2).join(" ");
  return e.venue + (o ? " ・ " + o : " ・ 時間は発表待ち");
}
function renderStart() {
  var p = draft.presetId ? presetById(draft.presetId) : null;
  var html = '<div class="start"><div class="sticker"><i class="tape t-berry"></i>MUZE <span>DAY</span></div>' +
    savedDays() +
    '<h1>' + (db.days.length ? "新しい日を<span>つくる</span>" : "きょうは、<span>どんな日？</span>") + '</h1><p class="hint">プルダウンで予定をえらぶと、日付・会場・時間が入るよ。</p>' +
    '<div class="dd"><div class="lbl" id="ddl" style="margin-bottom:8px;font-size:16px">どの予定？</div>' + ddButton(p) + (ui.dd ? ddList() : "") +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><span class="hint">MAZZELのこれからの予定 ' + presets().length + '件</span><button type="button" class="link" data-act="custom">自分で入力する</button></div></div>';
  if (p || draft.custom) html += startForm();
  html += '</div>';
  $("#app").innerHTML = html;
  $("#dock").innerHTML = (p || draft.custom) ? '<div class="startfoot"><button type="button" class="btn dark full" data-act="create">この日をつくる</button></div>' : "";
}
function savedDays() {
  if (!db.days.length) return "";
  var list = db.days.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  return '<div style="margin-top:22px"><div class="lbl" style="font-size:16px;margin-bottom:6px">つくった日</div>' +
    list.map(function (d) {
      var n = daysUntil(d.date), when = n > 0 ? "あと" + n + "日" : n === 0 ? "きょう" : "おわった日";
      return '<button type="button" class="mini" style="margin:6px 0;width:100%;min-height:56px" data-act="open-day" data-id="' + d.id + '"><span class="en" style="width:auto;min-width:48px">' + md(d.date) + '</span><span style="flex:1;min-width:0"><span class="hand" style="display:block;font-size:14px;line-height:1.35">' + esc(d.title) + '</span><span class="hint">' + d.kind + ' ・ ' + esc(d.venue || "") + '</span></span><span class="hint" style="white-space:nowrap">' + when + ' →</span></button>';
    }).join("") + '</div>';
}
function ddButton(p) {
  if (!p) return '<button type="button" class="dd-btn" data-act="dd" aria-expanded="' + ui.dd + '" aria-labelledby="ddl"><span class="hand" style="flex:1;font-size:15px;color:var(--faded)">' + (draft.custom ? "自分で入力中" : "えらんでね") + '</span>' + chev(ui.dd) + '</button>';
  return '<button type="button" class="dd-btn" data-act="dd" aria-expanded="' + ui.dd + '" aria-labelledby="ddl"><i class="tape t-berry"></i>' +
    '<div class="dd-date"><div class="en">' + md(p.date) + '</div><small>' + dow(p.date) + '</small></div>' +
    '<div class="dd-body"><span class="badge ' + p.kind + '">' + esc(p.tag) + '</span><div class="dd-name">' + esc(p.name) + '</div><div class="hint">' + esc(presetSub(p)) + '</div></div>' + chev(ui.dd) + '</button>';
}
function chev(up) { return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;' + (up ? "transform:rotate(180deg)" : "") + '"><path d="M6 9l6 6 6-6"></path></svg>'; }
function ddList() {
  var list = presets().filter(function (e) { return ui.ddFilter === "all" || (ui.ddFilter === "fm" ? e.kind === "LIVE" : e.kind === "FES"); });
  var html = '<div class="dd-list" role="listbox" aria-labelledby="ddl"><div class="dd-filter">' +
    [["all", "ぜんぶ"], ["fm", "ファンミ"], ["fes", "フェス"]].map(function (f) { return '<button type="button" class="chip" data-act="ddf" data-v="' + f[0] + '" aria-pressed="' + (ui.ddFilter === f[0]) + '">' + f[1] + '</button>'; }).join("") + '</div>';
  var month = null;
  list.forEach(function (e) {
    var m = +e.date.split("-")[1];
    if (m !== month) { month = m; var n = list.filter(function (x) { return +x.date.split("-")[1] === m; }).length; html += '<div class="dd-month"><b>' + m + '月</b><span class="hint">' + n + '件</span></div>'; }
    html += '<button type="button" class="dd-row" role="option" data-act="pick" data-id="' + e.id + '" aria-selected="' + (draft.presetId === e.id) + '">' +
      '<div class="d"><div class="en">' + md(e.date) + '</div><small>' + dow(e.date) + '</small></div>' +
      '<div style="flex:1;min-width:0"><div><span class="badge ' + e.kind + '">' + esc(e.tag) + '</span>' + (e.note ? '<span class="dd-note">' + esc(e.note) + '</span>' : "") + '</div><div class="nm">' + esc(e.name) + '</div><div class="sub">' + esc(presetSub(e)) + '</div></div></button>';
  });
  if (!list.length) html += '<div class="empty" style="margin:12px">これからの予定はないみたい。「自分で入力する」から作ってね。</div>';
  return html + '</div>';
}
function startForm() {
  var p = draft.presetId ? presetById(draft.presetId) : null;
  var html = '<div class="form" style="margin-top:24px">';
  if (p) {
    html += '<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:var(--dash);background:rgba(255,255,255,.55)"><span class="en" style="padding:4px 12px;border:2px solid var(--ink);background:var(--paper);letter-spacing:.12em">' + draft.kind + '</span><span class="hint">' + (draft.kind === "LIVE" ? "ファンミ・単独公演は LIVE の形で使うよ（開場・開演・物販）" : "複数アーティストのイベントは FES の形で使うよ（出演時間・ステージ）") + '</span></div>';
  } else {
    html += '<div class="lbl">LIVE と FES、どっち？</div><div class="kinds">' +
      '<button type="button" class="kind" data-act="kind" data-v="LIVE" aria-pressed="' + (draft.kind === "LIVE") + '"><span class="en">LIVE</span><small>物販・開場・開演・終演</small></button>' +
      '<button type="button" class="kind" data-act="kind" data-v="FES" aria-pressed="' + (draft.kind === "FES") + '"><span class="en">FES</span><small>ステージと出演時間</small></button></div>';
  }
  html += '<div class="field"><label for="f-date">日付</label><input id="f-date" type="date" value="' + esc(draft.date) + '" data-draft="date"></div>' +
    '<div class="field"><label for="f-title">名前</label><input id="f-title" type="text" value="' + esc(draft.title) + '" data-draft="title" placeholder="〇〇 LIVE 東京公演"></div>' +
    '<div class="field"><label for="f-venue">会場</label><input id="f-venue" type="text" value="' + esc(draft.venue) + '" data-draft="venue" placeholder="会場名"></div></div>';
  html += '<div class="paper box"><i class="tape t-lav" style="width:54px;height:16px"></i><h3>公式の時間</h3><p class="hint" style="margin:2px 0 4px">' + (draft.kind === "LIVE" ? "ここから「物販前／開場前／終演後」が自動でできるよ。わからないところは空欄でOK" : "わかるものだけでOK。出演時間は日をつくったあとに足せるよ") + '</p>' +
    draft.official.map(function (o, i) { return '<div class="trow"><input type="text" value="' + esc(o.label) + '" data-off-label="' + i + '" aria-label="名前"><input type="time" value="' + esc(o.time) + '" data-off-time="' + i + '" aria-label="' + esc(o.label) + 'の時刻"><button type="button" class="x" data-act="off-del" data-i="' + i + '" aria-label="この行を消す">✕</button></div>'; }).join("") +
    '<button type="button" class="link" data-act="off-add">＋ 行を足す</button></div>';
  if (draft.kind === "FES" && draft.lineup.length) {
    html += '<div class="paper box"><i class="tape t-mint" style="width:54px;height:16px"></i><h3>出演</h3><p class="hint" style="margin:2px 0 8px">見たいアーティストにしるしをつけてね。' + esc((p && p.lineupNote) || "") + '</p><div class="chips">' +
      draft.lineup.map(function (a) { return '<button type="button" class="chip" data-act="want" data-v="' + esc(a) + '" aria-pressed="' + !!draft.wants[a] + '">' + esc(a) + '</button>'; }).join("") + '</div></div>';
  }
  var cands = draft.date ? logCandidates(draft.date) : [];
  html += '<div class="paper box" style="box-shadow:var(--shadow);transform:rotate(-.4deg)"><i class="tape t-lav" style="left:auto;right:24px;width:60px;height:17px;transform:rotate(6deg)"></i><h3>' + keyIcon(18) + '交換約束ログとつなぐ</h3>';
  if (!draft.date) html += '<p class="hint">日付を入れると、その日の手渡し交換をさがすよ。</p>';
  else if (!cands.length) html += '<p class="hint" style="margin-top:4px">' + esc(masked()) + ' の交換約束ログに、' + md(draft.date) + ' の手渡し交換は見つからなかったよ。あとから「交換」をはることもできるよ。</p>';
  else {
    html += '<p class="hint" style="margin:2px 0 6px">' + esc(masked()) + ' で、' + md(draft.date) + ' の<b style="color:var(--ink)">手渡し</b>交換が ' + cands.length + '件 見つかったよ</p>' +
      cands.map(function (r) { var on = draft.imports[r.id] !== false; return '<label class="logrow"><input type="checkbox" data-imp="' + esc(r.id) + '"' + (on ? " checked" : "") + '><span style="flex:1;min-width:0"><span class="hand" style="font-size:15px">' + esc(r.name || "（名前なし）") + '</span><span class="hint" style="display:block">' + esc(itemsText(r.giveItems) || "—") + ' ⇄ ' + esc(itemsText(r.getItems) || "—") + '</span></span><span class="st">' + esc(r.status || "") + '</span></label>'; }).join("") +
      '<p class="hint" style="margin-top:8px">中身はログのまま使うよ。MUZE DAYでは締切・時刻・場所だけを足していく。</p>';
  }
  return html + '</div><div style="height:30px"></div>';
}
function keyIcon(s) { return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="var(--lav-ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><circle cx="8" cy="15" r="4"></circle><path d="M11 12l8-8M16 7l2.5 2.5M14 9l2 2"></path></svg>'; }
function pickPreset(id) {
  var e = presetById(id); if (!e) return;
  draft = newDraft();
  draft.presetId = id; draft.kind = e.kind; draft.date = e.date; draft.title = e.title; draft.venue = e.venue;
  if (e.kind === "LIVE") {
    var base = [{ label: "物販", time: "" }].concat((e.official || []).map(function (o) { return { label: o.label, time: o.time }; }));
    if (!base.some(function (o) { return o.label === "終演"; })) base.push({ label: "終演", time: "" });
    draft.official = base;
  } else {
    draft.official = (e.official || []).map(function (o) { return { label: o.label, time: o.time }; });
    if (!draft.official.length) draft.official = [{ label: "開場", time: "" }, { label: "開演", time: "" }];
  }
  draft.lineup = (e.lineup || []).slice();
  draft.wants = {}; if (draft.lineup.indexOf("MAZZEL") >= 0) draft.wants.MAZZEL = true;
  ui.dd = false;
}
function createDay() {
  if (!draft.date) { toast("日付を入れてね"); return; }
  var d = {
    id: uid(), presetId: draft.presetId, kind: draft.kind, date: draft.date, title: draft.title || (draft.kind + " DAY"), venue: draft.venue,
    official: draft.official.filter(function (o) { return o.label && o.time; }).map(function (o) { return { id: uid(), label: o.label, time: o.time }; }),
    acts: [], trades: [], meets: [], checklist: defaultChecklist(), view: "meet", myMark: ""
  };
  if (d.kind === "FES") {
    draft.lineup.forEach(function (a) { d.acts.push({ id: uid(), artist: a, stage: "", start: "", end: "", want: !!draft.wants[a] }); });
  }
  logCandidates(d.date).forEach(function (r) {
    if (draft.imports[r.id] === false) return;
    d.trades.push({ id: uid(), logId: r.id, who: r.name || "", give: itemsText(r.giveItems), get: itemsText(r.getItems), priority: r.status === "約束済" ? "must" : "maybe", due: d.kind === "FES" ? "day" : "open", place: "", time: "", dur: 10, travel: 0, done: false, logStatus: r.status });
  });
  db.days.unshift(d); db.days = db.days.slice(0, 10); draft = null; openDay(d.id);
  toast("この日をつくったよ");
}
function defaultChecklist() {
  return ["電子チケット（スクショも）", "本人確認書類", "うちわ・ペンライト・電池", "モバイルバッテリー", "小銭・交通系IC"].map(function (t) { return { id: uid(), text: t, done: false }; });
}

/* ----- 日のページ ----- */
function renderDay(d) {
  var tradesOpen = d.trades.filter(function (t) { return !t.done; }).length;
  var meetsOpen = d.meets.filter(function (m) { return !m.done; }).length;
  var evSub = d.kind === "FES" ? "見たい " + d.acts.filter(function (a) { return a.want; }).length + "組" : ((d.official || []).filter(function (o) { return o.label === "開場" || o.label === "開演"; }).map(function (o) { return o.label + o.time; }).join("・") || "公式の時間");
  var html = '<div style="padding:10px 16px 0"><button type="button" class="link" style="padding:6px 0;font-size:13px" data-act="home">← 最初の画面（ほかの日・新しい日）</button></div>' +
    '<div class="dayhead"><button type="button" class="sticker" style="border:0;cursor:pointer" data-act="home" aria-label="最初の画面へ"><i class="tape t-berry"></i>MUZE <span>DAY</span></button><div class="right"><span class="kindtag ' + (d.kind === "FES" ? "c-mint" : "c-lav") + '">' + d.kind + ' DAY</span><div class="bigdate">' + md(d.date) + '<small>' + dow(d.date) + '</small></div></div></div>' +
    '<div class="daytitle"><button type="button" data-act="daymenu"><div class="t">' + esc(d.title) + '</div><div class="hint">' + esc(d.venue || "") + ' ・ 編集</div></button></div>' +
    '<div class="vtabs" role="tablist"><button type="button" role="tab" class="vtab ' + (d.kind === "FES" ? "fes" : "ev") + '" data-act="view" data-v="event" aria-selected="' + (d.view === "event") + '"><span class="l en" style="letter-spacing:.1em">' + d.kind + 'の予定</span><span class="s">' + esc(evSub) + '</span></button>' +
    '<button type="button" role="tab" class="vtab mt" data-act="view" data-v="meet" aria-selected="' + (d.view === "meet") + '"><span class="l hand">ミーグリの予定</span><span class="s">交換' + tradesOpen + '・会えたら' + meetsOpen + '</span></button></div><div class="swipehint">左右にスワイプでも切りかえ</div>';
  html += d.view === "meet" ? meetView(d) : (d.kind === "FES" ? fesView(d) : liveView(d));
  $("#app").innerHTML = html;
  var dockLeft = '<button type="button" class="add" data-act="add">＋ 予定をはる</button>';
  $("#dock").innerHTML = '<div class="dock"><div class="dock-inner">' + dockLeft + '<button type="button" class="main" data-act="share">しおり画像をつくる</button></div></div>';
}

function nowBar(d) { var n = nowInfo(d); return '<div class="now"><span class="tag">NOW</span><span class="b">' + esc(n.band) + '</span><span class="r">' + n.right + '</span></div>'; }

function meetView(d) {
  var html = nowBar(d);
  var open = d.trades.filter(function (t) { return !t.done; }).sort(tradeSort(d));
  var done = d.trades.filter(function (t) { return t.done; });
  html += '<div class="sec"><h2>わすれちゃだめな交換 <span class="n">' + open.length + '</span></h2><p>時間が決まってなくても大丈夫。締切だけ見ておこう</p></div>';
  if (HAS_KEY) html += '<button type="button" class="summary" style="margin:0 16px 12px;background:rgba(239,229,255,.7);box-shadow:none;transform:none" data-act="key">' + keyIcon(14) + '<span><b class="hand">交換約束ログ</b>とつながってるよ</span><span class="go en" style="font-size:10.5px">' + esc(masked()) + '</span></button>';
  if (!open.length) html += '<div class="empty">この日の交換はまだないよ。「＋ 予定をはる」から交換を足してね。</div>';
  html += open.map(function (t) { return tradeCard(d, t); }).join("");
  if (done.length) html += '<div class="donebar">交換済み ' + done.length + ' ・ ' + done.map(function (t) { return esc(t.who); }).join("、") + '</div>';

  var mopen = d.meets.filter(function (m) { return !m.time && !m.done; });
  html += '<div class="sec"><h2>会えたらMUZE <span class="n">' + mopen.length + '</span></h2><p>時間未定のままでOK。DMで決まったら「決まった」で流れにはれるよ</p></div><div class="bands">';
  if (!mopen.length) html += '<div class="empty" style="margin:0">会えたらうれしい人を、時間帯だけでゆるく入れておこう。</div>';
  bands(d).forEach(function (b) {
    var ms = mopen.filter(function (m) { return (m.band || "any") === b.id; });
    if (!ms.length) return;
    html += '<div class="bandh"><b>' + esc(b.label) + '</b><span>' + (b.until != null ? "〜" + fmt(b.until) : b.from != null ? fmt(b.from) + "〜" : "いつでも") + '</span></div>' +
      ms.map(function (m) { return '<div class="loose"><button type="button" class="body" data-act="edit-meet" data-id="' + m.id + '"><span class="nm">' + esc(m.who) + '</span>' + stamp(m.purpose) + '<span class="memo">' + esc([m.mark ? "目印：" + m.mark : "", m.memo].filter(Boolean).join(" ・ ") || "タップで編集") + '</span></button><button type="button" class="go" data-act="fix" data-k="meet" data-id="' + m.id + '">決まった</button></div>'; }).join("");
  });
  html += '</div>';
  html += '<div class="flowhead"><b>会う予定の流れ</b><span>時間が決まった予定だけ</span></div>' + flow(d, "meet");
  return html + '<div style="height:20px"></div>';
}
function stamp(p) {
  var c = { "はじめまして": "berry", "写真": "berry", "交換": "mint", "物販": "lav", "ごはん": "butter", "おしゃべり": "butter" }[p] || "berry";
  return p ? '<span class="stamp c-' + c + '">' + esc(p) + '</span>' : "";
}
function tradeSort(d) { return function (a, b) { var ta = a.time ? toMin(a.time) : (dueOf(d, a.due).t || 9999), tb = b.time ? toMin(b.time) : (dueOf(d, b.due).t || 9999); if (a.priority !== b.priority) return a.priority === "must" ? -1 : 1; return ta - tb; }; }
function tradeCard(d, t) {
  var du = dueOf(d, t.due), cd = "";
  if (du.t != null && du.id !== "day" && isToday(d)) { var left = du.t - nowMin(); cd = left > 0 ? "あと " + dur(left) : "締切をすぎたよ"; }
  else if (du.t != null && du.id !== "day") cd = fmt(du.t) + " まで";
  else if (du.after != null) cd = fmt(du.after) + "〜";
  var status = t.time ? '<div class="fixed"><span aria-hidden="true">✓</span><span class="en">' + esc(t.time) + '</span><b>' + esc(t.place || "") + '</b><span class="hand" style="margin-left:auto;font-size:11.5px;color:var(--mint-ink)">流れにはったよ</span></div>'
    : '<div class="undecided"><span class="hand faded">時間 未定</span>' + (t.place ? " ・ " + esc(t.place) : "") + '</div><button type="button" class="btn oval" style="min-height:44px;padding:0 13px;font-size:13px;white-space:nowrap" data-act="fix" data-k="trade" data-id="' + t.id + '">時間が決まった</button>';

    if (left2 <= 0) nudge = '<div class="nudge">' + esc(du.label.replace("まで", "")) + 'は会えなかったね。' + (d.kind === "LIVE" ? "終演後にする？" : "きょう中にする？") + '<div class="chips"><button type="button" class="chip" data-act="later" data-id="' + t.id + '">' + (d.kind === "LIVE" ? "終演後にする" : "きょう中にする") + '</button><button type="button" class="chip" data-act="trade-done" data-id="' + t.id + '">交換できた</button></div></div>';
  }

    '<div class="swap"><div><div class="k">わたしが渡す</div><div class="v">' + esc(t.give || "—") + '</div></div><div style="text-align:center;color:var(--mint-ink)">⇄</div><div><div class="k">もらう</div><div class="v">' + esc(t.get || "—") + '</div></div></div>' +

}

/* 流れ（固定の予定＋公式＋締切の旗） */
function flow(d, mode) {
  var items = [];
  (d.official || []).forEach(function (o) { var m = toMin(o.time); if (m != null) items.push({ type: "off", t: m, o: o }); });
  if (d.kind === "FES") (d.acts || []).forEach(function (a) { if (a.want && toMin(a.start) != null) items.push({ type: "act", t: toMin(a.start), a: a }); });
  d.trades.forEach(function (t) {
    if (t.time) items.push({ type: "trade", t: toMin(t.time), x: t });
    else if (!t.done) { var du = dueOf(d, t.due); if (du.t != null && du.id !== "day") items.push({ type: "flag", t: du.t - 0.5, x: t, du: du }); }
  });
  d.meets.forEach(function (m) { if (m.time) items.push({ type: "meet", t: toMin(m.time), x: m }); });
  items.sort(function (a, b) { return a.t - b.t; });
  var personal = items.filter(function (i) { return i.type === "trade" || i.type === "meet"; });
  if (!items.length) return '<div class="empty">時間が決まった予定や公式の時間が、ここに並ぶよ。</div>';
  var html = "", prev = null;
  items.forEach(function (i) {
    if (i.type === "trade" || i.type === "meet") {
      if (prev) html += gapLabel(prev, i);
      prev = i;
    }
    if (i.type === "off") html += '<button type="button" class="off' + (mode === "meet" ? " faint" : "") + '" data-act="edit-off" data-id="' + i.o.id + '"><span class="en">' + esc(i.o.time) + '</span><span class="hand">' + esc(i.o.label) + '</span></button>';
    else if (i.type === "act") html += '<div class="off act"><span class="en">' + esc(i.a.start) + '</span><span class="hand">' + esc(i.a.artist) + '</span><span class="sub">' + esc(i.a.stage || "") + '</span></div>';
    else if (i.type === "flag") html += '<div class="flag"><b>ここまでに：' + esc(i.x.who) + 'と交換</b><span>時間はまだ。決まったら上のカードから</span></div>';
    else if (mode === "meet") html += ticketHtml(i);
    else html += '<button type="button" class="mini" data-act="detail" data-k="' + i.type + '" data-id="' + i.x.id + '"><span class="en">' + esc(i.x.time) + '</span><span class="hand">' + esc(i.x.who) + '</span>' + stamp(i.type === "trade" ? "交換" : i.x.purpose) + '<span class="hint" style="margin-left:auto">' + esc(i.x.place || "") + '</span></button>';
  });
  return html;
}
function ticketHtml(i) {
  var x = i.x, isT = i.type === "trade", end = toMin(x.time) + (+x.dur || 0);
  return '<button type="button" class="ticket' + (x.done ? " done" : "") + '" data-act="detail" data-k="' + i.type + '" data-id="' + x.id + '"><i class="tape ' + (isT ? "t-mint" : "t-berry") + '"></i><div class="stub"><div class="en">' + esc(x.time) + '</div>' + (x.dur ? '<div class="e">〜' + fmt(end) + '</div>' : "") + '</div>' +
    '<div class="main"><div><span class="nm">' + esc(x.who) + '</span>' + stamp(isT ? "交換" : x.purpose) + '</div>' +
    (isT ? '<div class="hint">' + esc(x.give || "") + ' ⇄ ' + esc(x.get || "") + '</div>' : "") +
    '<div class="pl" style="display:flex;gap:5px;align-items:flex-start">' + PIN + '<span>' + esc(x.place || "場所未定") + '</span>' + '</div>' + (x.mark ? '<div class="mk">目印：' + esc(x.mark) + '</div>' : "") + '</div>' + (x.done ? '<span class="donestamp">' + (isT ? "交換できた" : "会えた") + '</span>' : "") + '</button>';
}
function gapLabel(a, b) {
  var aEnd = a.t + (+a.x.dur || 0), gap = b.t - aEnd, tr = +b.x.travel || 0, cls = "ok", main, sub = "";
  if (gap < 0) { cls = "short"; main = "2つの予定が " + dur(-gap) + " かさなってるよ"; sub = "どっちかを少しずらせば、どっちにも会えるよ"; }
  else if (tr && gap < tr) { cls = "short"; main = "移動が " + dur(tr - gap) + " たりないかも"; sub = "移動" + tr + "分・余白は" + dur(gap) + "。" + fmt(aEnd + tr) + "集合にすると安心だよ"; }
  else if (tr && gap - tr <= 5) { cls = "tight"; main = "移動ちょっと急ぎめ " + dur(gap); sub = "移動" + tr + "分。前の予定を少し早めに切り上げると安心"; }
  else if (gap >= 30) { cls = "calm"; main = "のんびり " + dur(gap); }
  else { main = dur(gap) + " ・ ちょうどいい"; }
  return '<div class="gap"><div class="line"></div><div><span class="pill ' + cls + '">' + esc(main) + '</span>' + (sub ? '<div class="sub">' + esc(sub) + '</div>' : "") + '</div></div>';
}

function liveView(d) {

  var body = '<div class="paper" style="background:var(--desk);padding:18px 16px 14px;transform:rotate(-.5deg);box-shadow:none"><i class="tape t-lav" style="top:-9px;left:22px;width:64px;height:18px"></i><div class="en" style="font-size:10.5px;letter-spacing:.2em;color:var(--lav-ink)">YOUR MUZE KEY</div><div class="en" style="font-size:22px;letter-spacing:.08em">' + esc(masked()) + '</div><div class="hint">この端末のKEY ・ 交換約束ログと共通</div></div>' +
    '<div style="margin-top:16px"><div class="lbl">つながっているもの</div><div class="logrow"><span style="flex:1"><b class="hand">交換約束ログ</b><span class="hint" style="display:block">この日の手渡し ' + n + '件を表示中（開くたびにログから読み直すよ）</span></span></div>' +
    '<div class="logrow"><span style="flex:1"><b class="hand">MUZE DAYの予定</b><span class="hint" style="display:block">この端末に保存（テスト版）。KEYで別の端末へ移すのは次の版で</span></span></div></div>' +
    '<p style="margin-top:14px;padding:12px 14px;background:rgba(226,122,148,.12);font-size:12px;line-height:1.7"><b class="hand">KEYは人に教えないでね。</b><br>しおり画像にもKEYは入らないよ。KEYの入力や発行は交換約束ログの画面からできるよ。</p>';
  openSheet("MUZE KEY", body, '<a class="btn full" style="text-align:center;text-decoration:none;display:block;line-height:26px" href="../exchange-log/">交換約束ログをひらく</a><a class="link" style="text-align:center" href="../muze-key/">MUZE KEYについて</a>');
}
function sheetDayMenu() {
  var d = day(); ui.sheet = { type: "daymenu" };
  var others = db.days.filter(function (x) { return x.id !== d.id; });
  var body = '<div class="form">' + fld("dm-title", "名前", d.title) + fld("dm-venue", "会場", d.venue) + fld("dm-date", "日付", d.date, "", "date") + fld("dm-mark", "わたしの目印（しおり・DMに入るよ）", d.myMark, "白いキャップ") +
    '<div><div class="lbl" style="margin-bottom:6px">公式の時間</div>' + (d.official || []).map(function (o) { return '<button type="button" class="off" style="margin:4px 0;width:100%" data-act="edit-off" data-id="' + o.id + '"><span class="en">' + esc(o.time) + '</span><span class="hand">' + esc(o.label) + '</span><span class="sub">編集</span></button>'; }).join("") + '</div>' +
    (others.length ? '<div><div class="lbl" style="margin-bottom:6px">ほかの日</div>' + others.map(function (o) { return '<button type="button" class="mini" style="margin:4px 0;width:100%" data-act="switch-day" data-id="' + o.id + '"><span class="en">' + md(o.date) + '</span><span class="hand">' + esc(o.title) + '</span></button>'; }).join("") + '</div>' : "") + '</div>';
  openSheet("この日のこと", body, '<button type="button" class="btn dark full" data-act="save-daymenu">保存する</button><button type="button" class="btn full" data-act="new-day">新しい日をつくる</button><button type="button" class="link" data-act="del-day">この日を消す</button>');
}

/* ========== しおり画像 ========== */
function sheetShare() {
  var d = day(); ui.sheet = { type: "share", initials: ui.initials || false };
  openSheet("しおり画像", '<p class="hint" style="margin:0 0 10px">1日ぶんの流れを、同行MUZEや会う人に送れる画像にするよ。KEYは入らないよ。</p><div class="chips" style="margin-bottom:12px">' + chipGroup("ini", [{ id: "0", label: "名前そのまま" }, { id: "1", label: "イニシャルにする" }], ui.initials ? "1" : "0") + '</div><img id="share-img" class="shareimg" alt="しおり画像のプレビュー">',
    '<button type="button" class="btn dark full" data-act="save-img">画像を保存する</button><p class="hint" style="text-align:center;margin:0">保存できないときは、画像を<b>長押し</b>して「写真に保存」してね</p>');
  drawShare(d).then(function (url) { var i = $("#share-img"); if (i) i.src = url; });
}
function nm(s) { if (!ui.initials) return s; return String(s || "").split(/[・、,\s]+/).map(function (w) { return w ? w.charAt(0).toUpperCase() + "." : ""; }).join(""); }
function drawShare(d) {
  var W = 1080, H = 1920, c = document.createElement("canvas"); c.width = W; c.height = H; var x = c.getContext("2d");
  var HAND = '"Klee One","Zen Kaku Gothic New",sans-serif', GOTH = '"Zen Kaku Gothic New",sans-serif', EN = '"Montserrat",sans-serif', SERIF = '"DM Serif Display",serif';
  return (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function () {
    x.fillStyle = "#f1ebe1"; x.fillRect(0, 0, W, H);
    x.fillStyle = "rgba(64,56,47,.06)"; for (var gx = 0; gx < W; gx += 44) for (var gy = 0; gy < H; gy += 44) { x.beginPath(); x.arc(gx, gy, 2, 0, 7); x.fill(); }
    x.save(); x.translate(W / 2, H / 2); x.rotate(-0.012); x.translate(-W / 2, -H / 2);
    x.shadowColor = "rgba(64,56,47,.2)"; x.shadowBlur = 40; x.shadowOffsetY = 18; x.fillStyle = "#fff"; x.fillRect(64, 96, W - 128, H - 200); x.shadowColor = "transparent";
    function tape(tx, ty, w, h, col, r) { x.save(); x.translate(tx, ty); x.rotate(r); x.fillStyle = col; x.fillRect(-w / 2, -h / 2, w, h); x.restore(); }
    tape(220, 100, 170, 44, "rgba(226,122,148,.85)", -0.12); tape(W - 230, 102, 140, 40, "rgba(164,197,175,.85)", 0.09);
    var L = 130, y = 250;
    x.fillStyle = "#40382f"; x.font = "84px " + SERIF; x.fillText("MUZE DAY", L, y);
    y += 70; x.font = "700 42px " + EN; x.fillText(d.date.replace(/-/g, "."), L, y); var dw = x.measureText(d.date.replace(/-/g, ".")).width;
    x.font = "600 24px " + EN; x.fillStyle = "#6f6456"; x.fillText(dow(d.date), L + dw + 16, y);
    y += 56; x.fillStyle = "#40382f"; x.font = "600 32px " + HAND; wrap(d.title, L, y, W - 2 * L, 44); y += (lines(d.title, W - 2 * L) * 44);
    x.font = "500 26px " + GOTH; x.fillStyle = "#6f6456"; x.fillText(d.venue || "", L, y + 4); y += 60;
    var chipsA = d.kind === "FES" ? wantedActs(d).map(function (a) { return a.artist + " " + a.start; }) : (d.official || []).map(function (o) { return o.label + " " + o.time; });
    var cx = L; x.font = "600 26px " + HAND;
    chipsA.slice(0, 6).forEach(function (t) { var w = x.measureText(t).width + 36; if (cx + w > W - L) { cx = L; y += 58; } x.fillStyle = d.kind === "FES" ? "rgba(164,197,175,.35)" : "#efe5ff"; x.fillRect(cx, y - 34, w, 48); x.fillStyle = "#40382f"; x.fillText(t, cx + 18, y); cx += w + 14; });
    y += 80;
    function head(t) { x.fillStyle = "#40382f"; x.font = "600 34px " + HAND; x.fillText(t, L, y); y += 18; x.setLineDash([10, 8]); x.strokeStyle = "rgba(64,56,47,.35)"; x.lineWidth = 3; x.beginPath(); x.moveTo(L, y); x.lineTo(W - L, y); x.stroke(); x.setLineDash([]); y += 50; }
    var trades = d.trades.filter(function (t) { return !t.done; });
    if (trades.length) { head("きょうの交換"); trades.slice(0, 5).forEach(function (t) { x.font = "600 30px " + HAND; x.fillStyle = "#40382f"; x.fillText(nm(t.who), L, y); x.font = "500 25px " + GOTH; x.fillStyle = "#6f6456"; x.fillText(clip(t.give + " ⇄ " + t.get, 470, x), L + 240, y); x.font = "700 26px " + (t.time ? EN : HAND); x.fillStyle = "#40382f"; var r = t.time || dueOf(d, t.due).label; x.fillText(r, W - L - x.measureText(r).width, y); y += 56; }); y += 20; }
    var fixed = d.meets.filter(function (m) { return m.time; }).sort(function (a, b) { return toMin(a.time) - toMin(b.time); });
    var loose = d.meets.filter(function (m) { return !m.time && !m.done; });
    if (fixed.length || loose.length) {
      head("会えたらうれしいMUZE");
      fixed.slice(0, 5).forEach(function (m) { x.font = "700 28px " + EN; x.fillStyle = "#40382f"; x.fillText(m.time, L, y); x.font = "600 30px " + HAND; x.fillText(nm(m.who), L + 120, y); x.font = "500 24px " + GOTH; x.fillStyle = "#6f6456"; x.fillText(clip(m.place || "", 420, x), L + 400, y); y += 54; });
      bands(d).forEach(function (b) { var ms = loose.filter(function (m) { return (m.band || "any") === b.id; }); if (!ms.length || y > H - 330) return; x.font = "600 26px " + HAND; x.fillStyle = "#6f6456"; x.fillText(clip(b.label, 220, x), L, y); x.fillStyle = "#40382f"; x.font = "600 28px " + HAND; x.fillText(clip(ms.map(function (m) { return nm(m.who); }).join("・"), 560, x), L + 240, y); y += 52; });
      y += 20;
    }
    if (d.myMark && y < H - 300) { x.fillStyle = "#f1ebe1"; x.fillRect(L, y - 10, W - 2 * L, 90); x.fillStyle = "#40382f"; x.font = "600 26px " + HAND; x.fillText("わたしの目印", L + 24, y + 30); x.font = "500 26px " + GOTH; x.fillText(clip(d.myMark, 560, x), L + 230, y + 30); y += 120; }
    x.font = "600 32px " + HAND; x.fillStyle = "#40382f"; x.fillText("見かけたら声かけてね！", L, Math.min(y + 20, H - 200));
    x.font = "600 20px " + EN; x.fillStyle = "#6f6456"; var f = "MUZE TOOL BOX ♡"; x.fillText(f, W - L - x.measureText(f).width, H - 150);
    x.restore();
    return c.toDataURL("image/png");
    function lines(t, w) { x.font = "600 32px " + HAND; var n = 1, cur = ""; String(t).split("").forEach(function (ch) { if (x.measureText(cur + ch).width > w) { n++; cur = ch; } else cur += ch; }); return n; }
    function wrap(t, px, py, w, lh) { var cur = ""; String(t).split("").forEach(function (ch) { if (x.measureText(cur + ch).width > w) { x.fillText(cur, px, py); py += lh; cur = ch; } else cur += ch; }); x.fillText(cur, px, py); }
  });
}
function clip(t, w, x) { t = String(t || ""); if (x.measureText(t).width <= w) return t; while (t.length && x.measureText(t + "…").width > w) t = t.slice(0, -1); return t + "…"; }
function saveImg() {
  var img = $("#share-img"); if (!img || !img.src) return;
  var a = document.createElement("a"); a.href = img.src; a.download = "muze-day-" + (day().date || "") + ".png";
  document.body.appendChild(a); a.click(); a.remove(); toast("保存できないときは画像を長押ししてね");
}

/* ========== イベント ========== */
document.addEventListener("click", function (e) {
  var chipEl = e.target.closest("[data-chip]");
  if (chipEl) {
    var g = chipEl.getAttribute("data-chip");
    $$('#sheet [data-chip="' + g + '"]').forEach(function (b) { b.setAttribute("aria-pressed", String(b === chipEl)); });
    if (g === "travel") updateFixPreview();
    if (g === "ini") { ui.initials = chipEl.getAttribute("data-v") === "1"; drawShare(day()).then(function (u) { var i = $("#share-img"); if (i) i.src = u; }); }
    if (g === "offl") { var ol = $("#o-label"); if (ol) ol.value = ""; }
    return;
  }
  var el = e.target.closest("[data-act]"); if (!el) return;
  var act = el.getAttribute("data-act"), id = el.getAttribute("data-id"), k = el.getAttribute("data-k"), v = el.getAttribute("data-v"), d = day();
  switch (act) {
    case "dd": ui.dd = !ui.dd; renderStart(); break;
    case "ddf": ui.ddFilter = v; renderStart(); break;
    case "pick": pickPreset(id); renderStart(); break;
    case "custom": draft = newDraft(); draft.custom = true; ui.dd = false; renderStart(); break;
    case "kind": draft.kind = v; if (v === "FES") draft.official = [{ label: "開場", time: "" }, { label: "開演", time: "" }]; else draft.official = newDraft().official; renderStart(); break;
    case "off-add": draft.official.push({ label: "", time: "" }); renderStart(); break;
    case "off-del": draft.official.splice(+el.getAttribute("data-i"), 1); renderStart(); break;
    case "want": draft.wants[v] = !draft.wants[v]; el.setAttribute("aria-pressed", String(!!draft.wants[v])); break;
    case "create": createDay(); break;
    case "home": goHome(); break;
    case "open-day": openDay(id); break;
    case "view": d.view = v; save(); renderDay(d); break;
    case "add": sheetAdd("trade"); break;
    case "add-kind": sheetAdd(v); break;
    case "close": closeSheet(); break;
    case "edit-trade": closeSheet(); sheetTrade(findItem("trade", id)); break;
    case "edit-meet": sheetMeet(findItem("meet", id)); break;
    case "edit-off": closeSheet(); sheetOff((d.official || []).filter(function (o) { return o.id === id; })[0]); break;
    case "edit-act": sheetAct((d.acts || []).filter(function (a) { return a.id === id; })[0]); break;
    case "stage-fill": $("#a-stage").value = v; break;
    case "fix": closeSheet(); sheetFix(k, id); break;
    case "detail": sheetDetail(k, id); break;
    case "key": sheetKey(); break;
    case "daymenu": sheetDayMenu(); break;
    case "share": sheetShare(); break;
    case "save-img": saveImg(); break;
    case "dm": var mm = $("#my-mark"); if (mm) { d.myMark = mm.value.trim(); save(); } copyText(dmText(k, id)); break;
    case "dm-trade": copyText((d.myMark ? d.myMark + "が目印です。" : "") + "交換、何時ごろどこにしましょう？"); break;
    case "later": var tl = findItem("trade", id); tl.due = d.kind === "LIVE" ? "after" : "day"; save(); render(); toast("締切をのばしたよ"); break;
    case "trade-done": var td = findItem("trade", id); td.done = !td.done; save(); closeSheet(); render(); toast(td.done ? "交換できた！" + (td.logId ? "（ログのステータスは交換約束ログで更新してね）" : "") : "まだにもどしたよ"); break;
    case "meet-done": var md2 = findItem("meet", id); md2.done = !md2.done; save(); closeSheet(); render(); toast(md2.done ? "会えた！" : "まだにもどしたよ"); break;
    case "unfix": var uf = findItem(k, id); uf.time = ""; save(); closeSheet(); render(); break;
    case "del":
      if (!confirm("消していい？")) return;
      if (k === "trade") d.trades = d.trades.filter(function (x) { return x.id !== id; });
      if (k === "meet") d.meets = d.meets.filter(function (x) { return x.id !== id; });
      if (k === "off") d.official = d.official.filter(function (x) { return x.id !== id; });
      if (k === "act") d.acts = d.acts.filter(function (x) { return x.id !== id; });
      save(); closeSheet(); render(); break;
    case "save-trade": saveTrade(); break;
    case "save-meet": saveMeet(); break;
    case "save-off": saveOff(); break;
    case "save-act": saveAct(); break;
    case "save-fix": saveFix(); break;
    case "save-daymenu": d.title = val("dm-title") || d.title; d.venue = val("dm-venue"); d.date = val("dm-date") || d.date; d.myMark = val("dm-mark"); save(); closeSheet(); render(); break;
    case "switch-day": closeSheet(); openDay(id); break;
    case "new-day": closeSheet(); goHome(); break;
    case "del-day": if (!confirm("この日をまるごと消していい？（交換約束ログは消えないよ）")) return; db.days = db.days.filter(function (x) { return x.id !== d.id; }); db.current = db.days[0] ? db.days[0].id : null; save(); goHome(); break;
    case "ck-add": var inp = $("#ck-new"); if (inp && inp.value.trim()) { d.checklist.push({ id: uid(), text: inp.value.trim(), done: false }); save(); renderDay(d); } break;
    case "ck-del": e.preventDefault(); d.checklist = d.checklist.filter(function (c) { return c.id !== id; }); save(); renderDay(d); break;
  }
});
document.addEventListener("change", function (e) {
  var t = e.target, d = day();
  if (t.hasAttribute("data-draft")) { draft[t.getAttribute("data-draft")] = t.value; if (t.getAttribute("data-draft") === "date") renderStart(); return; }
  if (t.hasAttribute("data-off-label")) { draft.official[+t.getAttribute("data-off-label")].label = t.value; return; }
  if (t.hasAttribute("data-off-time")) { draft.official[+t.getAttribute("data-off-time")].time = t.value; return; }
  if (t.hasAttribute("data-imp")) { draft.imports[t.getAttribute("data-imp")] = t.checked; return; }
  if (t.hasAttribute("data-ck")) { var c = d.checklist.filter(function (x) { return x.id === t.getAttribute("data-ck"); })[0]; c.done = t.checked; save(); renderDay(d); return; }
  if (t.hasAttribute("data-pack")) { var p = findItem("trade", t.getAttribute("data-pack")); p.packed = t.checked; save(); renderDay(d); return; }
});
document.addEventListener("input", function (e) { if (e.target.id === "x-time" || e.target.id === "x-dur" || e.target.id === "x-place") updateFixPreview(); if (e.target.hasAttribute && e.target.hasAttribute("data-draft")) draft[e.target.getAttribute("data-draft")] = e.target.value; });
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("#sheet").classList.contains("hidden")) closeSheet(); if (e.key === "Enter" && e.target.id === "ck-new") { e.preventDefault(); $('[data-act="ck-add"]').click(); } });
$("#sheet").addEventListener("click", function (e) { if (e.target.id === "sheet") closeSheet(); });

function saveTrade() {
  var d = day(), s = ui.sheet, t = s.id ? findItem("trade", s.id) : null;
  if (!t) { if (!val("t-who")) { toast("だれと交換するか入れてね"); return; } t = { id: uid(), time: "", dur: 10, travel: 0, done: false }; d.trades.push(t); }
  if (!t.logId) { t.who = val("t-who") || t.who; t.give = val("t-give"); t.get = val("t-get"); }
  t.priority = chipVal("prio") || "must"; t.due = chipVal("due") || "day"; t.place = val("t-place");
  save(); closeSheet(); d.view = "meet"; render(); toast("交換をはったよ");
}
function saveMeet() {
  var d = day(), s = ui.sheet, m = s.id ? findItem("meet", s.id) : null;
  if (!m) { if (!val("m-who")) { toast("だれと会いたいか入れてね"); return; } m = { id: uid(), time: "", place: "", dur: 30, travel: 0, done: false }; d.meets.push(m); }
  m.who = val("m-who") || m.who; m.purpose = chipVal("purpose"); m.band = chipVal("band") || "any"; m.mark = val("m-mark"); m.memo = val("m-memo");
  save(); closeSheet(); d.view = "meet"; render(); toast("会えたらMUZEにいれたよ");
}
function saveOff() {
  var d = day(), s = ui.sheet, label = val("o-label") || chipVal("offl"), time = val("o-time");
  if (!label || !time) { toast("名前と時刻を入れてね"); return; }
  var o = s.id ? d.official.filter(function (x) { return x.id === s.id; })[0] : null;
  if (!o) { o = { id: uid() }; d.official.push(o); }
  o.label = label; o.time = time; save(); closeSheet(); render();
}
function saveAct() {
  var d = day(), s = ui.sheet, a = s.id ? d.acts.filter(function (x) { return x.id === s.id; })[0] : null;
  if (!val("a-artist")) { toast("アーティスト名を入れてね"); return; }
  if (!a) { a = { id: uid() }; d.acts.push(a); }
  a.artist = val("a-artist"); a.stage = val("a-stage"); a.start = val("a-start"); a.end = val("a-end"); a.want = chipVal("want") === "1";
  save(); closeSheet(); d.view = "event"; render();
}
function saveFix() {
  var s = ui.sheet, x = findItem(s.k, s.id); if (!x) return;
  if (!val("x-time")) { toast("時刻を入れてね"); return; }
  x.time = val("x-time"); x.dur = +val("x-dur") || 0; x.place = val("x-place"); x.mark = val("x-mark"); x.travel = +chipVal("travel") || 0;
  save(); closeSheet(); var d = day(); d.view = "meet"; render(); toast("流れにはったよ");
}

/* 画面の行き来（ブラウザの「戻る」でも最初の画面へ） */
function openDay(id) {
  db.current = id; ui.home = false; draft = null; save(); render(); window.scrollTo(0, 0);
  try { history.pushState({ muzeDay: "day" }, ""); } catch (e) {}
}
function goHome() {
  ui.home = true; ui.dd = false; draft = newDraft(); closeSheet(); render(); window.scrollTo(0, 0);
}
window.addEventListener("popstate", function () {
  if (!$("#sheet").classList.contains("hidden")) { closeSheet(); return; }
  if (day() && !ui.home) goHome();
});

/* スワイプで切りかえ */
var sx = null, sy = null;
$("#app").addEventListener("touchstart", function (e) { var t = e.touches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
$("#app").addEventListener("touchend", function (e) {
  if (sx == null) return; var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy; sx = null;
  var d = day(); if (!d || Math.abs(dx) < 70 || Math.abs(dy) > 50) return;
  if (e.target.closest(".dd-list,input,textarea")) return;
  d.view = dx < 0 ? "meet" : "event"; save(); renderDay(d);
}, { passive: true });

/* 1分ごとに NOW と締切を更新 */
setInterval(function () { if (day() && $("#sheet").classList.contains("hidden")) renderDay(day()); }, 60000);

if (day()) { try { history.replaceState({ muzeDay: "home" }, ""); history.pushState({ muzeDay: "day" }, ""); } catch (e) {} }
render();
})();
</script>
