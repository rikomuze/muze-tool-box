<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1ebe1">
<meta name="robots" content="noindex">
<title>MUZE DAY | MUZE TOOL BOX</title>
<meta name="description" content="ライブ・フェスの日の、会場入り・ランチ・交換・ミーグリをまとめる当日しおり。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Klee+One:wght@400;600&family=Montserrat:wght@500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#f1ebe1;--paper:#fff;--ink:#40382f;--faded:#6f6456;--muted:#8f8577;--red:#c0472f;
  --berry:#e27a94;--berry-t:rgba(226,122,148,.85);--berry-ink:#a8445f;
  --mint:#a4c5af;--mint-t:rgba(164,197,175,.85);--mint-ink:#4a7556;
  --lav:#bfaee3;--lav-t:rgba(190,172,226,.85);--lav-pale:#efe5ff;--lav-ink:#65559a;
  --butter-t:rgba(240,212,150,.85);--butter-ink:#7a5f22;
  --hand:"Klee One","Zen Kaku Gothic New",sans-serif;
  --gothic:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --en:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --serif:"DM Serif Display",Georgia,serif;
  --shadow:0 10px 24px rgba(64,56,47,.18);--shadow-s:0 4px 12px rgba(64,56,47,.14);
  --dash:1.5px dashed rgba(64,56,47,.35);
}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;color:var(--ink);font-family:var(--gothic);line-height:1.6;-webkit-text-size-adjust:100%;
  background:radial-gradient(rgba(64,56,47,.06) 1px,transparent 1px) 0 0/22px 22px,var(--desk);padding-bottom:170px}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:16px}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--berry);outline-offset:3px}
.hidden{display:none!important}
.wrap{max-width:560px;margin:0 auto}

/* 共通ナビ（muze-key と同じ形） */
.tool-nav{max-width:560px;margin:0 auto;padding:12px 16px 0}
.tool-nav-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(255,255,255,.74);border:1px solid rgba(64,56,47,.14);padding:8px 10px;transform:rotate(-.3deg)}
.tool-nav-brand{font-family:var(--hand);font-size:14px;font-weight:600;white-space:nowrap;text-decoration:none}
.tool-nav-links{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.tool-nav-links::-webkit-scrollbar{display:none}
.tool-nav-links a{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);white-space:nowrap;border-bottom:1px dashed rgba(64,56,47,.28);text-decoration:none}

/* 部品 */
.tape{position:absolute;height:14px;width:44px;transform:rotate(-7deg);z-index:2;pointer-events:none}
.t-berry{background:var(--berry-t)}.t-mint{background:var(--mint-t)}.t-lav{background:var(--lav-t)}.t-butter{background:var(--butter-t)}
.sticker{position:relative;display:inline-block;background:var(--paper);padding:6px 14px 7px;transform:rotate(-2deg);box-shadow:var(--shadow);font-family:var(--hand);font-weight:600;font-size:15px;white-space:nowrap}
.sticker .tape{top:-6px;left:-10px;width:40px;height:13px;transform:rotate(-12deg)}
.sticker span{color:var(--berry-ink)}
.hand{font-family:var(--hand);font-weight:600}
.en{font-family:var(--en);font-weight:700}
.faded{color:var(--faded)}
.small{font-size:12px}
.stamp{display:inline-flex;align-items:center;height:22px;padding:0 9px;border:1.5px solid currentColor;border-radius:999px;font-family:var(--hand);font-weight:600;font-size:11.5px;transform:rotate(-3deg);white-space:nowrap;background:var(--paper)}
.c-berry{color:var(--berry-ink)}.c-mint{color:var(--mint-ink)}.c-lav{color:var(--lav-ink)}.c-butter{color:var(--butter-ink)}
.prio{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:50%;font-family:var(--hand);font-weight:600;font-size:11.5px;white-space:nowrap}
.prio.must{border:1.5px solid var(--red);color:var(--red);transform:rotate(-4deg)}
.prio.maybe{border:1.5px dashed rgba(64,56,47,.45);color:var(--faded);transform:rotate(3deg)}
.chip{min-height:44px;min-width:44px;padding:8px 15px;font-family:var(--hand);font-weight:600;font-size:13.5px;border:1.5px solid var(--ink);border-radius:50%;background:transparent;transform:rotate(2deg)}
.chip:nth-child(2n){transform:rotate(-2deg)}
.chip:nth-child(3n){transform:rotate(1.2deg)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--desk)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.btn{min-height:48px;padding:10px 16px;border:1.5px solid var(--ink);background:var(--paper);font-weight:700;font-size:14px}
.btn.dark{background:var(--ink);color:var(--desk)}
.btn.oval{border-radius:50%;background:transparent;font-family:var(--hand);font-weight:600;transform:rotate(-1.5deg)}
.btn.full{width:100%}
.link{background:none;border:0;padding:8px 4px;font-size:12.5px;color:var(--faded);text-decoration:underline dashed rgba(64,56,47,.4);text-underline-offset:4px;min-height:40px}
.field{display:flex;flex-direction:column}
.field label,.lbl{font-family:var(--hand);font-weight:600;font-size:13px}
.field input,.field select,.field textarea{font-family:var(--hand);font-weight:600;background:transparent;border:0;border-bottom:var(--dash);padding:7px 2px;outline:none;border-radius:0}
.field input::placeholder{color:rgba(64,56,47,.35)}
.hint{font-size:11.5px;color:var(--faded);line-height:1.6}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.paper{position:relative;background:var(--paper);box-shadow:var(--shadow-s)}

/* 日のヘッダー */
.dayhead{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 4px;gap:10px}
.dayhead .right{display:flex;align-items:center;gap:10px}
.kindtag{padding:3px 9px;border:1.5px solid;font-family:var(--en);font-weight:700;font-size:11px;letter-spacing:.18em;transform:rotate(2deg);background:var(--paper)}
.bigdate{font-family:var(--en);font-weight:700;font-size:26px;line-height:1.2}
.bigdate small{font-size:11px;letter-spacing:.16em;margin-left:5px;color:var(--faded)}
.daytitle{padding:6px 16px 12px}
.daytitle button{background:none;border:0;padding:0;text-align:left}
.daytitle .t{font-family:var(--hand);font-weight:600;font-size:15px;line-height:1.45}

/* ビュー切替タブ */
.vtabs{display:flex;gap:10px;padding:0 16px}
.vtab{position:relative;flex:1;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px;background:rgba(255,255,255,.5);border:1.5px dashed rgba(64,56,47,.32);color:var(--faded)}
.vtab:first-child{transform:rotate(-.8deg)}.vtab:last-child{transform:rotate(.8deg)}
.vtab .l{font-size:15px}
.vtab .s{font-size:11px;color:var(--faded)}
.vtab[aria-selected="true"]{background:var(--paper);border:1.5px solid var(--ink);box-shadow:var(--shadow-s);color:var(--ink)}
.vtab[aria-selected="true"]::before{content:"";position:absolute;top:-6px;left:50%;width:40px;height:12px;margin-left:-20px;transform:rotate(-4deg)}
.vtab.ev[aria-selected="true"]::before{background:var(--lav-t)}
.vtab.fes[aria-selected="true"]::before{background:var(--mint-t)}
.vtab.mt[aria-selected="true"]::before{background:var(--berry-t)}
.swipehint{text-align:center;font-size:10.5px;color:var(--faded);margin-top:6px}

/* NOW */
.now{margin:14px 16px 0;display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(255,255,255,.6);border:var(--dash);font-size:12px}
.now .tag{font-family:var(--en);font-weight:700;font-size:10px;letter-spacing:.16em;padding:1px 7px;background:var(--ink);color:var(--desk)}
.now .b{font-family:var(--hand);font-weight:600;font-size:14px}
.now .r{margin-left:auto;text-align:right}

.sec{padding:24px 16px 10px}
.sec h2{margin:0;font-family:var(--hand);font-weight:600;font-size:18px;display:flex;align-items:baseline;gap:8px}
.sec h2 .n{font-family:var(--en);font-size:14px;color:var(--faded)}
.sec p{margin:0;font-size:11.5px;color:var(--faded)}

/* 交換カード */
.trade{margin:0 16px 16px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.trade:nth-child(2n){transform:rotate(.4deg)}.trade:nth-child(2n+1){transform:rotate(-.4deg)}
.trade .tape{top:-7px;right:22px;transform:rotate(5deg)}
.trade .top{display:flex;align-items:center;gap:8px}
.trade .who{font-family:var(--hand);font-weight:600;font-size:19px;line-height:1.3;background:none;border:0;padding:0;text-align:left}
.trade .due{margin-left:auto;text-align:right;line-height:1.25}
.trade .due b{font-family:var(--hand);font-weight:600;font-size:13.5px;display:block}
.trade .due span{font-size:11px;color:var(--faded)}
.swap{display:grid;grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr);align-items:center;gap:6px;padding:8px 10px;background:var(--desk)}
.swap .k{font-family:var(--hand);font-weight:600;font-size:10.5px;color:var(--faded)}
.swap .v{font-size:13.5px;font-weight:700;line-height:1.35;word-break:break-word}
.status{display:flex;align-items:center;gap:8px}
.status .undecided{flex:1;padding:7px 10px;border:var(--dash);font-size:12.5px;line-height:1.45}
.status .fixed{flex:1;display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(164,197,175,.22);font-size:12.5px}
.status .fixed .en{font-size:16px}
.nudge{padding:9px 11px;background:var(--desk);font-family:var(--hand);font-weight:600;font-size:13.5px;line-height:1.5}
.nudge .chips{margin-top:8px}
.logfoot{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--faded)}
.logfoot a{margin-left:auto;text-decoration:underline dashed rgba(64,56,47,.4);text-underline-offset:3px}
.trade.done{opacity:.6}
.donebar{margin:0 16px;font-size:12px;color:var(--faded)}

/* 会えたら */
.bands{padding:0 16px}
.bandh{display:flex;align-items:baseline;gap:8px;margin:8px 0}
.bandh b{font-family:var(--hand);font-weight:600;font-size:14px;padding:0 6px;background:linear-gradient(transparent 60%,rgba(190,172,226,.45) 60%)}
.bandh span{font-size:11px;color:var(--faded)}
.loose{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 12px;margin-bottom:8px;background:rgba(255,255,255,.72);border:1.5px dashed rgba(64,56,47,.35)}
.loose:nth-child(2n){transform:rotate(.5deg)}.loose:nth-child(2n+1){transform:rotate(-.5deg)}
.loose .body{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.loose .nm{font-family:var(--hand);font-weight:600;font-size:16px;margin-right:6px}
.loose .memo{display:block;font-size:11.5px;color:var(--faded);line-height:1.45}
.loose .go{flex-shrink:0;min-height:40px;padding:0 11px;border:1.5px solid var(--ink);border-radius:50%;background:transparent;font-family:var(--hand);font-weight:600;font-size:12px;transform:rotate(2deg)}
.loose.done{opacity:.55}

/* 流れ */
.flowhead{display:flex;align-items:baseline;justify-content:space-between;padding:24px 16px 6px}
.flowhead b{font-family:var(--hand);font-weight:600;font-size:18px}
.flowhead span{font-size:11.5px;color:var(--faded)}
.off{margin:4px 16px;display:flex;align-items:center;gap:10px;padding:7px 12px;background:var(--lav-pale);width:calc(100% - 32px);border:0;text-align:left}
.off.faint{opacity:.75}
.off .en{font-size:14px;width:48px}
.off .hand{font-size:14px}
.off .sub{margin-left:auto;font-size:11.5px;color:var(--faded)}
.off.act{background:rgba(164,197,175,.25)}
.ticket{position:relative;margin:6px 16px;display:flex;background:var(--paper);box-shadow:var(--shadow-s);width:calc(100% - 32px);border:0;padding:0;text-align:left}
.ticket:nth-of-type(2n){transform:rotate(.5deg)}.ticket:nth-of-type(2n+1){transform:rotate(-.5deg)}
.ticket .tape{top:-7px;right:26px;transform:rotate(6deg)}
.ticket .stub{width:74px;flex-shrink:0;padding:14px 0 12px;text-align:center;border-right:2px dashed rgba(64,56,47,.28);position:relative}
.ticket .stub::before,.ticket .stub::after{content:"";position:absolute;right:-8px;width:14px;height:14px;border-radius:50%;background:var(--desk)}
.ticket .stub::before{top:-7px}.ticket .stub::after{bottom:-7px}
.ticket .stub .en{font-size:20px;line-height:1.1}
.ticket .stub .e{font-family:var(--en);font-weight:600;font-size:11px;color:var(--faded)}
.ticket .main{flex:1;min-width:0;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.ticket .nm{font-family:var(--hand);font-weight:600;font-size:18px;line-height:1.3;margin-right:6px}
.ticket .pl{font-size:13px;font-weight:700;line-height:1.45}
.ticket .mk{font-size:12.5px;line-height:1.45}
.ticket.done{opacity:.6}
.ticket .donestamp{position:absolute;right:12px;bottom:10px;font-family:var(--hand);font-weight:600;font-size:12px;color:var(--mint-ink);border:1.5px solid var(--mint-ink);border-radius:50%;padding:0 8px;transform:rotate(-8deg)}
.mini{margin:4px 16px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--paper);box-shadow:var(--shadow-s);width:calc(100% - 32px);border:0;text-align:left}
.mini .en{font-size:14px;width:48px}
.gap{display:flex;padding:4px 16px 4px 52px;align-items:flex-start;gap:0}
.gap .line{border-left:2px dashed rgba(64,56,47,.3);min-height:30px;margin-right:16px;align-self:stretch}
.gap .pill{display:inline-flex;align-items:center;padding:3px 11px;border-radius:999px;font-family:var(--hand);font-weight:600;font-size:12.5px;background:rgba(255,255,255,.7)}
.gap .pill.calm{background:rgba(164,197,175,.3);color:var(--mint-ink)}
.gap .pill.tight{background:rgba(240,212,150,.45);color:#6b521a}
.gap .pill.short{background:var(--paper);color:var(--red);border:1.5px solid var(--red)}
.gap .sub{font-size:11.5px;color:var(--faded);line-height:1.5;margin-top:3px}
.flag{position:relative;margin:6px 16px 6px 64px;padding:7px 10px;border:1.5px dashed var(--mint-ink);background:rgba(255,255,255,.6)}
.flag::before{content:"";position:absolute;left:-14px;top:50%;width:12px;border-top:1.5px dashed var(--mint-ink)}
.flag b{font-family:var(--hand);font-weight:600;font-size:12.5px;color:var(--mint-ink);display:block}
.flag span{font-size:11px;color:var(--faded)}
.zone{display:flex;align-items:center;gap:8px;padding:14px 16px 4px}
.zone::before{content:"";flex:0 0 14px;border-top:var(--dash)}
.zone::after{content:"";flex:1;border-top:var(--dash)}
.zone b{font-family:var(--hand);font-weight:600;font-size:14px;white-space:nowrap}
.zone .nowtag{font-family:var(--en);font-weight:700;font-size:10px;letter-spacing:.16em;padding:1px 7px;background:var(--ink);color:var(--desk)}
.zonesub{padding:0 16px 4px 38px;font-size:11.5px;color:var(--faded)}
.empty{margin:0 16px;padding:14px;border:var(--dash);background:rgba(255,255,255,.45);font-size:12.5px;color:var(--faded);line-height:1.7}

/* LIVE */
.liveticket{margin:18px 16px 0;padding:16px 16px 14px;transform:rotate(-.6deg);box-shadow:var(--shadow)}
.liveticket .tape{top:-8px;left:20px;width:60px;height:17px;transform:rotate(-6deg)}
.liveticket .cap{font-family:var(--en);font-weight:700;font-size:11px;letter-spacing:.2em;color:var(--lav-ink)}
.lt-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:8px;text-align:center}
.lt-grid>div+div{border-left:var(--dash)}
.lt-grid .hand{font-size:12px;color:var(--faded)}
.lt-grid .en{font-size:22px}
.summary{margin:16px 16px 0;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--paper);box-shadow:var(--shadow-s);border:0;width:calc(100% - 32px);text-align:left;transform:rotate(.4deg);font-size:12px}
.summary .hand{font-size:14px;white-space:nowrap}
.summary .go{margin-left:auto;font-size:11.5px;color:var(--faded);white-space:nowrap}
.check{margin:22px 16px 0;padding:14px 16px 10px;transform:rotate(.5deg)}
.check .tape{top:-7px;right:24px;transform:rotate(5deg)}
.check h3{margin:0;font-family:var(--hand);font-weight:600;font-size:16px;display:flex;justify-content:space-between}
.ck{display:flex;align-items:center;gap:8px;min-height:40px;font-size:14px}
.ck input{width:20px;height:20px;accent-color:var(--berry-ink);flex-shrink:0}
.ck.done span{text-decoration:line-through;color:var(--faded)}
.ck .x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:14px;min-width:36px;min-height:36px}
.ckgroup{font-family:var(--hand);font-weight:600;font-size:12px;color:var(--lav-ink);margin-top:6px}
.addck{display:flex;gap:8px;margin-top:6px}
.addck input{flex:1;border:0;border-bottom:var(--dash);background:transparent;padding:6px 2px;font-family:var(--hand);font-weight:600;outline:none}
.addck button{min-height:40px;padding:0 12px;border:1.5px solid var(--ink);background:transparent;font-family:var(--hand);font-weight:600;border-radius:50%}

/* ドック */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);border-top:var(--dash);padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
.dock-inner{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.dock .add{display:flex;align-items:center;gap:4px;min-height:48px;padding:0 16px;background:transparent;border:1.5px solid var(--ink);border-radius:50%;font-family:var(--hand);font-weight:600;font-size:14px;transform:rotate(-2deg);white-space:nowrap}
.dock .main{flex:1;min-height:52px;background:var(--ink);color:var(--desk);border:0;font-weight:700;font-size:14.5px;letter-spacing:.04em}

/* シート */
.sheet{position:fixed;inset:0;z-index:100;background:rgba(64,56,47,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet-inner{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--paper);box-shadow:0 -12px 30px rgba(64,56,47,.25);padding:16px 18px calc(20px + env(safe-area-inset-bottom))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;margin-bottom:14px;border-bottom:var(--dash)}
.sheet-head h2{margin:0;font-family:var(--hand);font-weight:600;font-size:19px}
.close{width:44px;height:44px;border:1.5px solid var(--ink);border-radius:50%;background:transparent;font-size:17px;font-weight:700;transform:rotate(3deg)}
.form{display:flex;flex-direction:column;gap:16px}
.sheet-foot{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));margin:18px -18px calc(-20px - env(safe-area-inset-bottom));padding:12px 18px calc(16px + env(safe-area-inset-bottom));background:var(--paper);border-top:var(--dash);display:flex;flex-direction:column;gap:8px}
.preview{padding:12px;border:var(--dash);background:rgba(255,255,255,.5);font-size:12.5px;line-height:1.7}
.preview .warnline{color:var(--red);font-family:var(--hand);font-weight:600}

/* 日づくり */
.start{padding:18px 16px 0}
.start h1{font-family:var(--hand);font-weight:600;font-size:30px;line-height:1.35;margin:18px 0 0;transform:rotate(-.6deg)}
.start h1 span{border-bottom:3px solid var(--berry-t)}
.dd{margin-top:20px}
.dd-btn{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;background:var(--paper);border:2px solid var(--ink);box-shadow:var(--shadow-s);text-align:left}
.dd-btn .tape{top:-7px;right:40px;transform:rotate(6deg)}
.dd-date{width:50px;flex-shrink:0;text-align:center;line-height:1.15;border-right:2px dashed rgba(64,56,47,.25);padding-right:10px}
.dd-date .en{font-size:17px}
.dd-date small{display:block;font-family:var(--en);font-weight:600;font-size:10px;letter-spacing:.14em;color:var(--faded)}
.dd-body{flex:1;min-width:0}
.dd-name{font-family:var(--hand);font-weight:600;font-size:15px;line-height:1.35;margin-top:3px}
.badge{display:inline-block;padding:1px 7px;border:1.5px solid;font-family:var(--en);font-weight:700;font-size:9.5px;letter-spacing:.14em;background:var(--paper);white-space:nowrap}
.badge.LIVE{color:var(--lav-ink)}.badge.OTHER{color:var(--mint-ink);font-family:var(--hand);letter-spacing:.04em;font-size:10.5px}
.dd-list{background:var(--paper);border:2px solid var(--ink);border-top:0;box-shadow:var(--shadow);max-height:62vh;overflow:auto}
.dd-filter{display:flex;gap:8px;padding:10px 12px;border-bottom:var(--dash);position:sticky;top:0;background:var(--paper);z-index:2}
.dd-month{display:flex;align-items:baseline;gap:8px;padding:12px 12px 4px;background:var(--desk)}
.dd-month b{font-family:var(--hand);font-weight:600;font-size:16px}
.dd-row{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:7px 12px;border:0;border-bottom:1px dashed rgba(64,56,47,.2);background:transparent;text-align:left}
.dd-row[aria-selected="true"]{background:rgba(226,122,148,.12);box-shadow:inset 3px 0 0 var(--berry)}
.dd-row .d{width:42px;flex-shrink:0;line-height:1.15}
.dd-row .d .en{font-size:15px}
.dd-row .d small{display:block;font-family:var(--en);font-weight:600;font-size:9.5px;letter-spacing:.12em;color:var(--faded)}
.dd-row .nm{font-family:var(--hand);font-weight:600;font-size:14px;line-height:1.35}
.dd-row .sub{font-size:11px;color:var(--faded);line-height:1.3}
.dd-note{font-family:var(--hand);font-weight:600;font-size:11px;color:var(--berry-ink);margin-left:6px}
.kinds{display:flex;gap:12px}
.kind{position:relative;flex:1;text-align:left;padding:16px 14px 12px;background:rgba(255,255,255,.55);border:1.5px dashed rgba(64,56,47,.35)}
.kind[aria-pressed="true"]{background:var(--paper);border:2px solid var(--ink);box-shadow:var(--shadow)}
.kind .en{font-size:24px;letter-spacing:.12em;display:block}
.kind small{font-size:11.5px;color:var(--faded);line-height:1.6;display:block}
.kind:first-child{transform:rotate(-1deg)}.kind:last-child{transform:rotate(1deg)}
.box{margin-top:24px;padding:16px 16px 12px}
.box .tape{top:-8px;left:22px;transform:rotate(-5deg)}
.box h3{margin:0;font-family:var(--hand);font-weight:600;font-size:16px;display:flex;align-items:center;gap:7px}
.trow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:var(--dash)}
.trow input[type=text]{width:64px;font-family:var(--hand);font-weight:600;font-size:15px;border:0;background:transparent;outline:none}
.trow input[type=time]{flex:1;font-family:var(--en);font-weight:700;font-size:18px;border:0;background:transparent;outline:none}
.trow .x{background:none;border:0;color:var(--muted);min-width:36px;min-height:36px}
.logrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:var(--dash)}
.logrow input{width:22px;height:22px;accent-color:var(--berry-ink);flex-shrink:0}
.logrow .st{font-size:11px;padding:1px 7px;border:1px solid rgba(64,56,47,.3);white-space:nowrap}
.startfoot{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);border-top:var(--dash);padding:10px 16px calc(14px + env(safe-area-inset-bottom))}
.startfoot .btn{max-width:528px;margin:0 auto;display:block}

/* 会う直前カード */
.meetcard{position:relative;padding:26px 20px 20px;margin:10px 0 0;transform:rotate(-1deg);box-shadow:var(--shadow)}
.meetcard .tape{top:-10px;left:24px;width:72px;height:20px;transform:rotate(-8deg)}
.meetcard .big{font-family:var(--hand);font-weight:600;font-size:36px;line-height:1.2;margin-top:4px;word-break:break-word}
.meetcard .k{font-family:var(--hand);font-weight:600;font-size:13px;color:var(--faded);margin-top:14px}
.meetcard .v{font-weight:700;font-size:20px;line-height:1.45}
.meetcard .mark{font-weight:700;font-size:17px;line-height:1.5;background:linear-gradient(transparent 62%,rgba(226,122,148,.28) 62%);display:inline}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--desk);padding:10px 16px;font-size:13px;z-index:200;max-width:90vw;text-align:center}
.foot{margin:40px auto 0;max-width:520px;padding:0 16px;font-size:11px;color:var(--faded);line-height:1.9;text-align:center}
.shareimg{width:100%;height:auto;box-shadow:var(--shadow-s);border:1px solid rgba(64,56,47,.15)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* 予定をいれる・わたしの予定 */
.addbtn{width:100%;min-height:52px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--paper);border:2px solid var(--ink);box-shadow:var(--shadow-s);font-family:var(--hand);font-weight:600;font-size:16px;transform:rotate(-.4deg)}
.myplans{margin:0 16px;padding:8px 14px 8px;transform:rotate(.3deg)}
.myplans .tape{top:-7px;left:22px;transform:rotate(-5deg)}
.myrow{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:6px 0;border:0;border-bottom:var(--dash);background:transparent;text-align:left}
.myrow .k{width:76px;flex-shrink:0;font-size:15px}
.myrow .en{font-size:17px;width:52px;flex-shrink:0}
.myrow .undecided{width:52px;flex-shrink:0;font-size:13px;color:var(--faded);border:1.5px dashed rgba(64,56,47,.35);text-align:center;border-radius:999px}
.myrow .pl{flex:1;min-width:0;font-size:12.5px;color:var(--faded);line-height:1.4}
.mini.my{background:rgba(240,212,150,.3);box-shadow:none}
.mini.faint{opacity:.75}
.autonote{margin:8px 0 0;font-size:10.5px;color:var(--muted);line-height:1.6}
.linkbar{margin:0 16px 12px;display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(239,229,255,.7);font-size:12px}
.mini.isdone{opacity:.55}
.dock .addbtn{transform:none;box-shadow:none;min-height:46px}
.toast{bottom:150px}
</style>
</head>
<body>
<nav class="tool-nav" aria-label="共通ナビゲーション">
  <div class="tool-nav-inner">

    </div>

</nav>
<main class="wrap" id="app" aria-live="polite"></main>
<div class="foot">MUZE DAY はテスト版です。予定はこの端末（ブラウザ）に保存されます。時間や会場は必ず公式サイトでも確認してね。<br>MAZZEL・BMSG公式とは関係のない非公式ファンメイドツールです。</div>
<div id="dock"></div>
<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></div>
<div id="toast" class="toast hidden" role="status"></div>

<script src="./events.js"></script>
<script>
(function () {
"use strict";

/* ========== 基本 ========== */
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (m) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]; }); }
function uid() { return "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function toMin(t) { if (!t || !/^\d{1,2}:\d{2}$/.test(t)) return null; var p = t.split(":"); return (+p[0]) * 60 + (+p[1]); }
function fmt(m) { if (m == null) return ""; m = ((m % 1440) + 1440) % 1440; return Math.floor(m / 60) + ":" + ("0" + (m % 60)).slice(-2); }
function todayISO() { var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
var DOW = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
function md(iso) { if (!iso) return ""; var p = iso.split("-"); return (+p[1]) + "/" + (+p[2]); }
function dow(iso) { return iso ? DOW[new Date(iso + "T00:00:00").getDay()] : ""; }
function daysUntil(iso) { var a = new Date(iso + "T00:00:00"), b = new Date(todayISO() + "T00:00:00"); return Math.round((a - b) / 86400000); }
function hhmm(ts) { var d = new Date(ts); return (d.getMonth() + 1) + "/" + d.getDate() + " " + d.getHours() + ":" + ("0" + d.getMinutes()).slice(-2); }
function toast(msg) { var t = $("#toast"); t.textContent = msg; t.classList.remove("hidden"); clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.add("hidden"); }, 2600); }
function copyText(s) {
  if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(s).then(function () { toast("コピーしたよ"); }, function () { prompt("コピーしてね", s); }); }
  else prompt("コピーしてね", s);
}
var PIN = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:3px" aria-hidden="true"><path d="M12 21s-6.5-6.2-6.5-11A6.5 6.5 0 0 1 18.5 10c0 4.8-6.5 11-6.5 11z"></path><circle cx="12" cy="10" r="2.3"></circle></svg>';
function keyIcon(s) { return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="var(--lav-ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0" aria-hidden="true"><circle cx="8" cy="15" r="4"></circle><path d="M11 12l8-8M16 7l2.5 2.5M14 9l2 2"></path></svg>'; }
function chev(up) { return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;' + (up ? "transform:rotate(180deg)" : "") + '"><path d="M6 9l6 6 6-6"></path></svg>'; }
var KIND_LABEL = { LIVE: "LIVE", OTHER: "その他" };
function kindOf(d) { return d.kind === "LIVE" ? "LIVE" : "OTHER"; }

/* ========== 保存（MUZE DAY 自身の予定はこの端末だけ） ========== */
var STORE = "muze_day_v2";
var db = load();
function load() {
  var d = null;
  try { d = JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) {}
  if (!d) { /* テスト版1（KEYごとに保存していた頃）のデータを引きつぐ */
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf("muze_day_v1:") === 0) { try { var o = JSON.parse(localStorage.getItem(k)); if (o && o.days && (!d || o.days.length > d.days.length)) d = o; } catch (e) {} }
    }
  }
  if (!d || !d.days) d = { days: [], current: null };
  d.days.forEach(migrate);
  return d;
}
function migrate(d) {
  d.kind = kindOf(d);
  d.official = (d.official || []).filter(function (o) { return o.label !== "終演"; });
  d.trades = d.trades || []; d.meets = d.meets || []; d.checklist = d.checklist || [];
  if (!d.myplans) d.myplans = defaultMyPlans();
  d.myplans.forEach(function (p) { if (MYKINDS.indexOf(p.kind) < 0) { p.name = p.name || p.kind; p.kind = "その他"; } });
  d.checklist.forEach(function (c) { if (/うちわ|ペンライト/.test(c.text)) c.text = "ライトバンド"; });
  if (d.kind === "OTHER") d.checklist = d.checklist.filter(function (c) { return c.text !== "ライトバンド" || c.keep; });
  delete d.acts;
  if (d.view !== "meet") d.view = "event";
}
function save() { try { localStorage.setItem(STORE, JSON.stringify(db)); } catch (e) { toast("保存できなかったよ（容量やプライベートモードを確認してね）"); } }
function day() { return db.days.filter(function (d) { return d.id === db.current; })[0] || null; }

/* ========== 交換約束ログ（MUZE KEY で読み込む・読み取りだけ） ========== */
var LINK = "muze_day_link_v1";
var API = "https://muze-toolbox-api.logical-bear-ishi.workers.dev/api/exchange-v2";
var link = (function () { try { return JSON.parse(localStorage.getItem(LINK) || "null") || {}; } catch (e) { return {}; } })();
function saveLink() { try { localStorage.setItem(LINK, JSON.stringify(link)); } catch (e) {} }
function normKey(v) {
  var s = String(v || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (/^MUZE[A-Z2-9]{12}$/.test(s)) s = "MUZE-" + s.slice(4, 8) + "-" + s.slice(8, 12) + "-" + s.slice(12, 16);
  return /^MUZE-[A-Z2-9]{4}-[A-Z2-9]{4}-[A-Z2-9]{4}$/.test(s) ? s : "";
}
function maskKey(k) { var p = String(k || "").split("-"); return p.length === 4 ? "MUZE-••••-••••-" + p[3] : ""; }
function deviceKey() { return normKey(localStorage.getItem("muze_tool_box_key_v1")); }
function b64(s) { var bin = atob(s), out = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
function sha256Hex(v) { return crypto.subtle.digest("SHA-256", new TextEncoder().encode(v)).then(function (d) { return Array.prototype.map.call(new Uint8Array(d), function (b) { return ("0" + b.toString(16)).slice(-2); }).join(""); }); }
function fetchLog(k) {
  return sha256Hex("MUZE-TOOL-BOX:EXCHANGE:ID:V2:" + k).then(function (id) {
    return fetch(API, { method: "GET", headers: { "X-MUZE-ID": id } });
  }).then(function (res) { if (!res.ok) throw new Error("http " + res.status); return res.json(); }).then(function (data) {
    if (!data || !data.found || !data.envelope) return null;
    var e = data.envelope;
    return crypto.subtle.importKey("raw", new TextEncoder().encode(k), "PBKDF2", false, ["deriveKey"]).then(function (mat) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(e.salt), iterations: e.iter || 180000, hash: "SHA-256" }, mat, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    }).then(function (aes) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(e.iv) }, aes, b64(e.ct)); })
      .then(function (plain) { var rows = JSON.parse(new TextDecoder().decode(plain)); if (!Array.isArray(rows)) throw new Error("rows"); return rows; });
  });
}
/* KEYで読み込んだログがあればそれを、なければこの端末の交換約束ログを使う */
function logRows() {
  if (link.key && Array.isArray(link.rows)) return link.rows;
  var k = deviceKey(); if (!k) return [];
  try { var r = JSON.parse(localStorage.getItem("muze_exchange_log_v1:" + k) || "[]"); return Array.isArray(r) ? r : []; } catch (e) { return []; }
}
function linkedLabel() { return link.key ? maskKey(link.key) : deviceKey() && logRows().length ? maskKey(deviceKey()) + "（この端末）" : ""; }
function refreshLink(silent) {
  if (!link.key) return Promise.resolve();
  return fetchLog(link.key).then(function (rows) {
    if (rows) { link.rows = rows; link.at = Date.now(); saveLink(); if (!silent) toast("交換約束ログを読み込んだよ（" + openLogRows().length + "件）"); render(); }
    else if (!silent) toast("このKEYのクラウド保存が見つからなかったよ");
  }).catch(function () { if (!silent) toast("読み込めなかったよ。電波のいいところでもう一度ためしてね"); });
}
function itemsText(items) {
  return (items || []).map(function (i) { var who = i.member || i.other || ""; return (who + (i.type ? " " + i.type : "")).trim() || i.detail || ""; }).filter(Boolean).join("・");
}
function logDate(r) { return r.dueDate || r.promiseDate || ""; }
function openLogRows() { return logRows().filter(function (r) { return r.tradeType !== "買取" && r.status !== "交換完了" && r.status !== "受取完了" && r.method !== "郵送"; }); }
function refreshFromLog(d) {
  var map = {}; logRows().forEach(function (r) { map[r.id] = r; });
  d.trades.forEach(function (t) {
    var r = t.logId && map[t.logId]; if (!r) return;
    t.who = r.name || t.who; t.give = itemsText(r.giveItems) || t.give; t.get = itemsText(r.getItems) || t.get; t.logStatus = r.status;
    if (r.status === "交換完了") t.done = true;
  });
}
function tradeFromLog(r) { return { id: uid(), logId: r.id, who: r.name || "", give: itemsText(r.giveItems), get: itemsText(r.getItems), priority: r.status === "約束済" ? "must" : "maybe", place: "", time: "", done: false, logStatus: r.status }; }

/* ========== 日の構造 ========== */
var MYKINDS = ["家を出る", "ランチ", "物販", "会場入り", "その他"];
function offTime(d, label) { var o = d.official.filter(function (x) { return x.label === label; })[0]; return o ? toMin(o.time) : null; }
function bands(d) {
  var r = [];
  if (offTime(d, "物販") != null) r.push({ id: "goods", label: "物販前" });
  r.push({ id: "open", label: "開場前" });
  r.push({ id: "after", label: "終演後" });
  r.push({ id: "any", label: "どこかで" });
  return r;
}
function bandLabel(d, id) { var b = bands(d).filter(function (x) { return x.id === id; })[0]; return b ? b.label : "どこかで"; }
function myLabel(p) { return p.kind === "その他" ? (p.name || "予定") : p.kind; }
function itemName(i) { return i.type === "off" ? i.x.label : i.type === "my" ? myLabel(i.x) : i.x.who; }
function timedItems(d) {
  var items = [];
  d.official.forEach(function (o) { var m = toMin(o.time); if (m != null) items.push({ type: "off", t: m, x: o }); });
  d.myplans.forEach(function (p) { if (toMin(p.time) != null) items.push({ type: "my", t: toMin(p.time), x: p }); });
  d.trades.forEach(function (x) { if (toMin(x.time) != null) items.push({ type: "trade", t: toMin(x.time), x: x }); });
  d.meets.forEach(function (x) { if (toMin(x.time) != null) items.push({ type: "meet", t: toMin(x.time), x: x }); });
  items.sort(function (a, b) { return a.t - b.t || (a.type === "off" ? -1 : 1); });
  return items;
}
function defaultMyPlans() { return [{ id: uid(), kind: "会場入り", time: "", place: "", memo: "" }, { id: uid(), kind: "ランチ", time: "", place: "", memo: "" }]; }
function defaultChecklist(kind) {
  var list = ["電子チケット（スクショも）", "本人確認書類", "ライトバンド", "モバイルバッテリー", "小銭・交通系IC"];
  if (kind === "OTHER") list = list.filter(function (t) { return t !== "ライトバンド"; });
  return list.map(function (t) { return { id: uid(), text: t, done: false }; });
}

/* ========== 状態 ========== */
var ui = { dd: false, ddFilter: "all", sheet: null, home: false };
var draft = null;
function newDraft() { return { presetId: null, kind: "LIVE", date: "", title: "", venue: "", official: [{ label: "物販", time: "" }, { label: "開場", time: "" }, { label: "開演", time: "" }], imports: {}, custom: false }; }

/* ========== 描画 ========== */
function render() {
  var d = day();
  if (!d || ui.home) { if (!draft) draft = newDraft(); renderStart(); return; }
  refreshFromLog(d);
  renderDay(d);
}

/* ----- 最初の画面 ----- */
function presets() {
  var t = todayISO();
  return (window.MUZE_DAY_EVENTS || []).filter(function (e) { return e.date >= t; }).sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
}
function presetById(id) { return (window.MUZE_DAY_EVENTS || []).filter(function (e) { return e.id === id; })[0]; }
function presetSub(e) { var o = (e.official || []).map(function (x) { return x.label + x.time; }).join(" "); return e.venue + (o ? " ・ " + o : " ・ 時間は発表待ち"); }
function savedDays() {
  if (!db.days.length) return "";
  var list = db.days.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  return '<div style="margin-top:22px"><div class="lbl" style="font-size:16px;margin-bottom:6px">つくった日</div>' +
    list.map(function (d) {
      var n = daysUntil(d.date), when = n > 0 ? "あと" + n + "日" : n === 0 ? "当日" : "おわった日";
      return '<button type="button" class="mini" style="margin:6px 0;width:100%;min-height:56px" data-act="open-day" data-id="' + d.id + '"><span class="en" style="width:auto;min-width:48px">' + md(d.date) + '</span><span style="flex:1;min-width:0"><span class="hand" style="display:block;font-size:14px;line-height:1.35">' + esc(d.title) + '</span><span class="hint">' + KIND_LABEL[d.kind] + ' ・ ' + esc(d.venue || "") + '</span></span><span class="hint" style="white-space:nowrap">' + when + ' →</span></button>';
    }).join("") + '</div>';
}
function renderStart() {
  var p = draft.presetId ? presetById(draft.presetId) : null;
  var html = '<div class="start"><div class="sticker"><i class="tape t-berry"></i>MUZE <span>DAY</span></div>' + savedDays() +

        var lines = wrap(ms.map(function (m) { return m.who; }).join("・"), L + 200, y, R - L - 200, 44, "600 28px " + HAND);
        y += 44 * lines + 12;
      });
    }
    var tradeItems = d.trades.filter(function (t) { return !t.done && t.give; });
    if (d.checklist.length || tradeItems.length) {
      head("持ち物");
      var all = d.checklist.map(function (c) { return { t: c.text, on: c.done }; }).concat(tradeItems.map(function (t) { return { t: t.give + "（" + t.who + "）", on: !!t.packed }; }));
      var two = all.length > 6, colW = (R - L) / 2;
      all.forEach(function (it, k) {
        var col = two ? k % 2 : 0, px = L + col * colW;
        box(px, y, it.on); x.font = "500 26px " + GOTH; text(clip(it.t, (two ? colW : R - L) - 60, x), px + 46, y, "500 26px " + GOTH);
        if (!two || col === 1 || k === all.length - 1) y += 54;
      });
    }
    y += 40; text("MUZE TOOL BOX ♡", R - 230, y, "600 20px " + EN, FADED);
    var H = Math.max(1350, y + 120);
    var out = document.createElement("canvas"); out.width = W; out.height = H; var o = out.getContext("2d");
    o.fillStyle = "#f1ebe1"; o.fillRect(0, 0, W, H);
    o.fillStyle = "rgba(64,56,47,.06)"; for (var gx = 0; gx < W; gx += 44) for (var gy = 0; gy < H; gy += 44) { o.beginPath(); o.arc(gx, gy, 2, 0, 7); o.fill(); }
    o.save(); o.shadowColor = "rgba(64,56,47,.2)"; o.shadowBlur = 40; o.shadowOffsetY = 18; o.fillStyle = "#fff"; o.fillRect(64, 96, W - 128, H - 170); o.restore();
    function tape(tx, ty, w, h, col, r) { o.save(); o.translate(tx, ty); o.rotate(r); o.fillStyle = col; o.fillRect(-w / 2, -h / 2, w, h); o.restore(); }
    tape(220, 100, 170, 44, "rgba(226,122,148,.85)", -0.12); tape(W - 230, 102, 140, 40, "rgba(164,197,175,.85)", 0.09);
    o.drawImage(c, 0, 0, W, H, 0, 0, W, H);
    return out.toDataURL("image/png");
  });
}
function clip(t, w, x) { t = String(t || ""); if (x.measureText(t).width <= w) return t; while (t.length && x.measureText(t + "…").width > w) t = t.slice(0, -1); return t + "…"; }
function saveImg() {
  var img = $("#share-img"); if (!img || !img.src) return;
  var a = document.createElement("a"); a.href = img.src; a.download = "muze-day-" + (day().date || "") + ".png";
  document.body.appendChild(a); a.click(); a.remove(); toast("保存できないときは画像を長押ししてね");
}

/* ========== 操作 ========== */
document.addEventListener("click", function (e) {
  var chipEl = e.target.closest("[data-chip]");
  if (chipEl) {
    var g = chipEl.getAttribute("data-chip");
    $$('#sheet [data-chip="' + g + '"]').forEach(function (b) { b.setAttribute("aria-pressed", String(b === chipEl)); });
    if (g === "offl") { var ol = $("#o-label"); if (ol) ol.value = ""; }
    if (g === "mykind") { var w = $("#my-name-wrap"); if (w) w.classList.toggle("hidden", chipEl.getAttribute("data-v") !== "その他"); }
    return;
  }
  var el = e.target.closest("[data-act]"); if (!el) return;
  var act = el.getAttribute("data-act"), id = el.getAttribute("data-id"), k = el.getAttribute("data-k"), v = el.getAttribute("data-v"), d = day();
  switch (act) {
    case "dd": ui.dd = !ui.dd; renderStart(); break;
    case "ddf": ui.ddFilter = v; renderStart(); break;
    case "pick": pickPreset(id); renderStart(); break;
    case "custom": draft = newDraft(); draft.custom = true; ui.dd = false; renderStart(); break;
    case "kind": draft.kind = v; renderStart(); break;
    case "off-add": draft.official.push({ label: "", time: "" }); renderStart(); break;
    case "off-del": draft.official.splice(+el.getAttribute("data-i"), 1); renderStart(); break;
    case "create": createDay(); break;
    case "home": goHome(); break;
    case "open-day": openDay(id); break;
    case "view": d.view = v; save(); renderDay(d); window.scrollTo(0, 0); break;
    case "add": sheetAdd(d.view === "meet" ? "trade" : "my"); break;
    case "add-kind": sheetAdd(v); break;
    case "add-off": closeSheet(); sheetOff(null); break;
    case "close": closeSheet(); break;
    case "edit-my": sheetMy(findItem("my", id)); break;
    case "edit-trade": closeSheet(); sheetTrade(findItem("trade", id)); break;
    case "edit-meet": sheetMeet(findItem("meet", id)); break;
    case "edit-off": closeSheet(); sheetOff(d.official.filter(function (o) { return o.id === id; })[0]); break;
    case "fix": closeSheet(); sheetFix(k, id); break;
    case "detail": sheetDetail(k, id); break;
    case "key": closeSheet(); sheetKey(); break;
    case "use-device-key": $("#k-in").value = deviceKey(); break;
    case "connect": connectKey(); break;
    case "unlink": link = {}; saveLink(); closeSheet(); render(); toast("つなぐのをやめたよ"); break;
    case "relink": refreshLink(false); break;
    case "pick-log": closeSheet(); sheetPickLog(); break;
    case "save-pick":
      var map = {}; openLogRows().forEach(function (r) { map[r.id] = r; }); var n = 0;
      $$("#sheet [data-pick]").forEach(function (cb) { if (cb.checked && map[cb.getAttribute("data-pick")]) { d.trades.push(tradeFromLog(map[cb.getAttribute("data-pick")])); n++; } });
      save(); closeSheet(); d.view = "meet"; render(); toast(n ? "交換を " + n + "件 いれたよ" : "えらばれていなかったよ"); break;
    case "daymenu": sheetDayMenu(); break;
    case "share": sheetShare(); break;
    case "save-img": saveImg(); break;
    case "dm": var mm = $("#my-mark"); if (mm) { d.myMark = mm.value.trim(); save(); } copyText(dmText(k, id)); break;
    case "trade-done": var td = findItem("trade", id); td.done = !td.done; save(); closeSheet(); render(); toast(td.done ? "交換できた！" + (td.logId ? "（ログのステータスは交換約束ログで更新してね）" : "") : "まだにもどしたよ"); break;
    case "meet-done": var m2 = findItem("meet", id); m2.done = !m2.done; save(); closeSheet(); render(); toast(m2.done ? "会えた！" : "まだにもどしたよ"); break;
    case "unfix": var uf = findItem(k, id); uf.time = ""; save(); closeSheet(); render(); break;
    case "del":
      if (!confirm("消していい？")) return;
      if (k === "trade") d.trades = d.trades.filter(function (x) { return x.id !== id; });
      if (k === "meet") d.meets = d.meets.filter(function (x) { return x.id !== id; });
      if (k === "my") d.myplans = d.myplans.filter(function (x) { return x.id !== id; });
      if (k === "off") d.official = d.official.filter(function (x) { return x.id !== id; });
      save(); closeSheet(); render(); break;
    case "save-my": saveMy(); break;
    case "save-trade": saveTrade(); break;
    case "save-meet": saveMeet(); break;
    case "save-off": saveOff(); break;
    case "save-fix": saveFix(); break;
    case "save-daymenu": d.title = val("dm-title") || d.title; d.venue = val("dm-venue"); d.date = val("dm-date") || d.date; d.myMark = val("dm-mark"); save(); closeSheet(); render(); break;
    case "del-day": if (!confirm("この日をまるごと消していい？（交換約束ログは消えないよ）")) return; db.days = db.days.filter(function (x) { return x.id !== d.id; }); db.current = db.days[0] ? db.days[0].id : null; save(); goHome(); break;
    case "ck-add": var inp = $("#ck-new"); if (inp && inp.value.trim()) { d.checklist.push({ id: uid(), text: inp.value.trim(), done: false, keep: true }); save(); renderDay(d); } break;
    case "ck-del": e.preventDefault(); d.checklist = d.checklist.filter(function (c) { return c.id !== id; }); save(); renderDay(d); break;
  }
});
document.addEventListener("change", function (e) {
  var t = e.target, d = day();
  if (t.hasAttribute("data-draft")) { draft[t.getAttribute("data-draft")] = t.value; if (t.getAttribute("data-draft") === "date") renderStart(); return; }
  if (t.hasAttribute("data-off-label")) { draft.official[+t.getAttribute("data-off-label")].label = t.value; return; }
  if (t.hasAttribute("data-off-time")) { draft.official[+t.getAttribute("data-off-time")].time = t.value; return; }
  if (t.hasAttribute("data-imp")) { draft.imports[t.getAttribute("data-imp")] = t.checked; return; }
  if (t.hasAttribute("data-ck")) { var c = d.checklist.filter(function (x) { return x.id === t.getAttribute("data-ck"); })[0]; c.done = t.checked; save(); renderDay(d); return; }
  if (t.hasAttribute("data-pack")) { var p = findItem("trade", t.getAttribute("data-pack")); p.packed = t.checked; save(); renderDay(d); return; }
});
document.addEventListener("input", function (e) { if (e.target.hasAttribute && e.target.hasAttribute("data-draft")) draft[e.target.getAttribute("data-draft")] = e.target.value; });
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("#sheet").classList.contains("hidden")) closeSheet(); if (e.key === "Enter" && e.target.id === "ck-new") { e.preventDefault(); $('[data-act="ck-add"]').click(); } });
$("#sheet").addEventListener("click", function (e) { if (e.target.id === "sheet") closeSheet(); });

function connectKey() {
  var k = normKey(val("k-in"));
  if (!k) { toast("MUZE-XXXX-XXXX-XXXX の形で入れてね"); return; }
  var btn = $('#sheet [data-act="connect"]'); if (btn) { btn.disabled = true; btn.textContent = "読み込み中…"; }
  fetchLog(k).then(function (rows) {
    if (!rows) { if (btn) { btn.disabled = false; btn.textContent = "読み込む"; } toast("このKEYのクラウド保存が見つからなかったよ。交換約束ログ側で同期されているか確認してね"); return; }
    link = { key: k, rows: rows, at: Date.now() }; saveLink(); closeSheet(); render();
    toast("つながったよ。手渡し交換 " + openLogRows().length + "件");
  }).catch(function () { if (btn) { btn.disabled = false; btn.textContent = "読み込む"; } toast("読み込めなかったよ。KEYと電波を確認してね"); });
}
function saveMy() {
  var d = day(), s = ui.sheet, p = s.id ? findItem("my", s.id) : null, kind = chipVal("mykind") || "その他";
  if (kind === "その他" && !val("p-name")) { toast("予定の名前を入れてね"); return; }
  if (!p) { p = { id: uid() }; d.myplans.push(p); }
  p.kind = kind; p.name = kind === "その他" ? val("p-name") : ""; p.time = val("p-time"); p.place = val("p-place"); p.memo = val("p-memo");
  save(); closeSheet(); d.view = "event"; render(); toast("予定にいれたよ");
}
function saveTrade() {
  var d = day(), s = ui.sheet, t = s.id ? findItem("trade", s.id) : null;
  if (!t) { if (!val("t-who")) { toast("だれと交換するか入れてね"); return; } t = { id: uid(), done: false }; d.trades.push(t); }
  if (!t.logId) { t.who = val("t-who") || t.who; t.give = val("t-give"); t.get = val("t-get"); }
  t.priority = chipVal("prio") || "must"; t.time = val("t-time"); t.place = val("t-place");
  save(); closeSheet(); d.view = "meet"; render(); toast("交換をいれたよ");
}
function saveMeet() {
  var d = day(), s = ui.sheet, m = s.id ? findItem("meet", s.id) : null;
  if (!m) { if (!val("m-who")) { toast("だれに会いたいか入れてね"); return; } m = { id: uid(), time: "", place: "", done: false }; d.meets.push(m); }
  m.who = val("m-who") || m.who; m.band = chipVal("band") || "any"; m.mark = val("m-mark"); m.memo = val("m-memo");
  save(); closeSheet(); d.view = "meet"; render(); toast("ミーグリにいれたよ");
}
function saveOff() {
  var d = day(), s = ui.sheet, label = val("o-label") || chipVal("offl"), time = val("o-time");
  if (!label || !time) { toast("名前と時刻を入れてね"); return; }
  var o = s.id ? d.official.filter(function (x) { return x.id === s.id; })[0] : null;
  if (!o) { o = { id: uid() }; d.official.push(o); }
  o.label = label; o.time = time; save(); closeSheet(); render();
}
function saveFix() {
  var s = ui.sheet, x = findItem(s.k, s.id); if (!x) return;
  if (!val("x-time")) { toast("時刻を入れてね"); return; }
  x.time = val("x-time"); x.place = val("x-place"); x.mark = val("x-mark");
  save(); closeSheet(); render(); toast("保存したよ");
}

/* 画面の行き来（ブラウザの「戻る」でも最初の画面へ） */
function openDay(id) {
  db.current = id; ui.home = false; draft = null; save(); render(); window.scrollTo(0, 0);
  try { history.pushState({ muzeDay: "day" }, ""); } catch (e) {}
  refreshLink(true);
}
function goHome() { ui.home = true; ui.dd = false; draft = newDraft(); closeSheet(); render(); window.scrollTo(0, 0); }
window.addEventListener("popstate", function () {
  if (!$("#sheet").classList.contains("hidden")) { closeSheet(); return; }
  if (day() && !ui.home) goHome();
});

/* スワイプで切りかえ */
var sx = null, sy = null;
$("#app").addEventListener("touchstart", function (e) { var t = e.touches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
$("#app").addEventListener("touchend", function (e) {
  if (sx == null) return; var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy; sx = null;
  var d = day(); if (!d || ui.home || Math.abs(dx) < 70 || Math.abs(dy) > 50) return;
  if (e.target.closest(".dd-list,input,textarea")) return;
  d.view = dx < 0 ? "meet" : "event"; save(); renderDay(d);
}, { passive: true });

save();
if (day()) { try { history.replaceState({ muzeDay: "home" }, ""); history.pushState({ muzeDay: "day" }, ""); } catch (e) {} refreshLink(true); }
render();
})();
</script>
